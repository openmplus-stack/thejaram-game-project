<!doctype html><html lang='ko'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><meta name="description" content="초등학교 6학년 발달장애 아동의 한국어 문장 구성과 표현을 돕는 단계형 학습 앱"><title>문장 만들기</title><style>
:root{color-scheme:only light;--green:#3d7b4c;--deep:#285a37;--cream:#fffaf0;--card:rgba(255,255,255,.92);--shadow:0 10px 30px rgba(46,74,43,.15)}
*{box-sizing:border-box}html{background:#eef5df;color-scheme:only light}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans KR",sans-serif;color:#314033;background:#eef5df}button,input{font:inherit;color-scheme:light}
.app{max-width:560px;margin:auto;min-height:100dvh;padding:20px 18px 42px;background:linear-gradient(180deg,#f5f1df 0%,#e7f1d9 58%,#eef5df 100%);position:relative;overflow:hidden}
.app:before,.app:after{content:"";position:absolute;border-radius:50%;pointer-events:none}.app:before{width:240px;height:240px;right:-100px;top:80px;background:rgba(255,255,255,.35)}.app:after{width:320px;height:130px;left:-90px;bottom:-40px;background:rgba(120,164,101,.10)}
.top{position:relative;z-index:1;display:flex;justify-content:space-between;align-items:center;margin:2px 2px 14px}.badge{font-size:19px;font-weight:950;color:var(--deep)}#stepText{font-size:13px;font-weight:900;color:var(--green);background:rgba(255,255,255,.78);padding:7px 11px;border-radius:999px}
.progress{position:relative;z-index:1;height:9px;background:#d4dfcc;border-radius:99px;overflow:hidden}.bar{height:100%;background:var(--green);width:0;transition:.3s;border-radius:99px}
.card{position:relative;z-index:1;background:var(--card);backdrop-filter:blur(7px);border:1px solid rgba(255,255,255,.75);border-radius:24px;padding:22px;margin-top:18px;box-shadow:var(--shadow)}
h1{font-size:27px;line-height:1.35;margin:0 0 8px;color:#314033;word-break:keep-all}p.help{font-size:16px;line-height:1.55;color:#657064;margin:0 0 20px}
.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.choice{min-height:58px;border:1px solid #d9dfd4;border-bottom-width:3px;background:#fff;border-radius:16px;padding:13px 10px;font-size:17px;line-height:1.35;font-weight:800;color:#40513f;cursor:pointer;box-shadow:0 2px 0 rgba(70,90,65,.04)}.choice:hover,.choice.selected{border-color:#6e9a75;background:#edf6e9;color:var(--deep);box-shadow:0 3px 10px rgba(70,105,67,.12)}
.more-wrap{margin-top:14px}.btn{border:0;border-radius:16px;padding:14px 16px;font-size:16px;font-weight:850;cursor:pointer}.more{width:100%;background:#edf4e8;color:var(--deep)}.extra{margin-top:10px}
.custom{margin-top:18px;border-top:1px solid #e1e6dc;padding-top:17px}.custom label{font-size:14px;font-weight:900;color:var(--green)}.custom-row{display:flex;gap:8px;margin-top:9px}.custom input{min-width:0;flex:1;border:1px solid #d9dfd4;border-radius:14px;padding:13px 14px;background:#fff;font-size:17px;outline:none}.custom input:focus{border-color:#6e9a75;box-shadow:0 0 0 3px rgba(61,123,76,.08)}.add{background:#edf4e8;color:var(--deep);white-space:nowrap}
.next{width:100%;background:var(--green);color:#fff;margin-top:18px;box-shadow:0 6px 14px rgba(61,123,76,.18)}.next:disabled{opacity:.35;box-shadow:none}
.sentence{font-size:23px;line-height:1.75;font-weight:850;color:#314033;background:#f1f7ed;border:1px solid #dbe8d5;border-radius:18px;padding:19px;margin:17px 0;word-break:keep-all}.parts{font-size:13px;color:#71806f;text-align:center}.actions{display:grid;grid-template-columns:1fr 1fr;gap:9px}.actions .btn{background:#edf4e8;color:var(--deep)}.actions .primary{background:var(--green);color:#fff}.notice{background:#fff8e8;border:1px solid #ead9ae;border-radius:16px;padding:14px;margin:14px 0;font-size:16px;line-height:1.55;color:#665b3e}
@media(max-width:430px){.app{padding:16px 14px 34px}.card{padding:18px}.choices{grid-template-columns:1fr 1fr;gap:8px}.choice{font-size:16px;padding:11px 7px}h1{font-size:24px}.custom-row{flex-wrap:wrap}.custom input{flex-basis:100%}.add{width:100%}}
</style></head><body><main class='app'><div class='top'><div class='badge'>문장 만들기</div><div id='stepText'>1 / 6</div></div><div class='progress'><div id='bar' class='bar'></div></div><section id='card' class='card'></section></main><script>
const steps=[
{key:'time',q:'언제 일어난 일이에요?',help:'시간을 하나 골라 주세요.',items:['오늘 아침에','오늘 점심에','오늘 오후에','오늘 저녁에','어제','주말에','쉬는 시간에','수업 시간에','방과 후에','저녁을 먹고 나서'],examples:['학교에 가기 전에','학교에 도착한 뒤에','점심을 먹기 전에','점심을 먹고 나서','체육 시간에','하교할 때','집에 돌아온 뒤에','숙제를 하기 전에','잠자기 전에','지난 주말에']},
{key:'place',q:'어디에서 있었어요?',help:'장소를 하나 골라 주세요.',items:['교실에서','학교 운동장에서','급식실에서','도서관에서','집에서','학원에서','편의점에서','공원에서','버스 안에서','놀이터에서'],examples:['학교 복도에서','보건실에서','음악실에서','체육관에서','학교 앞에서','마트에서','식당에서','지하철에서','친구 집에서','동네 길에서']},
{key:'subject',q:'누가 했어요?',help:'사람을 하나 골라 주세요.',items:['나는','친구는','선생님은','엄마는','아빠는','형은','누나는','동생은','반 친구는','우리 가족은'],examples:['짝꿍은','친한 친구는','우리 반 친구들은','담임 선생님은','체육 선생님은','할머니는','할아버지는','사촌은','가게 직원은','버스 기사님은']},
{key:'object',q:'무엇을 했어요?',help:'사물을 하나 골라 주세요.',items:['책을','숙제를','공을','휴대전화를','가방을','우산을','물을','간식을','사진을','선물을'],examples:['연필을','공책을','교과서를','급식판을','옷을','신발을','자전거를','음료수를','게임을','준비물을']},
{key:'predicate',q:'어떻게 했어요?',help:'행동을 하나 골라 주세요.',items:['읽었어요','했어요','던졌어요','사용했어요','챙겼어요','마셨어요','먹었어요','찍었어요','주었어요','찾았어요'],examples:['썼어요','열었어요','닫았어요','들었어요','옮겼어요','샀어요','빌렸어요','돌려주었어요','정리했어요','만들었어요']},
{key:'reason',q:'왜 그렇게 했어요?',help:'이유를 하나 골라 주세요.',items:['필요했기 때문에','재미있어서','궁금해서','배가 고파서','목이 말라서','친구를 도와주려고','잊어버리지 않으려고','선생님이 부탁하셔서','비가 왔기 때문에','기분이 좋아서'],examples:['수업에 필요해서','숙제를 끝내려고','약속을 지키기 위해서','친구가 부탁했기 때문에','엄마가 말씀하셔서','시간이 부족해서','날씨가 더워서','추웠기 때문에','준비물이 없어서','다음 날 사용하려고']}
];
let idx=0, ans={}, expanded={};const card=document.querySelector('#card'),bar=document.querySelector('#bar'),stepText=document.querySelector('#stepText');
function render(){let s=steps[idx];stepText.textContent=`${idx+1} / ${steps.length}`;bar.style.width=`${idx/steps.length*100}%`;card.innerHTML=`<h1>${s.q}</h1><p class='help'>${s.help}</p><div class='choices'>${s.items.map(x=>`<button class='choice ${ans[s.key]===x?'selected':''}' data-v='${x}'>${x}</button>`).join('')}</div><div class='more-wrap'><button class='btn more' id='more'>${expanded[s.key]?'− 예시 접기':'+ 예시 10개 더 보기'}</button>${expanded[s.key]?`<div class='choices extra'>${s.examples.map(x=>`<button class='choice ${ans[s.key]===x?'selected':''}' data-v='${x}'>${x}</button>`).join('')}</div>`:''}</div><div class='custom'><label>내가 직접 쓰기</label><div class='custom-row'><input id='custom' placeholder='직접 입력해 보세요'><button class='btn add' id='add'>넣기</button></div></div><button class='btn next' id='next' ${ans[s.key]?'':'disabled'}>${idx===steps.length-1?'문장 만들기':'다음'}</button><div style='clear:both'></div>`;card.querySelectorAll('.choice').forEach(b=>b.onclick=()=>{ans[s.key]=b.dataset.v;render()});card.querySelector('#more').onclick=()=>{expanded[s.key]=!expanded[s.key];render()};card.querySelector('#add').onclick=()=>{let v=card.querySelector('#custom').value.trim();if(v){ans[s.key]=v;render()}};card.querySelector('#next').onclick=()=>{if(idx<steps.length-1){idx++;render()}else finish()}}
function stripParticle(x){return x.replace(/(은|는|이|가|을|를)$/,'')}function hasBatchim(word){let c=word.charCodeAt(word.length-1);return c>=0xAC00&&c<=0xD7A3&&((c-0xAC00)%28)!==0}function subj(x){if(/(은|는|이|가)$/.test(x))return x;let w=stripParticle(x);return w+(hasBatchim(w)?'은':'는')}function obj(x){if(/(을|를)$/.test(x))return x;let w=stripParticle(x);return w+(hasBatchim(w)?'을':'를')}
function semanticOK(){let o=stripParticle(ans.object||''),p=ans.predicate||'';const map={책:['읽'],숙제:['했','하'],공:['던','찾'],휴대전화:['사용','찾'],가방:['챙','찾'],우산:['챙','사용','찾'],물:['마셨','마셔','마'],간식:['먹'],사진:['찍'],선물:['주','받','챙']};let keys=Object.keys(map).filter(k=>o.includes(k));return !keys.length||keys.some(k=>map[k].some(v=>p.includes(v)))}
function finish(){bar.style.width='100%';let ok=semanticOK();let sentence=`${ans.time} ${ans.place} ${subj(ans.subject)} ${obj(ans.object)} ${ans.predicate}. ${ans.reason} 그렇게 했어요.`.replace(/\.\s+([^.]*) 그렇게 했어요\./,', $1 그렇게 했어요.');card.innerHTML=`<h1>내 문장이 완성됐어요</h1>${ok?'':`<div class='notice'><b>조금 더 알려 주세요.</b><br>고른 ‘무엇’과 ‘행동’이 자연스럽게 이어지지 않을 수 있어요. 아래에서 행동을 다시 골라 보세요.</div>`}<div class='sentence'>${sentence}</div><div class='parts'>언제 · 어디에서 · 누가 · 무엇을 · 어떻게 · 왜</div><div class='actions' style='margin-top:22px'><button class='btn' id='back'>고쳐 보기</button><button class='btn primary' id='again'>새 문장 만들기</button></div>`;document.querySelector('#back').onclick=()=>{idx=4;render()};document.querySelector('#again').onclick=()=>{idx=0;ans={};expanded={};render()}}
render();</script></body></html>
