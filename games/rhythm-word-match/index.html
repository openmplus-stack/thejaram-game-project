<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>리듬 글자 짝꿍</title><style>
:root{--ink:#263631;--muted:#71817a;--line:#dfeae5;--cream:#fffaf1;--mint:#eaf8f1;--pink:#fff0f3;--blue:#eef7ff;--shadow:0 14px 36px rgba(47,73,63,.12)}*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;background:linear-gradient(180deg,#fffdf8,#f5fbf8);color:var(--ink);min-height:100vh}.app{max-width:1180px;margin:auto;padding:24px 28px 36px}.top{display:flex;align-items:center;justify-content:space-between;gap:18px;margin-bottom:18px}.title{font-size:clamp(26px,3vw,40px);font-weight:900}.tools{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.pill{border:0;border-radius:18px;background:#fff;padding:12px 16px;box-shadow:0 5px 16px rgba(47,73,63,.09);font-size:17px;font-weight:800;color:var(--ink)}select.pill{padding-right:34px}.board{background:white;border:3px solid #edf2ef;border-radius:36px;box-shadow:var(--shadow);padding:22px 26px 28px;position:relative;overflow:hidden}.rhythm{height:74px;position:relative;margin:0 auto 10px;max-width:720px}.track{position:absolute;left:7%;right:7%;top:33px;height:5px;border-radius:5px;background:#e2ebe7}.dot{position:absolute;top:23px;width:25px;height:25px;border-radius:50%;background:#fff;border:4px solid #b9cbc3;transform:translateX(-50%)}.dot:nth-of-type(1){left:7%}.dot:nth-of-type(2){left:35.7%}.dot:nth-of-type(3){left:64.3%}.dot:nth-of-type(4){left:93%}.dot.on{border-color:#3f8068;background:#dff4e9}.ball{position:absolute;top:17px;left:7%;width:37px;height:37px;border-radius:50%;background:#4f9078;transform:translateX(-50%);box-shadow:0 5px 12px rgba(50,110,86,.25);transition:left .12s ease}.beatnums{display:flex;justify-content:space-between;padding:0 4.5%;font-weight:800;color:#81918a;font-size:15px;transform:translateY(50px)}.cards{display:grid;grid-template-columns:1fr 1fr;gap:28px;align-items:stretch}.card{min-height:430px;border-radius:30px;border:3px solid var(--line);display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative;transition:transform .13s ease,box-shadow .13s ease}.card.beat{transform:scale(1.018);box-shadow:0 12px 28px rgba(50,90,75,.13)}.pic{background:var(--blue)}.word{background:var(--pink);font-size:clamp(72px,9vw,126px);font-weight:950;letter-spacing:-.06em}.pic img{width:100%;height:100%;min-height:430px;object-fit:contain;padding:18px}.label{position:absolute;left:18px;top:16px;background:rgba(255,255,255,.9);padding:8px 13px;border-radius:13px;font-weight:850;color:#607069;font-size:15px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:22px;max-width:720px;margin:24px auto 0}.answer{min-height:105px;border:0;border-radius:28px;font-size:50px;font-weight:950;box-shadow:0 9px 20px rgba(45,70,60,.12);cursor:pointer}.yes{background:#e1f7ea;color:#23704f}.no{background:#ffe5e7;color:#a33e48}.answer:active{transform:scale(.98)}.status{text-align:center;min-height:42px;font-size:24px;font-weight:900;margin-top:14px}.status.good{color:#267354}.status.bad{color:#b14750}.bottom{display:flex;justify-content:center;gap:18px;margin-top:12px;color:var(--muted);font-size:16px;font-weight:750}.overlay{position:fixed;inset:0;background:rgba(246,252,249,.94);display:flex;align-items:center;justify-content:center;z-index:5}.startbox{width:min(650px,90vw);background:white;border-radius:36px;padding:38px;text-align:center;box-shadow:var(--shadow)}.startbox h1{font-size:42px;margin:0 0 14px}.startbox p{font-size:20px;line-height:1.6;color:#65766e}.start{border:0;border-radius:24px;background:#4f9078;color:white;font-size:27px;font-weight:900;padding:20px 48px}.hide{display:none}.flashGood{animation:good .38s ease}.flashBad{animation:bad .38s ease}@keyframes good{50%{box-shadow:0 0 0 10px #d9f4e5}}@keyframes bad{25%,75%{transform:translateX(-5px)}50%{transform:translateX(5px)}}@media(max-width:760px){.app{padding:14px}.top{align-items:flex-start}.cards{gap:12px}.card{min-height:300px}.pic img{min-height:300px;padding:8px}.word{font-size:clamp(48px,13vw </style></head><body><div class="overlay" id="overlay"><div class="startbox"><h1>리듬 글자 짝꿍</h1><p>박자에 맞춰 그림과 글자를 봐요.<br>같으면 <b>O</b>, 다르면 <b>X</b>를 눌러요.</p><button class="start" id="startBtn">시작하기</button></div></div><main class="app"><div class="top"><div class="title">리듬 글자 짝꿍</div><div class="tools"><label class="pill">박자 <select id="bpm" style="border:0;background:transparent;font:inherit"><option>40</option><option>50</option><option selected>60</option><option>70</option><option>80</option><option>90</option><option>100</option><option>120</option></select> BPM</label><button class="pill" id="pauseBtn">⏸ 잠깐 멈춤</button></div></div><section class="board" id="board"><div class="rhythm"><div class="track"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="ball" id="ball"></div><div class="beatnums"><span>1</span><span>2</span><span>3</span><span>4</span></div></div><div class="cards"><div class="card pic" id="picCard"><span class="label">그림</span><img id="picture" alt="낱말 그림"></div><div class="card word" id="wordCard"><span class="label">글자</span><span id="word">엄마</span></div></div><div class="actions"><button class="answer yes" data-answer="true">O</button><button class="answer no" data-answer="false">X</button></div><div class="status" id="status">박자를 보고 천천히 비교해요.</div><div class="bottom"><span id="count">문제 1</span><span>·</span><span id="score">맞음 0 / 0</span></div></section></main><script>

const items=['김서현','엄마','아빠','할미','교남학교','봄센터','송전탑','대교','사다리','포비'].map(w=>({w,img:img[w]}));
let bpm=60, beat=0, timer=null, running=false, current=null, q=0, correct=0, answered=false, audio=null;
const $=s=>document.querySelector(s), dots=[...document.querySelectorAll('.dot')];
function pick(arr){return arr[Math.floor(Math.random()*arr.length)]}
function newPair(){const left=pick(items); const mismatch=Math.random()<.32; let right=left; if(mismatch){do{right=pick(items)}while(right.w===left.w)} current={left,right,match:!mismatch}; $('#picture').src=left.img; $('#picture').alt=left.w+' 그림'; $('#word').textContent=right.w; q++; answered=false; $('#count').textContent='문제 '+q; $('#status').textContent='그림과 글자를 비교해요.'; $('#status').className='status'}
function tick(){if(!running)return; beat=(beat%4)+1; dots.forEach((d,i)=>d.classList.toggle('on',i===beat-1)); $('#ball').style.left=[7,35.7,64.3,93][beat-1]+'%'; $('#picCard').classList.add('beat');$('#wordCard').classList.add('beat');setTimeout(()=>{$('#picCard').classList.remove('beat');$('#wordCard').classList.remove('beat')},150); clickSound(beat===1?880:beat===3?660:520); if(beat===1 && (current===null || answered)) newPair();}
function clickSound(freq){try{audio ||= new (window.AudioContext||window.webkitAudioContext)(); const o=audio.createOscillator(),g=audio.createGain();o.frequency.value=freq;o.type='sine';g.gain.setValueAtTime(.055,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+.07);o.connect(g);g.connect(audio.destination);o.start();o.stop(audio.currentTime+.075)}catch(e){}}
function restartTimer(){clearInterval(timer); if(running)timer=setInterval(tick,60000/bpm)}
function start(){running=true;$('#overlay').classList.add('hide'); beat=0;current=null;tick();restartTimer()}
function feedbackSound(ok){try{audio ||= new (window.AudioContext||window.webkitAudioContext)(); const now=audio.currentTime; const tones=ok?[784,1046]:[330,220]; tones.forEach((f,i)=>{const o=audio.createOscillator(),g=audio.createGain();o.type=ok?'sine':'square';o.frequency.value=f;g.gain.setValueAtTime(ok?.11:.075,now+i*.10);g.gain.exponentialRampToValueAtTime(.001,now+i*.10+.13);o.connect(g);g.connect(audio.destination);o.start(now+i*.10);o.stop(now+i*.10+.14)})}catch(e){}}
function answer(v){if(!running||!current||answered)return; answered=true; const actualMatch=(current.left.w===current.right.w); const ok=(v===actualMatch); feedbackSound(ok); if(ok){correct++;$('#status').textContent='정답이에요! ✓';$('#status').className='status good';$('#board').classList.add('flashGood')}else{$('#status').textContent=actualMatch?'오답이에요. 같은 그림과 글자예요.':'오답이에요. 그림과 글자가 달라요.';$('#status').className='status bad';$('#board').classList.add('flashBad')} $('#score').textContent=`맞음 ${correct} / ${q}`;setTimeout(()=>{$('#board').classList.remove('flashGood','flashBad')},400)}
$('#startBtn').onclick=start; document.querySelectorAll('.answer').forEach(b=>b.onclick=()=>answer(b.dataset.answer==='true'));$('#bpm').onchange=e=>{bpm=+e.target.value;restartTimer()};$('#pauseBtn').onclick=()=>{running=!running;$('#pauseBtn').textContent=running?'⏸ 잠깐 멈춤':'▶ 계속하기'; if(running){tick();restartTimer()}else clearInterval(timer)};
</script></body></html>
