name: Country V2 Design Smoke Test
on:
  push:
    branches:
      - design/country-v2-parchment-20261013
  pull_request:
    paths:
      - 'games/country-capital-flag-v2/**'
      - '.github/workflows/country-v2-design-check.yml'
jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check Node version
        run: node --version
      - name: Static design and navigation checks
        run: node games/country-capital-flag-v2/design-smoke-test.cjs
      - name: Validate JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          for file in games/country-capital-flag-v2/*.js; do
            node --check "$file"
          done

  browser-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser runner
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Start local preview server
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/country-v2-server.log 2>&1 &
          sleep 3
      - name: Verify navigation and capture screens
        run: node games/country-capital-flag-v2/browser-smoke.cjs
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: country-v2-browser-screenshots
          path: /tmp/country-v2-*.png
          if-no-files-found: ignore
