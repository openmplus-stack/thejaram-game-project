<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>세계 짝꿍 찾기 V2</title><link rel="stylesheet" href="./style.css" defer></head>
<body><main id="app" class="app">
<section id="home" class="screen active" aria-label="홈"><div class="home-artboard" id="homeArtboard"><h1 class="sr-only">세계 짝꿍 찾기</h1><nav class="home-menu" aria-label="시작 메뉴"><button class="home-action home-start" data-go="continents">시작하기</button><button class="home-action home-flags" data-go="flags">국기 보관함</button><button class="home-action home-treasures" data-go="treasures">세계 보물 도감</button><button class="home-action home-progress" data-go="progress">나의 학습</button></nav></div></section>
<section id="continents" class="screen" aria-label="대륙 선택"><div class="continent-artboard" id="continentArtboard"><header class="continent-header"><button data-back>← 이전</button><h2>어디를 공부할까요?</h2><button data-go="home">홈</button></header><div class="choices continent-choices" id="continentChoices"></div><nav class="continent-footer" aria-label="대륙 선택 보조 메뉴"><button data-go="home">홈으로</button><button data-back>이전으로</button><button data-continent="전체">전체 탐험</button></nav></div></section>
<section id="topics" class="screen" aria-label="학습 유형 선택"><div class="topic-artboard" id="topicArtboard"><header class="topic-header"><button data-back>← 이전</button><h2>무엇을 공부할까요?</h2><button data-go="home">홈</button></header><div class="choices topic-choices"><button class="topic-choice topic-flags" data-topic="flag-country">나라와 국기</button><button class="topic-choice topic-capitals" data-topic="country-capital">나라와 수도</button></div><nav class="topic-footer" aria-label="학습 유형 보조 메뉴"><button data-go="home">홈</button><button data-go="continents">대륙 선택</button><button data-go="flags">국기 보관함</button><button data-go="treasures">보물 도감</button><button data-go="progress">나의 학습</button></nav></div></section>
<section id="countries" class="screen" aria-label="국가 선택"><div class="country-artboard" id="countryArtboard"><header><button data-back>← 이전</button><h2>국가 선택</h2><button data-go="home">홈</button></header><p id="countryMessage" aria-live="polite">공부할 나라를 선택하세요.</p><div class="country-filters" role="group" aria-label="학습 상태 필터"><button data-filter="all" aria-pressed="true">전체</button><button data-filter="new" aria-pressed="false">미학습</button><button data-filter="learned" aria-pressed="false">학습한 나라</button><button data-filter="review" aria-pressed="false">다시 공부</button></div><div class="country-tools"><button id="countrySelectAll" type="button">전체 선택</button><button id="countryClearAll" type="button">전체 해제</button><span id="countrySelectedCount" aria-live="polite">0개 선택</span></div><div id="countryChoices" class="country-grid"></div><button id="countryNext" type="button" disabled>다음 단계 →</button></div></section>
<section id="activities" class="screen" aria-label="학습 방법"><header><button data-back>← 이전</button><h2>학습 방법</h2><button data-go="home">홈</button></header><div class="choices"><button data-go="learning">학습하기</button><button data-go="quiz">문제 풀기</button></div></section>
<section id="learning" class="screen" aria-label="학습하기"><header><button data-back>← 이전</button><h2>학습하기</h2><button data-go="home">홈</button></header><p>학습 엔진은 후속 단계에서 연결합니다.</p></section>
<section id="quiz" class="screen" aria-label="문제 풀기"><header><button data-back>← 이전</button><h2>문제 풀기</h2><button data-go="home">홈</button></header><p>문제 엔진은 후속 단계에서 연결합니다.</p></section>
<section id="flags" class="screen" aria-label="국기 보관함"><header><button data-back>← 이전</button><h2>국기 보관함</h2><button data-go="home">홈</button></header><p>기존 기록 연동 예정</p></section>
<section id="treasures" class="screen" aria-label="세계 보물 도감"><header><button data-back>← 이전</button><h2>세계 보물 도감</h2><button data-go="home">홈</button></header><p>보상 데이터 연동 예정</p></section>
<section id="progress" class="screen" aria-label="나의 학습"><header><button data-back>← 이전</button><h2>나의 학습</h2><button data-go="home">홈</button></header><p>학습 기록 연동 예정</p></section>
</main><script src="./data/countries.js" defer></script><script src="./app.js" defer></script><script src="./country-selector.js" defer></script><script src="./asset-loader.js" defer></script></body></html>
