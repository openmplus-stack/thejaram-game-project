<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675">
<rect width="1200" height="675" fill="#f7f7fb"/><rect x="55" y="45" width="1090" height="585" rx="28" fill="#fff" stroke="#d9dfeb"/>
<text x="95" y="105" font-family="system-ui,sans-serif" font-size="32" font-weight="900" fill="#25313a">📋 수행 결과지</text>
<g font-family="system-ui,sans-serif"><rect x="95" y="140" width="220" height="100" rx="16" fill="#f0f3f8"/><text x="120" y="180" font-size="19" font-weight="800" fill="#25313a">총점</text><text x="120" y="220" font-size="30" font-weight="900" fill="#25313a">영역별 점수</text>
<rect x="335" y="140" width="220" height="100" rx="16" fill="#f0f3f8"/><text x="360" y="180" font-size="19" font-weight="800" fill="#25313a">완료 영역</text><text x="360" y="220" font-size="30" font-weight="900" fill="#25313a">정답 기록</text>
<rect x="575" y="140" width="220" height="100" rx="16" fill="#f0f3f8"/><text x="600" y="180" font-size="19" font-weight="800" fill="#25313a">총 오답</text><text x="600" y="220" font-size="30" font-weight="900" fill="#25313a">재시도 횟수</text>
<rect x="815" y="140" width="220" height="100" rx="16" fill="#f0f3f8"/><text x="840" y="180" font-size="19" font-weight="800" fill="#25313a">정확도</text><text x="840" y="220" font-size="30" font-weight="900" fill="#25313a">독립 수행</text></g>
<rect x="95" y="275" width="980" height="125" rx="16" fill="#f2f5ff"/><text x="125" y="315" font-family="system-ui,sans-serif" font-size="22" font-weight="900" fill="#25313a">종합 분석</text><text x="125" y="355" font-family="system-ui,sans-serif" font-size="18" fill="#25313a">도구 선택, 품목·수량 유지, YES/NO 판단, 번호 입력, 결제 금액 구성의 오답 패턴을 분석합니다.</text>
<rect x="95" y="430" width="980" height="125" rx="16" fill="#effaf3"/><text x="125" y="470" font-family="system-ui,sans-serif" font-size="22" font-weight="900" fill="#25313a">다음 수업 제안</text><text x="125" y="510" font-family="system-ui,sans-serif" font-size="18" fill="#25313a">오답이 나온 영역에 맞춰 실물 도구, 수량 조건, 역할놀이, 숫자 기억, 모형 화폐 연습을 제안합니다.</text>
