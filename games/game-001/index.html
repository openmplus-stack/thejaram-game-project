<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>THE JARAM 게임 001</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; font-family: system-ui, sans-serif; background: #eef2ff; }
    .card { width: min(90vw, 520px); padding: 28px; background: #fff; border-radius: 18px; box-shadow: 0 10px 28px rgba(0,0,0,.08); text-align: center; }
    button { border: 0; border-radius: 10px; padding: 12px 18px; font-size: 16px; cursor: pointer; }
    #message { min-height: 28px; margin: 18px 0; font-weight: 700; }
  </style>
</head>
<body>
  <main class="card">
    <h1>THE JARAM 게임 001</h1>
    <p>게임 서버와 자동 배포 연결을 테스트합니다.</p>
    <p>버튼을 눌러 보세요.</p>
    <div id="message">준비되었습니다.</div>
    <button id="start">테스트 시작</button>
  </main>
  <script>
    const message = document.getElementById('message');
    document.getElementById('start').addEventListener('click', () => {
      message.textContent = '게임이 정상적으로 실행되고 있습니다!';
    });
  </script>
</body>
</html>
