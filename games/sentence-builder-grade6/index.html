<!doctype html><html lang='ko'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><meta name="description" content="초등학교 6학년 발달장애 아동의 한국어 문장 구성과 표현을 돕는 단계형 학습 앱"><title>문장 만들기</title><style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'Noto Sans KR',sans-serif;background:#f5f8fb;color:#1f2937}.app{max-width:900px;margin:auto;min-height:100vh;padding:24px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.badge{font-weight:800;color:#2563eb}.progress{height:10px;background:#dbe4ee;border-radius:10px;overflow:hidden}.bar{height:100%;background:#3b82f6;width:0;transition:.3s}.card{background:white;border-radius:24px;padding:28px;margin-top:22px;box-shadow:0 8px 28px #18324d14}h1{font-size:30px;margin:0 0 10px}p.help{font-size:18px;color:#64748b;margin:0 0 24px}.choices{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.choice{border:2px solid #d9e2ec;background:#fff;border-radius:16px;padding:18px;font-size:20px;font-weight:700;cursor:pointer}.choice:hover,.choice.selected{border-color:#3b82f6;background:#eff6ff;color:#1d4ed8}.custom{margin-top:20px;border-top:1px solid #e5e7eb;padding-top:20px}.custom label{font-size:17px;font-weight:800}.custom-row{display:flex;gap:10px;margin-top:10px}.custom input{flex:1;border:2px solid #cbd5e1;border-radius:14px;padding:16px;font-size:20px}.btn{border:0;border-radius:14px;padding:15px 22px;font-size:18px;font-weight:800;cursor:pointer}.add{background:#e2e8f0}.next{background:#2563eb;color:white;float:right;margin-top:22px}.next:disabled{opacity:.35}.sentence{font-size:27px;line-height:1.7;font-weight:800;background:#eff6ff;border-radius:18px;padding:22px;margin:18px 0}.parts{font-size:16px;color:#64748b}.actions{display:flex;gap:12px;flex-wrap:wrap}.actions .btn{background:#e2e8f0}.actions .primary{background:#2563eb;color:#fff}.notice{background:#fff7ed;border:2px solid #fed7aa;border-radius:16px;padding:16px;margin:16px 0;font-size:18px}@media(max-width:600px){.app{padding:14px}.card{padding:20px}.choices{grid-template-columns:1fr}h1{font-size:26px}.sentence{font-size:23px}}
</style></head><body><main class='app'><div class='top'><div class='badge'>문장 만들기</div><div id='stepText'>1 / 6</div></div><div class='progress'><div id='bar' class='bar'></div></div><section id='card' class='card'></section></main><script>
const steps=[
{key:'time',q:'언제 일어난 일이에요?',help:'시간을 하나 골라 주세요.',items:['오늘 아침에','오늘 점심에','오늘 오후에','오늘 저녁에','어제','주말에','쉬는 시간에','수업 시간에','방과 후에','저녁을 먹고 나서']},
{key:'place',q:'어디에서 있었어요?',help:'장소를 하나 골라 주세요.',items:['교실에서','학교 운동장에서','급식실에서','도서관에서','집에서','학원에서','편의점에서','공원에서','버스 안에서','놀이터에서']},
{key:'subject',q:'누가 했어요?',help:'사람을 하나 골라 주세요.',items:['나는','친구는','선생님은','엄마는','아빠는','형은','누나는','동생은','반 친구는','우리 가족은']},
{key:'object',q:'무엇을 했어요?',help:'사물을 하나 골라 주세요.',items:['책을','숙제를','공을','휴대전화를','가방을','우산을','물을','간식을','사진을','선물을']},
{key:'predicate',q:'어떻게 했어요?',help:'행동을 하나 골라 주세요.',items:['읽었어요','했어요','던졌어요','사용했어요','챙겼어요','마셨어요','먹었어요','찍었어요','주었어요','찾았어요']},
{key:'reason',q:'왜 그렇게 했어요?',help:'이유를 하나 골라 주세요.',items:['필요했기 때문에','재미있어서','궁금해서','배가 고파서','목이 말라서','친구를 도와주려고','잊어버리지 않으려고','선생님이 부탁하셔서','비가 왔기 때문에','기분이 좋아서']}
];
let idx=0, ans={};const card=document.querySelector('#card'),bar=document.querySelector('#bar'),stepText=document.querySelector('#stepText');
function render(){let s=steps[idx];stepText.textContent=`${idx+1} / ${steps.length}`;bar.style.width=`${idx/steps.length*100}%`;card.innerHTML=`<h1>${s.q}</h1><p class='help'>${s.help}</p><div class='choices'>${s.items.map(x=>`<button class='choice ${ans[s.key]===x?'selected':''}' data-v='${x}'>${x}</button>`).join('')}</div><div class='custom'><label>내가 직접 쓰기</label><div class='custom-row'><input id='custom' placeholder='직접 입력해 보세요'><button class='btn add' id='add'>넣기</button></div></div><button class='btn next' id='next' ${ans[s.key]?'':'disabled'}>${idx===steps.length-1?'문장 만들기':'다음'}</button><div style='clear:both'></div>`;card.querySelectorAll('.choice').forEach(b=>b.onclick=()=>{ans[s.key]=b.dataset.v;render()});card.querySelector('#add').onclick=()=>{let v=card.querySelector('#custom').value.trim();if(v){ans[s.key]=v;render()}};card.querySelector('#next').onclick=()=>{if(idx<steps.length-1){idx++;render()}else finish()}}
function stripParticle(x){return x.replace(/(은|는|이|가|을|를)$/,'')}function hasBatchim(word){let c=word.charCodeAt(word.length-1);return c>=0xAC00&&c<=0xD7A3&&((c-0xAC00)%28)!==0}function subj(x){if(/(은|는|이|가)$/.test(x))return x;let w=stripParticle(x);return w+(hasBatchim(w)?'은':'는')}function obj(x){if(/(을|를)$/.test(x))return x;let w=stripParticle(x);return w+(hasBatchim(w)?'을':'를')}
function semanticOK(){let o=stripParticle(ans.object||''),p=ans.predicate||'';const map={책:['읽'],숙제:['했','하'],공:['던','찾'],휴대전화:['사용','찾'],가방:['챙','찾'],우산:['챙','사용','찾'],물:['마셨','마셔','마'],간식:['먹'],사진:['찍'],선물:['주','받','챙']};let keys=Object.keys(map).filter(k=>o.includes(k));return !keys.length||keys.some(k=>map[k].some(v=>p.includes(v)))}
function finish(){bar.style.width='100%';let ok=semanticOK();let sentence=`${ans.time} ${ans.place} ${subj(ans.subject)} ${obj(ans.object)} ${ans.predicate}. ${ans.reason} 그렇게 했어요.`.replace(/\.\s+([^.]*) 그렇게 했어요\./,', $1 그렇게 했어요.');card.innerHTML=`<h1>내 문장이 완성됐어요</h1>${ok?'':`<div class='notice'><b>조금 더 알려 주세요.</b><br>고른 ‘무엇’과 ‘행동’이 자연스럽게 이어지지 않을 수 있어요. 아래에서 행동을 다시 골라 보세요.</div>`}<div class='sentence'>${sentence}</div><div class='parts'>언제 · 어디에서 · 누가 · 무엇을 · 어떻게 · 왜</div><div class='actions' style='margin-top:22px'><button class='btn' id='back'>고쳐 보기</button><button class='btn primary' id='again'>새 문장 만들기</button></div>`;document.querySelector('#back').onclick=()=>{idx=4;render()};document.querySelector('#again').onclick=()=>{idx=0;ans={};render()}}
render();</script></body></html>
