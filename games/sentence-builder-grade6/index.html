<!doctype html><html lang='ko'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><meta name="description" content="초등학교 6학년 발달장애 아동의 한국어 문장 구성과 표현을 돕는 단계형 학습 앱"><title>문장 톡톡</title><style>
:root{color-scheme:only light;--green:#3d7b4c;--deep:#285a37;--cream:#fffaf0;--card:rgba(255,255,255,.92);--shadow:0 10px 30px rgba(46,74,43,.15)}
*{box-sizing:border-box}html{background:#eef5df;color-scheme:only light}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans KR",sans-serif;color:#314033;background:#eef5df}button,input{font:inherit;color-scheme:light}

.card{position:relative;z-index:1;background:var(--card);backdrop-filter:blur(7px);border:1px solid rgba(255,255,255,.75);border-radius:24px;padding:22px;margin-top:18px;box-shadow:var(--shadow)}

.more-wrap{margin-top:14px}.btn{border:0;border-radius:16px;padding:14px 16px;font-size:16px;font-weight:850;cursor:pointer}.more{width:100%;background:#edf4e8;color:var(--deep)}.extra{margin-top:10px}
.custom{margin-top:18px;border-top:1px solid #e1e6dc;padding-top:17px}.custom label{font-size:14px;font-weight:900;color:var(--green)}.custom-row{display:flex;gap:8px;margin-top:9px}.custom input{min-width:0;flex:1;border:1px solid #d9dfd4;border-radius:14px;padding:13px 14px;background:#fff;font-size:17px;outline:none}.custom input:focus{border-color:#6e9a75;box-shadow:0 0 0 3px rgba(61,123,76,.08)}.add{background:#edf4e8;color:var(--deep);white-space:nowrap}

@media(max-width:430px){.app{padding:16px 14px 34px}.card{padding:18px}.choices{grid-template-columns:1fr 1fr;gap:8px}.choice{font-size:16px;padding:11px 7px}h1{font-size:24px}.custom-row{flex-wrap:wrap}.custom input{flex-basis:100%}.add{width:100%}}
.shell{padding-bottom:88px}.app-nav{position:fixed;z-index:20;left:50%;bottom:0;transform:translateX(-50%);width:min(560px,100%);display:grid;grid-template-columns:repeat(5,1fr);gap:2px;padding:8px 8px calc(8px + env(safe-area-inset-bottom));background:rgba(255,255,255,.96);border-top:1px solid #dce7d6;box-shadow:0 -8px 24px rgba(40,90,55,.10)}.nav-btn{border:0;background:transparent;color:#667468;font-size:11px;font-weight:850;padding:7px 2px;border-radius:12px;line-height:1.25}.nav-btn span{display:block;font-size:20px;margin-bottom:2px}.nav-btn.active{background:#edf6e9;color:var(--deep)}.screen{display:none}.screen.active{display:block}.home-hero,.antarctic-hero{min-height:360px;border-radius:26px;padding:22px;margin-top:14px;background:linear-gradient(#bfe9ff 0 42%,#eefcff 42% 65%,#d7f2fa 65%);box-shadow:var(--shadow);position:relative;overflow:hidden;text-align:center}.home-hero:after,.antarctic-hero:after{content:'';position:absolute;left:-10%;right:-10%;bottom:-50px;height:150px;background:#fff;border-radius:50% 50% 0 0}.brand{font-size:32px;font-weight:950;color:#174f67;text-shadow:0 2px #fff}.brand small{display:block;font-size:14px;color:#477482;margin-top:4px}.penguin-placeholder{width:155px;height:155px;margin:30px auto 12px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.78);font-size:76px;position:relative;z-index:2}.start-btn{position:relative;z-index:3;border:0;border-radius:18px;background:#3d7b4c;color:white;font-size:20px;font-weight:900;padding:15px 34px;box-shadow:0 7px 16px rgba(61,123,76,.22)}.home-box{background:var(--card);border-radius:22px;padding:17px;margin-top:14px;box-shadow:var(--shadow)}.home-box h3{margin:0 0 8px;color:var(--deep)}.stat-row{display:flex;gap:9px}.stat{flex:1;background:#f2f8ef;border-radius:15px;padding:12px;text-align:center;font-weight:850;color:#40513f}.screen-title{font-size:26px;color:var(--deep);margin:4px 0 14px}.empty-note{padding:24px;text-align:center;color:#71806f}.fish-btn{border:0;border-radius:18px;background:#dff4ff;padding:13px 20px;font-size:18px;font-weight:900;color:#23627a}.login-mini{border:0;background:white;color:var(--deep);border-radius:999px;padding:8px 13px;font-weight:900;box-shadow:0 3px 10px rgba(40,90,55,.12)}.reward{margin:14px 0;padding:15px;border-radius:18px;background:#fff8df;border:1px solid #efd78d;text-align:center;font-weight:900;color:#65562c}.dict-item{background:#fff;border-radius:16px;padding:14px;margin:10px 0;box-shadow:0 3px 12px rgba(40,90,55,.08);line-height:1.55}.feed-msg{position:relative;z-index:3;margin:10px auto 0;min-height:24px;font-weight:900;color:#23627a}.growth{font-size:13px;color:#667468;margin-top:8px}
.treasure-btn{width:100%;border:0;text-align:left;background:#fff;border-radius:16px;padding:14px;margin:10px 0;box-shadow:0 3px 12px rgba(40,90,55,.08);font-weight:850;color:#40513f}.modal{position:fixed;z-index:50;inset:0;background:rgba(25,40,38,.48);display:none;align-items:center;justify-content:center;padding:22px}.modal.open{display:flex}.modal-card{width:min(480px,100%);max-height:80vh;overflow:auto;background:#fffdf7;border-radius:24px;padding:22px;box-shadow:0 18px 50px rgba(0,0,0,.22)}.modal-card h2{margin:0 0 4px;color:var(--deep)}.modal-card .source{font-size:14px;font-weight:900;color:#71806f;margin-bottom:14px}.modal-card p{line-height:1.75;word-break:keep-all}.close-modal{width:100%;border:0;border-radius:15px;padding:13px;background:var(--green);color:#fff;font-weight:900;margin-top:10px}</style></head><body><main class='app shell'><section id='homeScreen' class='screen active'><div class='top'><div class='badge'>문장 톡톡</div><button class='login-mini' id='loginBtn'>로그인</button></div><div class='home-hero'><div class='brand'>🐧 문장 톡톡<small>내 생각을 한 문장씩 모아요</small></div><div class='penguin-placeholder'>🐧</div><button class='start-btn' id='startBtn'>문장 만들기</button></div><div class='home-box'><h3>나의 보상</h3><div class='stat-row'><div class='stat'>🐟 물고기<br><b id='fishCount'>0</b></div><div class='stat'>📖 문장<br><b id='sentenceCount'>0</b></div><div class='stat'>🎁 보물<br><b id='treasureCount'>0</b></div></div></div></section><section id='composeScreen' class='screen'><div class='top'><div class='badge'>문장 구성</div><div id='stepText'>1 / 6</div></div><div class='progress'><div id='bar' class='bar'></div></div><section id='card' class='card'></section></section><section id='antarcticScreen' class='screen'><h1 class='screen-title'>나의 남극</h1><div class='antarctic-hero'><div class='brand'>나의 펭귄<small>새 문장을 만들고 물고기를 모아 주세요</small></div><div class='penguin-placeholder'>🐧</div><button class='fish-btn' id='feedBtn'>🐟 물고기 주기</button><div class='feed-msg' id='feedMsg'></div></div><div class='home-box'><h3>보유 물고기</h3><div class='stat'>🐟 <b id='antarcticFish'>0</b>마리<div class='growth'>먹인 물고기 <b id='fedCount'>0</b>마리</div></div></div></section><section id='dictionaryScreen' class='screen'><h1 class='screen-title'>나의 문장 사전</h1><div id='dictionaryList'></div></section><section id='myScreen' class='screen'><h1 class='screen-title'>마이페이지</h1><div class='home-box'><h3>나의 성장</h3><div class='stat' id='growthStat'>🐧 1단계 · 아기 펭귄</div></div><div class='home-box'><h3>나의 이야기 보물</h3><div id='treasureList' class='empty-note'>아직 발견한 보물이 없어요.</div></div><div class='home-box'><h3>특별 펭귄</h3><div id='specialList' class='empty-note'>앞으로 만날 특별 펭귄을 기다려 주세요.</div></div></section><nav class='app-nav'><button class='nav-btn active' data-screen='homeScreen'><span>🏠</span>홈</button><button class='nav-btn' data-screen='composeScreen'><span>✏️</span>문장 구성</button><button class='nav-btn' data-screen='antarcticScreen'><span>🧊</span>나의 남극</button><button class='nav-btn' data-screen='dictionaryScreen'><span>📖</span>문장 사전</button><button class='nav-btn' data-screen='myScreen'><span>🐧</span>마이</button></nav></main><div id='treasureModal' class='modal' aria-hidden='true'><div class='modal-card'><h2 id='modalTitle'></h2><div id='modalSource' class='source'></div><p id='modalSummary'></p><button class='close-modal' id='closeModal'>닫기</button></div></div><script>

{key:'place',q:'어디에서 있었어요?',help:'장소를 하나 골라 주세요.',items:['교실에서','학교 운동장에서','급식실에서','도서관에서','집에서','학원에서','편의점에서','공원에서','버스 안에서','놀이터에서'],examples:['학교 복도에서','보건실에서','음악실에서','체육관에서','학교 앞에서','마트에서','식당에서','지하철에서','친구 집에서','동네 길에서','미술실에서','과학실에서','학교 화장실에서','버스 정류장에서','카페에서','문구점에서','서점에서','병원에서','수영장에서','집 앞에서']},

const STORE_KEY='sentenceTokTokRewardV1';
let state=(()=>{try{return Object.assign({fish:0,fed:0,sentences:[],treasures:[],specialPenguins:[]},JSON.parse(localStorage.getItem(STORE_KEY)||'{}'))}catch(e){return {fish:0,fed:0,sentences:[],treasures:[],specialPenguins:[]}}})();
const treasureDB=[
{id:'treasure-01',name:'박 속 금은보화',story:'흥부와 놀부',type:'한국 전래동화',summary:['착한 흥부는 다친 제비를 정성껏 치료해 주었어요.','제비가 가져온 박씨에서 큰 박이 자라고, 박 속에서 보물이 나왔어요.','욕심을 부린 놀부는 흥부의 행동을 따라 했지만 다른 결과를 맞았어요.']},
{id:'treasure-02',name:'동아줄',story:'해와 달이 된 오누이',type:'한국 전래동화',summary:['호랑이를 피해 오누이는 높은 나무 위로 올라갔어요.','오누이는 하늘에 살려 달라고 빌었고 튼튼한 동아줄이 내려왔어요.','오누이는 하늘로 올라가 해와 달이 되었다고 전해져요.']},

{id:'treasure-04',name:'금도끼',story:'금도끼 은도끼',type:'한국 전래동화',summary:['나무꾼이 연못에 쇠도끼를 빠뜨리고 슬퍼했어요.','산신령이 금도끼와 은도끼를 보여 주었지만 나무꾼은 자기 쇠도끼만 골랐어요.','산신령은 정직한 나무꾼에게 세 도끼를 모두 주었어요.']},
{id:'treasure-05',name:'날개옷',story:'선녀와 나무꾼',type:'한국 전래동화',summary:['나무꾼은 연못에서 목욕하던 선녀의 날개옷을 숨겼어요.','날개옷이 없어진 선녀는 하늘로 돌아가지 못하고 땅에 머물렀어요.','나중에 선녀는 날개옷을 되찾아 아이들과 하늘로 올라갔어요.']},

function escapeHtml(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}

function updateUI(){document.getElementById('fishCount').textContent=state.fish;document.getElementById('sentenceCount').textContent=state.sentences.length;document.getElementById('treasureCount').textContent=state.treasures.length;document.getElementById('antarcticFish').textContent=state.fish;document.getElementById('fedCount').textContent=state.fed;document.getElementById('growthStat').textContent='🐧 '+growthLevel()+'단계 · '+(growthLevel()===1?'아기 펭귄':'성장 중인 펭귄');let d=document.getElementById('dictionaryList');d.innerHTML=state.sentences.length?state.sentences.slice().reverse().map((x,i)=>`<div class="dict-item"><b>${state.sentences.length-i}번째 문장</b><br>${escapeHtml(x.text)}</div>`).join(''):`<div class="card empty-note">아직 저장한 문장이 없어요.<br>새 문장을 만들어 보세요.</div>`;let t=document.getElementById('treasureList');t.className=state.treasures.length?'':'empty-note';t.innerHTML=state.treasures.length?state.treasures.map(x=>`<button class="treasure-btn" data-treasure="${escapeHtml(x)}">🎁 ${escapeHtml(x)}<br><small>이야기 보기 ›</small></button>`).join(''):'아직 발견한 보물이 없어요.';let sp=document.getElementById('specialList');sp.className=state.specialPenguins.length?'':'empty-note';sp.innerHTML=state.specialPenguins.length?state.specialPenguins.map(x=>`<div class="dict-item">🐧 특별 펭귄 ${escapeHtml(x.split('-').pop())}</div>`).join('') :'앞으로 만날 특별 펭귄을 기다려 주세요.';document.querySelectorAll('.treasure-btn').forEach(b=>b.onclick=()=>openTreasure(b.dataset.treasure))}
function openTreasure(name){let x=treasureDB.find(t=>t.name===name);if(!x)return;document.getElementById('modalTitle').textContent=x.name;document.getElementById('modalSource').textContent=x.type+' · 「'+x.story+'」';document.getElementById('modalSummary').innerHTML=x.summary.map(s=>escapeHtml(s)).join('<br>');let m=document.getElementById('treasureModal');m.classList.add('open');m.setAttribute('aria-hidden','false')}
function closeTreasure(){let m=document.getElementById('treasureModal');m.classList.remove('open');m.setAttribute('aria-hidden','true')}
function rewardSentence(sentence){if(state.sentences.some(x=>x.text===sentence))return {duplicate:true};state.sentences.push({text:sentence,at:new Date().toISOString()});state.fish+=1;let reward=null;let roll=Math.random();if(roll<.18){let locked=treasurePool.filter(x=>!state.treasures.includes(x));if(locked.length){reward=locked[Math.floor(Math.random()*locked.length)];state.treasures.push(reward)}}else if(roll<.23){let locked=specialPool.filter(x=>!state.specialPenguins.includes(x));if(locked.length){reward=locked[Math.floor(Math.random()*locked.length)];state.specialPenguins.push(reward)}}saveState();return {duplicate:false,reward}}

const actionReasonRules=[

function contextItems(s){
 const all=[...s.items,...s.examples];
 if(s.key==='object'){
  const placeRule=ans.place&&placeObjectRules.find(r=>r.test.test(ans.place));
  const subjectRule=ans.subject&&subjectObjectRules.find(r=>r.test.test(ans.subject));
  let preferred=[];
  if(placeRule&&subjectRule){
   const overlap=placeRule.objects.filter(x=>subjectRule.objects.includes(x));
   preferred=[...overlap,...placeRule.objects.filter(x=>!overlap.includes(x)),...subjectRule.objects.filter(x=>!overlap.includes(x))];
  }else if(placeRule)preferred=placeRule.objects;
  else if(subjectRule)preferred=subjectRule.objects;
  preferred=[...new Set(preferred)].filter(x=>all.includes(x));
  if(preferred.length)return {main:preferred.slice(0,10),extra:all.filter(x=>!preferred.includes(x)),matched:true,restricted:false}
 }
 if(s.key==='predicate'&&ans.object){
  const rule=objectActionRules.find(r=>r.test.test(stripParticle(ans.object)));
  if(rule){const valid=rule.actions.filter(x=>all.includes(x));return {main:valid,extra:all.filter(x=>!valid.includes(x)),matched:true,restricted:true}}
 }
 if(s.key==='reason'&&ans.predicate){
  const rule=actionReasonRules.find(r=>r.test.test(ans.predicate));
  if(rule){const first=rule.reasons.filter(x=>all.includes(x));return {main:first,extra:all.filter(x=>!first.includes(x)),matched:true,restricted:false}}
 }
 return {main:s.items,extra:s.examples,matched:false,restricted:false}
}

function render(){let s=steps[idx],ci=contextItems(s);stepText.textContent=`${idx+1} / ${steps.length}`;bar.style.width=`${idx/steps.length*100}%`;card.innerHTML=`<h1>${s.q}</h1><p class='help'>${s.help}${ci.matched?(ci.restricted?' 앞에서 고른 것과 자연스럽게 연결되는 행동을 먼저 보여드려요.':' 앞에서 고른 내용과 잘 어울리는 것을 먼저 보여드려요.'):''}</p><div class='choices'>${ci.main.map(x=>`<button class='choice ${ans[s.key]===x?'selected':''}' data-v='${x}'>${x}</button>`).join('')}</div><div class='more-wrap'><button class='btn more' id='more'>${expanded[s.key]?'− 예시 접기':'+ 다른 예시 더 보기'}</button>${expanded[s.key]?`<div class='choices extra'>${ci.extra.map(x=>`<button class='choice ${ans[s.key]===x?'selected':''}' data-v='${x}'>${x}</button>`).join('')}</div>`:''}</div><div class='custom'><label>내가 직접 쓰기</label><div class='custom-row'><input id='custom' placeholder='직접 입력해 보세요'><button class='btn add' id='add'>넣기</button></div></div><button class='btn next' id='next' ${ans[s.key]?'':'disabled'}>${idx===steps.length-1?'문장 만들기':'다음'}</button><div style='clear:both'></div>`;card.querySelectorAll('.choice').forEach(b=>b.onclick=()=>{ans[s.key]=b.dataset.v;render()});card.querySelector('#more').onclick=()=>{expanded[s.key]=!expanded[s.key];render()};card.querySelector('#add').onclick=()=>{let v=card.querySelector('#custom').value.trim();if(v){ans[s.key]=v;render()}};card.querySelector('#next').onclick=()=>{

   if(chosen){idx=0;expanded.time=true;const timeStep=steps[0],all=[...timeStep.items,...timeStep.examples];timeStep.examples=[...better,...all.filter(x=>!better.includes(x)&&!timeStep.items.includes(x))];render();return}
  }
 }

function stripParticle(x){return x.replace(/(은|는|이|가|을|를)$/,'')}function hasBatchim(word){let c=word.charCodeAt(word.length-1);return c>=0xAC00&&c<=0xD7A3&&((c-0xAC00)%28)!==0}function subj(x){if(/(은|는|이|가)$/.test(x))return x;let w=stripParticle(x);return w+(hasBatchim(w)?'은':'는')}function obj(x){if(/(을|를)$/.test(x))return x;let w=stripParticle(x);return w+(hasBatchim(w)?'을':'를')}
function semanticOK(){let o=stripParticle(ans.object||''),p=ans.predicate||'';let rule=objectActionRules.find(r=>r.test.test(o));return !rule||rule.actions.includes(p)}
function cleanToken(x){return String(x||'').trim().replace(/[.?!,]+$/,'')}
function normalizeTime(x){return cleanToken(x)}
function normalizePlace(x){let v=cleanToken(x);if(!v)return '';if(/(에서|에게서|앞에서|안에서|밖에서)$/.test(v))return v;return v+'에서'}
function naturalReason(r){let x=cleanToken(r);if(!x)return '';const map={'배가 고프기 때문에':'배가 고파서','목이 마르기 때문에':'목이 말라서','비가 오기 때문에':'비가 와서','필요하기 때문에':'필요해서'};return map[x]||x}
function naturalSubject(x){
 let v=cleanToken(x);if(!v)return '';
 // 1인칭 '나는'은 한국어 문맥에서 생략해도 뜻이 분명하므로 최종 문장에서는 기본 생략한다.
 if(/^(나|나는|내가)$/.test(v))return '';
 return subj(v)
}
function naturalObject(x){let v=cleanToken(x);return v?obj(v):''}
function normalizePredicate(x){let v=cleanToken(x);if(!v)return '';const map={'구매했어요':'샀어요','섭취했어요':'먹었어요','음용했어요':'마셨어요'};return map[v]||v}
function buildSentence(){
 const time=normalizeTime(ans.time),reason=naturalReason(ans.reason),place=normalizePlace(ans.place),subject=naturalSubject(ans.subject),object=naturalObject(ans.object),predicate=normalizePredicate(ans.predicate);
 // 기본 어순: 시간 → 이유 → 장소 → 주어(필요할 때) → 목적어 → 서술어
 const parts=[time,reason,place,subject,object,predicate].filter(Boolean);
 let s=parts.join(' ').replace(/\s+/g,' ').trim();
 // 같은 조사가 직접 입력 과정에서 겹친 경우 정리한다.
 s=s.replace(/에서에서/g,'에서').replace(/은은|는는/g,m=>m[0]).replace(/을을|를를/g,m=>m[0]);
 return s+(s&&/[.!?]$/.test(s)?'':'.')
}
function finish(){bar.style.width='100%';let ok=semanticOK();let sentence=buildSentence();let r=ok?rewardSentence(sentence):null;let rewardText=!ok?'':r.duplicate?'이 문장은 이미 저장되어 있어요. 같은 문장에는 보상을 다시 주지 않아요.':`🐟 물고기 1마리를 받았어요!${r.reward?`<br>🎉 특별 보상: ${escapeHtml(r.reward)}`:''}`;card.innerHTML=`<h1>내 문장이 완성됐어요</h1>${ok?'':`<div class='notice'><b>조금 더 알려 주세요.</b><br>고른 ‘무엇’과 ‘행동’이 자연스럽게 이어지지 않을 수 있어요. 아래에서 행동을 다시 골라 보세요.</div>`}<div class='sentence'>${sentence}</div>${rewardText?`<div class='reward'>${rewardText}</div>`:''}<div class='parts'>언제 · 어디에서 · 누가 · 무엇을 · 어떻게 · 왜</div><div class='actions' style='margin-top:22px'><button class='btn' id='back'>고쳐 보기</button><button class='btn primary' id='again'>새 문장 만들기</button></div>`;document.querySelector('#back').onclick=()=>{idx=4;render()};document.querySelector('#again').onclick=()=>{idx=0;ans={};expanded={};render()}}
function showScreen(id){document.querySelectorAll('.screen').forEach(x=>x.classList.remove('active'));document.getElementById(id).classList.add('active');document.querySelectorAll('.nav-btn').forEach(x=>x.classList.toggle('active',x.dataset.screen===id));if(id==='composeScreen')render();window.scrollTo({top:0,behavior:'smooth'})}document.querySelectorAll('.nav-btn').forEach(b=>b.onclick=()=>showScreen(b.dataset.screen));document.getElementById('startBtn').onclick=()=>showScreen('composeScreen');document.getElementById('loginBtn').onclick=()=>alert('로그인·회원가입 화면은 다음 단계에서 연결합니다.');document.getElementById('closeModal').onclick=closeTreasure;document.getElementById('treasureModal').onclick=e=>{if(e.target.id==='treasureModal')closeTreasure()};document.getElementById('feedBtn').onclick=()=>{let m=document.getElementById('feedMsg');if(state.fish<1){m.textContent='먼저 새 문장을 만들고 물고기를 받아 주세요.';return}state.fish--;state.fed++;saveState();m.textContent='🐟 냠냠! 펭귄이 물고기를 먹었어요.';setTimeout(()=>m.textContent='',2200)};updateUI();render();</script></body></html>
