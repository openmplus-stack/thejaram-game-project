<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675">
<rect width="1200" height="675" fill="#f7f7fb"/><rect x="90" y="60" width="1020" height="555" rx="28" fill="#fff" stroke="#d9dfeb"/>
<text x="130" y="125" font-family="system-ui,sans-serif" font-size="33" font-weight="900" fill="#263238">계산대에서 질문을 들었어요</text>
<rect x="130" y="165" width="940" height="90" rx="18" fill="#fff8df" stroke="#f0d88a"/><text x="165" y="220" font-family="system-ui,sans-serif" font-size="27" font-weight="900" fill="#263238">직원: “포인트 적립하시겠어요?”</text>
<rect x="130" y="295" width="280" height="105" rx="18" fill="#eef3ff" stroke="#335cff" stroke-width="2"/><text x="270" y="340" text-anchor="middle" font-family="system-ui,sans-serif" font-size="27" font-weight="900" fill="#263238">네</text><text x="270" y="375" text-anchor="middle" font-family="system-ui,sans-serif" font-size="18" fill="#667085">적립 방법을 알고 있어요.</text>
<rect x="460" y="295" width="280" height="105" rx="18" fill="#fff" stroke="#d9dfeb" stroke-width="2"/><text x="600" y="340" text-anchor="middle" font-family="system-ui,sans-serif" font-size="27" font-weight="900" fill="#263238">아니요</text><text x="600" y="375" text-anchor="middle" font-family="system-ui,sans-serif" font-size="18" fill="#667085">적립하지 않고 계산해요.</text>
<rect x="790" y="295" width="280" height="105" rx="18" fill="#fff" stroke="#d9dfeb" stroke-width="2"/><text x="930" y="340" text-anchor="middle" font-family="system-ui,sans-serif" font-size="27" font-weight="900" fill="#263238">잘 모르겠어요</text><text x="930" y="375" text-anchor="middle" font-family="system-ui,sans-serif" font-size="18" fill="#667085">보호자에게 물어볼게요.</text>
<text x="130" y="475" font-family="system-ui,sans-serif" font-size="22" font-weight="800" fill="#263238">봉투 필요 여부 · 결제 방식 · 영수증 질문도 차례로 연습합니다.</text>
<text x="130" y="525" font-family="system-ui,sans-serif" font-size="20" fill="#667085">모르는 상황에서는 도움을 요청하는 것도 적절한 반응으로 기록합니다.</text>
</svg>