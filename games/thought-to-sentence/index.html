<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="description" content="단어를 선택하고 생각을 연결해 3~4문장 일기를 완성하는 자기표현 학습 앱"><title>생각을 문장으로</title>
<style>:root{--bg:#f6f8fc;--card:#fff;--ink:#172033;--muted:#657089;--line:#dfe5ef;--accent:#365fca;--soft:#edf2ff;--ok:#edf8f1}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif;background:var(--bg);color:var(--ink)}button,input{font:inherit}.app{max-width:980px;margin:auto;min-height:100vh;padding:22px}.top{display:flex;align-items:center;gap:14px;margin-bottom:18px}.brand{font-size:24px;font-weight:900}.progress{flex:1;height:12px;background:#e6eaf2;border-radius:20px;overflow:hidden}.bar{height:100%;background:var(--accent);width:0;transition:.25s}.card{background:#fff;border:1px solid var(--line);border-radius:24px;padding:28px;box-shadow:0 8px 30px #1e2d5010}.step{font-size:14px;color:var(--accent);font-weight:800}.question{font-size:30px;line-height:1.35;margin:8px 0;font-weight:900}.help{color:var(--muted);font-size:17px;margin-bottom:22px}.chips{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}.chip{border:2px solid var(--line);background:#fff;border-radius:15px;padding:13px 8px;min-height:54px;font-weight:750}.chip.selected{border-color:var(--accent);background:var(--soft);color:#234aa9}.custom{display:flex;gap:10px;margin-top:18px}.custom input{flex:1;border:2px solid var(--line);border-radius:15px;padding:14px;font-size:18px}.actions{display:flex;justify-content:space-between;gap:10px;margin-top:24px}.actions div{display:flex;gap:10px}.btn{border:0;border-radius:15px;padding:14px 20px;font-weight:850}.primary{background:var(--accent);color:#fff}.secondary{background:#eef1f6;color:#35405a}.ghost{background:#fff;border:1px solid var(--line)}.preview{background:#f7f9fd;border-radius:18px;padding:18px;margin-top:18px}.preview b{display:block;margin-bottom:8px}.result{font-size:22px;line-height:1.8;background:var(--ok);padding:24px;border-radius:20px;margin:18px 0}.result p{margin:.35em 0}.home{display:grid;place-items:center;min-height:75vh;text-align:center}.home h1{font-size:42px;margin:0 0 12px}.home p{font-size:20px;color:var(--muted);line-height:1.6}.home .btn{font-size:22px;padding:18px 34px;margin-top:16px}.small{font-size:14px;color:var(--muted)}@media(max-width:720px){.app{padding:12px}.card{padding:20px}.chips{grid-template-columns:repeat(3,1fr)}.question{font-size:25px}}</style></head><body><div class="app"><div id="top" class="top" style="display:none"><div class="brand">생각을 문장으로</div><div class="progress"><div id="bar" class="bar"></div></div></div><main id="main"></main></div>
<script>
const steps=[
["when","언제","언제 있었던 일이에요?","생각나는 말을 하나 골라보세요.",["오늘","어제","아침에","점심에","저녁에","밤에","등교할 때","학교 가기 전","학교에서","쉬는 시간에","수업 시간에","체육 시간에","점심시간에","시험 시간에","방과 후에","하교할 때","집에 와서","숙제할 때","학원 가기 전","학원에서","주말에","토요일에","일요일에","지난주에","이번 주에","비 오는 날","더운 날","추운 날","생일에","방학 때"]],
["where","어디서","어디에서 있었던 일이에요?","장소를 골라보세요.",["학교에서","교실에서","복도에서","운동장에서","급식실에서","도서관에서","보건실에서","화장실에서","과학실에서","체육관에서","음악실에서","미술실에서","학원에서","집에서","내 방에서","거실에서","놀이터에서","공원에서","편의점에서","마트에서","카페에서","식당에서","버스에서","지하철에서","정류장에서","병원에서","센터에서","친구 집에서","여행지에서","온라인에서"]],
["who","누구","누구와 관련된 일이에요?","나 혼자 있었던 일도 괜찮아요.",["나","엄마","아빠","형","오빠","누나","언니","동생","할머니","할아버지","친구","짝꿍","반 친구","선생님","담임 선생님","과목 선생님","체육 선생님","학원 선생님","치료사 선생님","센터 선생님","친한 친구","새 친구","선배","후배","사촌","가족","우리 반","모둠 친구","낯선 사람","여러 사람"]],
["what","무엇","무슨 일이 있었어요?","가장 중요한 사건을 골라보세요.",["준비물을 안 가져갔어요","시험을 봤어요","문제를 틀렸어요","발표했어요","질문했어요","칭찬을 받았어요","혼났어요","친구를 만났어요","친구와 이야기했어요","친구와 다퉜어요","도움을 받았어요","도와주었어요","물건을 잃어버렸어요","물건을 찾았어요","약속을 지켰어요","약속에 늦었어요","숙제를 했어요","숙제를 못 했어요","게임을 했어요","운동을 했어요","책을 읽었어요","그림을 그렸어요","맛있는 것을 먹었어요","넘어졌어요","기다렸어요","처음 해봤어요","실수했어요","성공했어요","거절당했어요","계획이 바뀌었어요"]],
["why","왜","왜 그런 일이 생겼어요?","이유가 없다면 건너뛰어도 괜찮아요.",["깜빡해서","준비하지 못해서","시간이 부족해서","늦게 일어나서","잘 몰라서","방법을 몰라서","어려워서","긴장해서","급하게 해서","실수해서","약속해서","하고 싶어서","궁금해서","필요해서","도와주고 싶어서","친구가 부탁해서","선생님이 말해서","부모님이 말해서","규칙이 있어서","차례를 기다려야 해서","몸이 아파서","피곤해서","기분이 안 좋아서","무서워서","소리가 시끄러워서","예상과 달라서","물건이 없어서","고장 나서","비가 와서","갑자기 바뀌어서"]],
["how","어떻게","그래서 어떻게 했어요?","내가 한 행동이나 결과를 골라보세요.",["그냥 기다렸어요","선생님께 말했어요","친구에게 말했어요","도움을 요청했어요","빌렸어요","다시 해봤어요","천천히 했어요","참았어요","자리를 옮겼어요","잠깐 쉬었어요","사과했어요","고맙다고 했어요","싫다고 말했어요","괜찮다고 말했어요","질문했어요","찾아봤어요","연습했어요","끝까지 했어요","포기했어요","집에 갔어요","부모님께 말했어요","선생님과 해결했어요","친구와 해결했어요","규칙을 지켰어요","다른 방법을 찾았어요","다시 준비했어요","메모했어요","확인했어요","기다렸다가 다시 했어요","아무 말도 못 했어요"]],
["feeling","감정","그때 어떤 기분이었어요?","감정은 두 개까지 고를 수 있어요.",["기뻤어요","즐거웠어요","신났어요","뿌듯했어요","편안했어요","고마웠어요","안심했어요","궁금했어요","놀랐어요","당황했어요","긴장했어요","걱정됐어요","무서웠어요","속상했어요","슬펐어요","화가 났어요","짜증났어요","답답했어요","억울했어요","부끄러웠어요","외로웠어요","서운했어요","실망했어요","아쉬웠어요","지루했어요","피곤했어요","귀찮았어요","불편했어요","혼란스러웠어요","괜찮았어요"],true],
["next","다음","다음에는 어떻게 하고 싶어요?","마지막으로 내 계획을 정해보세요.",["미리 준비할 거예요","꼭 챙길 거예요","한 번 더 확인할 거예요","메모할 거예요","천천히 할 거예요","먼저 질문할 거예요","도움을 요청할 거예요","내 생각을 말할 거예요","싫다고 말할 거예요","차분히 기다릴 거예요","다시 해볼 거예요","연습할 거예요","약속을 지킬 거예요","시간을 확인할 거예요","조금 일찍 갈 거예요","친구에게 말할 거예요","선생님께 말할 거예요","부모님께 말할 거예요","사과할 거예요","고맙다고 말할 거예요","다른 방법을 찾아볼 거예요","잠깐 쉬었다 할 거예요","준비물을 확인할 거예요","규칙을 확인할 거예요","용기 내볼 거예요","끝까지 해볼 거예요","같은 실수를 줄일 거예요","기억해 둘 거예요","다음에는 다르게 해볼 거예요","아직 잘 모르겠어요"]]];
let idx=-1,data={};const main=document.querySelector("#main"),topEl=document.querySelector("#top"),bar=document.querySelector("#bar");
const esc=s=>(s||"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
function home(){idx=-1;data={};topEl.style.display="none";main.innerHTML='<section class="home"><div><div style="font-size:70px">💭 → 🧩 → ✍️</div><h1>생각을 문장으로</h1><p>머릿속 생각을 하나씩 골라서 연결한다.<br>마지막에는 나만의 3~4문장 일기가 완성된다.</p><button class="btn primary" onclick="start()">오늘 이야기 만들기</button><p class="small">정답은 없다. 모르면 건너뛰어도 괜찮다.</p></div></section>'}
function start(){idx=0;topEl.style.display="flex";render()}function vals(k){let v=data[k];return Array.isArray(v)?v:(v?[v]:[])}
function choose(w){let s=steps[idx],a=vals(s[0]);if(s[5])data[s[0]]=a.includes(w)?a.filter(x=>x!==w):(a.length<2?[...a,w]:a);else data[s[0]]=w;render()}
function custom(){let s=steps[idx],v=document.querySelector("#custom").value.trim();if(!v)return;if(s[5]){let a=vals(s[0]);if(a.length<2)data[s[0]]=[...a,v]}else data[s[0]]=v;render()}
function skip(){data[steps[idx][0]]="";next()}function next(){idx<steps.length-1?(idx++,render()):finish()}function prev(){idx>0?(idx--,render()):home()}
function render(){let s=steps[idx],a=vals(s[0]);bar.style.width=(idx+1)/steps.length*100+"%";main.innerHTML='<section class="card"><div class="step">'+(idx+1)+' / '+steps.length+' · '+s[1]+'</div><div class="question">'+s[2]+'</div><div class="help">'+s[3]+'</div><div class="chips">'+s[4].map(w=>'<button class="chip '+(a.includes(w)?"selected":"")+'" onclick=\'choose('+JSON.stringify(JSON.stringify(w))+')\'>'+esc(w)+'</button>').join("")+'</div><div class="custom"><input id="custom" placeholder="목록에 없으면 직접 써도 돼요"><button class="btn ghost" onclick="custom()">직접 입력</button></div>'+(a.length?'<div class="preview"><b>내가 고른 말</b>'+a.map(esc).join(" + ")+'</div>':"")+'<div class="actions"><button class="btn secondary" onclick="prev()">이전</button><div><button class="btn ghost" onclick="skip()">건너뛰기</button><button class="btn primary" onclick="next()">'+(idx===steps.length-1?"일기 완성":"다음")+'</button></div></div></section>'}
function d(s){s=(s||"").replace(/[.!?]+$/,"");let r=[[/거예요$/,"것이다"],[/했어요$/,"했다"],[/됐어요$/,"됐다"],[/였어요$/,"였다"],[/없었어요$/,"없었다"],[/있었어요$/,"있었다"],[/받았어요$/,"받았다"],[/봤어요$/,"봤다"],[/갔어요$/,"갔다"],[/왔어요$/,"왔다"],[/났어요$/,"났다"],[/어요$/,"다"],[/아요$/,"다"]];for(let [a,b] of r)if(a.test(s))return s.replace(a,b);return s}
function finish(){let get=k=>Array.isArray(data[k])?data[k].join(" 그리고 "):(data[k]||""),who=get("who"),first=[get("when"),get("where"),who&&who!=="나"?who:"나는"].filter(Boolean).join(" "),lines=[];let why=get("why"),what=get("what"),how=get("how"),feel=vals("feeling"),nxt=get("next");lines.push((first+" "+(why?why+" ":"")+(what?d(what):"있었던 일을 떠올렸다")+".").replace(/\s+/g," "));if(how)lines.push(d(how)+".");if(feel.length)lines.push("그때 "+feel.map(d).join(" 그리고 ")+".");if(nxt)lines.push("다음에는 "+d(nxt)+".");main.innerHTML='<section class="card"><div class="step">완성</div><div class="question">내 생각이 문장이 되었다!</div><div class="result">'+lines.slice(0,4).map(x=>"<p>"+esc(x)+"</p>").join("")+'</div><div class="actions"><button class="btn secondary" onclick="idx=7;render()">마지막 질문으로</button><div><button class="btn ghost" onclick="home()">처음부터</button><button class="btn primary" onclick="print()">인쇄하기</button></div></div></section>'}
home();</script></body></html>
