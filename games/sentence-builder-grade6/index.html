y{display:flex;justify-content:space-between;align-items:flex-start;position:relative;z-index:2;color:#174f67;font-weight:900}.night .antarctic-sky{color:#fff}.time-chip{background:rgba(255,255,255,.78);padding:7px 11px;border-radius:999px;font-size:13px}.penguin-stage{position:relative;z-index:3;width:190px;height:190px;margin:42px auto 2px;display:grid;place-items:center}.penguin-stage .penguin-placeholder{margin:0;transition:transform .28s}.growth-penguin{width:100%;height:100%;object-fit:contain;display:block;filter:drop-shadow(0 10px 12px rgba(30,65,80,.16))}.penguin-stage.eating .penguin-placeholder,.penguin-stage.eating .growth-penguin{transform:scale(1.12) rotate(-3deg)}.heart-burst{position:absolute;z-index:5;left:50%;top:30%;font-size:28px;animation:heartUp 1.1s ease-out forwards;pointer-events:none}@keyframes heartUp{0%{opacity:0;transform:translate(-50%,20px) scale(.7)}30%{opacity:1}100%{opacity:0;transform:translate(-50%,-95px) scale(1.35)}}.antarctic-status{position:relative;z-index:4;display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:6px}.antarctic-pill{background:rgba(255,255,255,.86);border-radius:16px;padding:10px;font-weight:900;color:#31586a}.level-line{font-size:14px;margin-top:4px}.feed-area{position:relative;z-index:5;margin-top:12px}.fish-btn:disabled{opacity:.45}.growth-track{height:10px;background:#dce9ec;border-radius:99px;overflow:hidden;margin-top:9px}.growth-fill{height:100%;background:#5ca8bd;border-radius:99px;transition:width .3s}.flying-fish{position:fixed;z-index:9999;font-size:34px;pointer-events:none;transform:translate(-50%,-50%);transition:left .58s cubic-bezier(.2,.8,.35,1),top .58s cubic-bezier(.2,.8,.35,1),transform .58s ease,opacity .2s .48s}.growth-penguin{transition:transform .28s,opacity .22s}.growth-penguin.level-change{animation:penguinGrow .72s ease}@keyframes penguinGrow{0%{transform:scale(.88);opacity:.45}45%{transform:scale(1.18)}100%{transform:scale(1);opacity:1}}</style></head><body><main class='app sh function saveState(){localStorage.setItem(STORE_KEY,JSON.stringify(state));updateUI()}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function growthLevel(){return Math.min(10,1+Math.floor(state.fed/5))}
function antarcticTime(){
 const h=new Date().getHours();
 if(h>=5&&h<10)return {cls:'morning',label:'아침'};
 if(h>=10&&h<17)return {cls:'day',label:'낮'};
 if(h>=17&&h<20)return {cls:'evening',label:'저녁'};
 return {cls:'night',label:'밤'};
}
const growthNames=['아기 펭귄','첫걸음 펭귄','호기심 펭귄','단어 수집가','생각 탐험가','넓게 보는 펭귄','문장 연결가','이야기 탐험가','표현 전문가','사각모 펭귄'];

function updateAntarctic(){
 const lv=growthLevel(),tm=antarcticTime(),world=document.getElementById('antarcticWorld');
 if(!world)return;
 world.className='antarctic-world '+tm.cls;document.getElementById('timeChip').textContent=tm.label;
 document.getElementById('antarcticLevel').textContent=lv;document.getElementById('antarcticLevelName').textContent=growthNames[lv-1]||'성장 펭귄';const gp=document.getElementById('growthPenguin');if(gp){gp.src='assets/penguins/'+growthPenguinFiles[lv-1];gp.alt=lv+'단계 '+(growthNames[lv-1]||'성장 펭귄')}
 const inLevel=state.fed%5,fill=lv>=10?100:inLevel/5*100;document.getElementById('growthFill').style.width=fill+'%';
 document.getElementById('nextGrowthText').textContent=lv>=10?'최고 성장 단계에 도착했어요!':'다음 성장까지 물고기 '+(5-inLevel)+'마리';
 const feed=document.getElementById('feedBtn');feed.disabled=state.fish<1;
}
function updateUI(){document.getElementById('fishCount').textContent=state.fish;document.getElementById('sentenceCount').textContent=state.sentences.length;document.getElementById('treasureCount').textContent=state.treasures.length;document.getElementById('antarcticFish').textContent=state.fish;document.getElementById('fedCount').textContent=state.fed;document.getElementById('growthStat').textContent='🐧 '+growthLevel()+'단계 · '+(growthNames[growthLevel()-1]||'성장 중인 펭귄');updateAntarctic();let d=document.getElementById('dictionaryList');d.innerHTML=state.sentences.length?state.sentences.slice().reverse().map((x,i)=>`<div class="dict-item"><b>${state.sentences.length-i}번째 문장</b><br>${escapeHtml(x.text)}</div>`).join(''):`<div class="card empty-note">아직 저장한 문장이 없어요.<br>새 문장을 만들어 보세요.</div>`;let t=document.getElementById('treasureList');t.className=state.treasures.length?'':'empty-note';t.innerHTML=state.treasures.length?state.treasures.map(x=>`<button class="treasure-btn" data-treasure="${escapeHtml(x)}">🎁 ${escapeHtml(x)}<br><small>이야기 보기 ›</small></button>`).join(''):'아직 발견한 보물이 없어요.';let sp=document.getElementById('specialList');sp.className=state.specialPenguins.length?'':'empty-note';sp.innerHTML=state.specialPenguins.length?state.specialPenguins.map(x=>`<div class="dict-item">🐧 특별 펭귄 ${escapeHtml(x.split('-').pop())}</div>`).join('') :'앞으로 만날 특별 펭귄을 기다려 주세요.';document.querySelectorAll('.treasure-btn').forEach(b=>b.onclick=()=>openTreasure(b.dataset.treasure))}

function openTreasure(name){let x=treasureDB.find(t=>t.name===name);if(!x)return;document.getElementById('modalTitle').textContent=x.name;document.getElementById('modalSource').textContent=x.type+' · 「'+x.story+'」';document.getElementById('modalSummary').innerHTML=x.summary.map(s=>escapeHtml(s)).join('<br>');let m=document.getElementById('treasureModal');m.classList.add('open');m.setAttribute('aria-hidden','false')}
function closeTreasure(){let m=document.getElementById('treasureModal');m.classList.remove('open');m.setAttribute('aria-hidden','true')}
function grantCompletionReward(text,kind='sentence'){
 const normalized=normalizeMeaningText(text);

function contextualQuestions(){
 const last=(storyDraft&&storyDraft.length)?storyDraft[storyDraft.length-1]:'';
 const p=ans.predicate||'',rawObject=ans.object||'',o=rawObject?stripParticle(rawObject):'';
 const hasObject=!!rawObject,hasPlace=!!ans.place,hasSubject=!!ans.subject,hasReason=!!ans.reason;
 let result='그 다음에는 어떻게 되었어요?',thought='그 일에 대해 어떤 생각을 했어요?',feeling='그때 어떤 기분이 들었어요?';

 // 구체적인 정보가 실제로 선택되었을 때만 그 정보를 질문에 사용한다.
 if(hasObject&&(/샀어요|골랐어요/.test(last)||(/샀어요|골랐어요/.test(p)&&storyDraft.length===1)))result=o+'을(를) 고른 다음에는 무엇을 했어요?';
 else if(!hasObject&&/샀어요|골랐어요/.test(p))result='그 다음에는 무엇을 했어요?';

 if(/먹었어요|마셨어요|든든/.test(last))result='그 다음에는 어떻게 되었어요?';
 if(hasSubject&&(/주었어요|건넸어요|돌려주었어요/.test(last)||/주었어요|건넸어요|돌려주었어요/.test(p)))result='그 사람은 어떻게 반응했어요?';
 else if(/주었어요|건넸어요|돌려주었어요/.test(last)||/주었어요|건넸어요|돌려주었어요/.test(p))result='그 다음에는 어떻게 되었어요?';
 if(hasObject&&(/숙제/.test(o)||/해야 할 일|끝냈어요|마쳤어요/.test(last)))result='그 일을 끝낸 다음에는 무엇을 했어요?';
 if(hasObject&&(/찾았어요/.test(last)||/찾았어요/.test(p)))result='찾은 다음에는 그것을 어떻게 했어요?';
 else if(!hasObject&&(/찾았어요/.test(last)||/찾았어요/.test(p)))result='찾은 다음에는 무엇을 했어요?';

 if(/기분|뿌듯|마음/.test(last)){thought=hasReason?'왜 그런 기분이 들었다고 생각해요?':'그 기분에 대해 어떤 생각을 했어요?';feeling='그 기분은 계속되었나요?'}
 if(/생각/.test(last)){result='그렇게 생각한 뒤에는 무엇을 했어요?';thought='다음에는 어떻게 하고 싶어요?'}

 // 장소·주어·이유가 없으면 후속 질문이 이를 새 사실처럼 전제하지 않는다.
 if(!hasPlace)thought=thought.replace(/그곳에서[^?]*\?/g,'그 일에 대해 어떤 생각을 했어요?');
 if(!hasSubject)result=result.replace(/친구|상대방|그 사람/g,'그 다음');
 if(!hasReason)thought=thought.replace(/^왜 /,'');
 return {result,thought,feeling}
}

function coherentNext(kind,text){
 const prev=(storyDraft&&storyDraft.length)?storyDraft[storyDraft.length-1]:'';
 let t=text.trim();
 if(kind==='result'&&!/^(그래서|그리고|그 뒤에|그러자|하지만|그런데)/.test(t)){
   t=(/했어요|샀어요|먹었어요|마셨어요|주었어요|끝냈어요/.test(prev)?'그 뒤에 ':'그리고 ')+t;
 }
 if(kind==='thought'&&!/^(그래서|그리고|그 뒤에|그러자|하지만|그런데)/.test(t)&&storyDraft.length>1)t='그리고 '+t;
 if(kind==='feeling'&&!/^(그래서|그리고|그 뒤에|그러자|하지만|그런데)/.test(t))t='그래서 '+t;
 return t.replace(/그래서 그래서/g,'그래서').replace(/그리고 그리고/g,'그리고').replace(/그 뒤에 그 뒤에/g,'그 뒤에')
}

function polishStory(lines){
 let out=(lines||[]).map((v,i)=>{
  let s=String(v||'').trim().replace(/\s+/g,' ');
  s=s.replace(/에서에서/g,'에서').replace(/은은|는는/g,m=>m[0]).replace(/을을|를를/g,m=>m[0]);
  // 첫 문장에서 주어가 이미 분명하면 뒤 문장의 반복되는 '나는'은 생략한다.
  if(i>0&&/^나는\s+/.test(s))s=s.replace(/^나는\s+/,'');
  // 연결어가 중복된 경우 하나만 남긴다.
  s=s.replace(/^(그래서|그리고|그 뒤에|그러자)\s+\1\s+/,'$1 ');
  // 문장부호는 하나로 정리한다.
  s=s.replace(/[.?!]+$/,'')+'.';
  return s;
 }).filter(Boolean);
 // 같은 의미의 문장이 연속되는 경우 뒤 문장을 제거한다.
 out=out.filter((v,i,a)=>i===0||normalizeMeaningText(v)!==normalizeMeaningText(a[i-1]));
 return out
}

 if(roll<.18){let locked=treasurePool.filter(x=>!state.treasures.includes(x));if(locked.length){reward=locked[Math.floor(Math.random()*locked.length)];rewardType='treasure';state.treasures.push(reward)}}
