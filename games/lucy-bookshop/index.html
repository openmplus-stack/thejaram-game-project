;padding:22px}.character p{font-size:18px}.footer{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin-top:22px}.note{background:#e5eee8;padding:14px;border-radius:12px}.small{font-size:15px}footer{text-align:center;margin:25px;color:#736b62}@media(max-width:650px){.app{padding:12px}.top{font-size:17px}.panel{padding:20px;min-height:70vh}.shop-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.book{min-height:95px}button{font-size:17px;padding:13px}.story-art{font-size:55px}}
</style><style id="step12">.scene-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.scene-stage{background:linear-gradient(160deg,#dceadd,#e9dcc3);border:2px solid #b7c9b7;border-radius:20px;min-height:260px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;margin:16px 0;padding:24px;text-align:center}.scene-stage .scene-emoji{font-size:clamp(65px,9vw,110px)}.scene-stage .scene-text{font-size:clamp(20px,2.6vw,28px);font-weight:700;line-height:1.55}.scene-progress{display:flex;gap:8px;margin:12px 0}.scene-progress span{flex:1;text-align:center;background:#e7ddca;border-radius:10px;padding:10px;font-size:15px}.scene-progress span.active{background:#277c77;color:white}.scene-progress span.done{background:#cde5d9}.clue{background:#e8f2ea;border-left:5px solid #287d7a;border-radius:12px;padding:16px;margin:15px 0}.scene-actions{display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px;margin-top:20px}.dialogue-line{background:#fff9ed;border:1px solid #d6c7ad;border-radius:15px;padding:18px;font-size:clamp(21px,2.5vw,27px);line-height:1.6}.status-pill{border-radius:100px;background:#fff3d5;padding:7px 12px;font-size:14px}.location-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.location-card{background:#e4ede6;border:2px solid #b4d1c5;padding:20px;min-height:115px}.location-card.current{border-color:#287d7a;background:#cce7dc}.small-note{font-size:16px;color:#6c665c}</style><style id="step13">.talkbox{border:2px solid #d2bfa2;background:#fffdf6;border-radius:18px;padding:16px;margin:15px 0}.talkhead{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}.speaker{font-weight:800;color:#287d7a;font-size:18px}.talktext{font-size:clamp(21px,2.5vw,28px);line-height:1.65;margin:12px 0}.talktools{display:flex;gap:8px;flex-wrap:wrap}.talktools button{font-size:16px;padding:10px 15px}.npc-choice{display:flex;flex-wrap:wrap;gap:10px;margin:12px 0}.npc-choice button{background:#e4efe7;border:2px solid #a6c9b6}.npc-choice button.selected{background:#287d7a;color:#fff}.transcript{background:#e9f2ed;border-radius:12px;padding:13px;font-size:17px;line-height:1.6}.interaction{background:#f8efdb;border-radius:12px;padding:14px;margin:12px 0}.dialogue-progress{color:#726b5e;font-size:15px}.talktools button:disabled{opacity:.45}.talktext:focus{outline:3px solid #d6a649}</style></head><body><div class="app"><div class="top"><span>📖 루시와 수상한 책방</span><button onclick="go('settings')">⚙️ 설정</button></div><main id="view" class="panel"></main><footer>11단계 개발용 프로토타입 · 전래동화 미션은 후속 단계에서 구현합니다.</footer></div><script>
const KEY='lucy-bookshop-save-v1';
const TALES=['금도끼 은도끼','흥부와 놀부','해와 달이 된 오누이','도깨비 방망이','선녀와 나무꾼','팥죽 할멈과 호랑이','혹부리 영감','토끼와 자라','콩쥐 팥쥐','견우와 직녀'];
const INTRO=['낯선 골목을 걷던 루시는 아주 작은 책방을 발견했어요. 낡은 간판에는 「수상한 책방」이라고 적혀 있었지요.','문을 열자 책들이 스스로 꿈틀거렸어요. "거기 서!" 늙은 검은 고양이가 책장 위에서 소리쳤어요.','그때 반짝이는 무언가가 책에서 튀어나왔어요. 알록달록한 복주머니가 펄쩍 뛰어올라 그것을 꿀꺽 삼켰지요.','"복딱! 또 너무 크게 삼켰잖아!" 고양이가 투덜거렸어요. 루시는 깜짝 놀라 가슴의 오래된 펜던트를 붙잡았어요.','고양이는 펜던트를 보고 눈을 크게 떴어요. "그 목걸이… 어디서 났지?" 루시가 대답하기도 전에 다른 물건이 책 밖으로 도망쳤어요.','"이야기들이 사라지고 있어!" 복딱이 말했어요. "우리와 함께 찾아줄래?" 이제 루시의 모험이 시작됩니다.'];
const EPISODES=[
{icon:'🪓',scene:[['숲속의 나무꾼','나무꾼은 손잡이에 흠집이 있는 쇠도끼로 나무를 베고 있었어요.','나무꾼의 도끼는 흠집이 있는 쇠도끼예요.'],['깊은 연못','쇠도끼가 연못에 빠졌어요. 산신령은 금도끼를 먼저 보여주려고 했어요.','산신령은 금도끼를 먼저 보여주려 해요.'],['빈손의 산신령','그런데 산신령이 금도끼를 찾지 못해요. 무슨 일이 일어났을까요?','앞의 두 단서를 비교해 사라진 물건을 추리해요.']],target:'금도끼',places:['전통시장','분실물 보관소']},
{icon:'🐦',scene:[['다친 제비','흥부가 다친 제비를 정성껏 돌보았어요.','흥부는 제비를 도와주었어요.'],['제비의 선물','제비가 흥부에게 작은 씨앗을 선물하려고 해요.','제비는 작은 씨앗을 가져오려고 해요.'],['빈 제비의 부리','제비가 돌아왔지만 선물이 보이지 않아요.','사라진 선물이 무엇인지 추리해요.']],target:'박씨',places:['공원','원예 상점']},
{icon:'🐯',scene:[['호랑이의 발자국','호랑이가 오누이를 쫓고 있어요.','호랑이가 오누이를 쫓아요.'],['하늘에 도움 요청','오누이가 하늘에 도움을 청했어요. 튼튼한 줄이 내려와야 해요.','하늘에서 튼튼한 줄이 내려와야 해요.'],['텅 빈 하늘','아무리 기다려도 줄이 내려오지 않아요.','사라진 것을 추리해요.']],target:'동아줄',places:['문화체험관','공원']},
{icon:'👹',scene:[['도깨비들의 잔치','도깨비들이 신비한 물건을 가지고 놀고 있어요.','도깨비는 신비한 물건을 사용해요.'],['마법의 주문','도깨비가 방망이를 두드리자 마법이 일어났어요.','방망이가 마법을 일으켜요.'],['멈춘 마법','주문을 외워도 마법이 일어나지 않아요.','사라진 물건을 추리해요.']],target:'도깨비 방망이',places:['박물관','문화체험관']},
{icon:'🪽',scene:[['숲속의 연못','선녀들이 특별한 옷을 입고 하늘에서 내려왔어요.','선녀들은 특별한 옷을 입어요.'],['돌아갈 시간','선녀가 하늘로 돌아가려면 날개옷이 필요해요.','날개옷이 있어야 돌아갈 수 있어요.'],['사라진 옷','선녀가 날개옷을 찾지 못하고 있어요.','사라진 옷을 추리해요.']],target:'날개옷',places:['한복·공예점','박물관']},
{icon:'🥣',scene:[['팥죽 끓이는 날','할머니가 팥죽을 끓이는데 호랑이가 찾아왔어요.','호랑이가 할머니를 위협해요.'],['작은 친구들의 약속','알밤을 비롯한 친구들이 할머니를 돕기로 했어요.','알밤은 할머니를 돕기로 했어요.'],['비어 있는 자리','친구들이 모였지만 알밤이 보이지 않아요.','사라진 친구를 추리해요.']],target:'알밤',places:['전통시장','공원']},
{icon:'🎵',scene:[['숲속의 노랫소리','혹이 있는 영감이 숲에서 노래를 불렀어요.','영감에게 혹이 있어요.'],['도깨비의 오해','도깨비는 혹에 노래가 들어 있다고 생각했어요.','도깨비는 혹을 가져가려 해요.'],['빈 보따리','도깨비가 혹을 가져가려는데 혹이 보이지 않아요.','사라진 것을 추리해요.']],target:'혹',places:['문화체험관','분실물 보관소']},
{icon:'🐢',scene:[['용궁의 걱정','용왕이 병들어 토끼를 찾아야 한다고 해요.','용궁에서는 토끼를 찾아야 해요.'],['육지로 갈 사신','자라가 육지에 가서 토끼를 만나기로 했어요.','자라는 육지와 용궁을 오가는 사신이에요.'],['떠나지 못한 사신','자라를 부르지만 어디에도 보이지 않아요.','사라진 사신을 추리해요.']],target:'자라',places:['생태공원','야생동물 구조센터']},
{icon:'🐸',scene:[['어려운 심부름','콩쥐가 밑 빠진 독에 물을 붓고 있어요.','독에 구멍이 있어 물이 새요.'],['작은 도움','두꺼비가 독의 구멍을 막아 주려고 해요.','두꺼비는 독의 구멍을 막아요.'],['다시 새는 물','구멍을 막아 줄 두꺼비가 보이지 않아요.','사라진 친구를 추리해요.']],target:'두꺼비',places:['공원','생태공원']},
{icon:'🌌',scene:[['은하수 양쪽','견우와 직녀가 은하수 양쪽에서 서로를 그리워해요.','두 사람 사이에는 은하수가 있어요.'],['다리를 만드는 새들','까치와 까마귀가 모여 오작교를 놓으려 해요.','특별한 까치가 다리 놓기를 이끌어요.'],['끊어진 다리','다리를 이끌던 까치가 보이지 않아 다리가 이어지지 않아요.','사라진 새를 추리해요.']],target:'특별한 까치',places:['공원','생태공원']}
];
const DEFAULT={page:'start',uiLanguage:'ko',topik:'unknown',diagnostic:'later',prologueIndex:0,restoredIds:[],selectedBook:null,episodeProgress:{}};
let s;try{s={...DEFAULT,...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch{s={...DEFAULT}};if(!s.episodeProgress||typeof s.episodeProgress!=='object')s.episodeProgress={};
const view=document.getElementById('view');
const esc=x=>String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const save=()=>localStorage.setItem(KEY,JSON.stringify(s));
function set(p){Object.assign(s,p);save();render()}
function go(p){set({page:p})}
function newGame(){if(Object.keys(s.episodeProgress).length&&!confirm('새 모험을 시작하면 이전 진행 기록이 초기화됩니다. 계속할까요?'))return;s={...DEFAULT,page:'setup'};save();render()}
function progress(i){return s.episodeProgress[i]||{phase:'story',scene:0,clues:[],location:0}}
function updateProgress(i,patch){s.episodeProgress[i]={...progress(i),...patch};save();render()}
function book(i){set({page:'book',selectedBook:i})}
function openEpisode(){const i=s.selectedBook;if(i===null)return go('shop');const p=progress(i);go(p.phase==='modern'?'modern':p.phase==='recovered'?'return':p.phase==='completed'?'book':'scene')}
function nextScene(){const i=s.selectedBook,p=progress(i);if(p.phase!=='story')return;const scene=Math.min(2,Math.max(0,p.scene));if(scene<2){const clue='A'.charCodeAt(0)+scene;const id=String.fromCharCode(clue);updateProgress(i,{scene:scene+1,clues:[...new Set([...(p.clues||[]),id])]})}else{updateProgress(i,{phase:'modern',scene:2,clues:['A','B'],location:0});go('modern')}}
function backScene(){const i=s.selectedBook,p=progress(i);if(p.scene>0)updateProgress(i,{scene:p.scene-1});else go('book')}
function modernNext(){const i=s.selectedBook,p=progress(i);if(p.location<EPISODES[i].places.length-1)updateProgress(i,{location:p.location+1});else{updateProgress(i,{phase:'recovered'});go('return')}}
function returnStory(){const i=s.selectedBook;if(progress(i).phase!=='recovered')return;updateProgress(i,{phase:'completed'});s.restoredIds=[...new Set([...(s.restoredIds||[]),'ep'+(i+1)])];save();go('restored')}
function reset(){if(confirm('이 기기의 모든 진행 기록을 초기화할까요?')){localStorage.removeItem(KEY);s={...DEFAULT};render()}}
function speak(text){if(!('speechSynthesis'in window))return alert('이 기기는 음성 재생을 지원하지 않습니다.');speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='ko-KR';u.rate=.9;speechSynthesis.speak(u)}
function levels(){return '<option value="unknown">모르겠어요</option>'+[1,2,3,4,5,6].map(n=>'<option value="'+n+'">TOPIK '+n+'급</option>').join('')}
function setSelect(id,val){const el=document.getElementById(id);if(el)el.value=val}
function render(){
let h='',page=s.page,i=s.selectedBook,e=i===null?null:EPISODES[i],p=i===null?null:progress(i);
if(page==='start')h='<section class="hero"><div class="art">📚 ✨ 🐈‍⬛</div><p class="kicker">한국어로 이야기를 되찾는 모험</p><h1>루시와<br>수상한 책방</h1><p>사라진 전래동화 속 비밀을 찾아보세요.</p><div class="actions"><button class="primary" onclick="newGame()">모험 시작하기 →</button><button onclick="resume()" '+(!localStorage.getItem(KEY)||(!Object.keys(s.episodeProgress).length&&s.prologueIndex===0)?'disabled':'')+'>이어하기</button></div></section>';
else if(page==='setup')h='<p class="kicker">모험 준비</p><h2>루시와 함께 떠나볼까요?</h2><label>화면 안내 언어</label><select id="lang" onchange="set({uiLanguage:this.value})"><option value="ko">한국어</option><option value="en">English (번역 예정)</option><option value="ja">日本語 (번역 예정)</option><option value="zh">简体中文 (번역 예정)</option><option value="vi">Tiếng Việt (번역 예정)</option></select><p class="muted small">현재 시범판의 안내문은 한국어로 제공됩니다.</p><label>한국어 수준</label><select id="level" onchange="set({topik:this.value})">'+levels()+'</select><label>간단한 수준 확인</label><select id="diag" onchange="set({diagnostic:this.value})"><option value="later">나중에 할래요</option><option value="now">지금 확인할래요 (후속 개발)</option></select><div class="actions"><button onclick="go(\'start\')">이전</button><button class="primary" onclick="set({page:\'prologue\',prologueIndex:0})">이야기 시작 →</button></div>';
else if(page==='prologue'){const t=INTRO[Math.max(0,Math.min(5,s.prologueIndex))];h='<p class="kicker">프롤로그 '+(s.prologueIndex+1)+' / '+INTRO.length+'</p><div class="story-art">📚 🐈‍⬛ ✨</div><div class="dialogue">'+esc(t)+'</div><div class="actions"><button onclick="set({prologueIndex:Math.max(0,s.prologueIndex-1)})" '+(s.prologueIndex===0?'disabled':'')+'>이전</button><button onclick="speak(INTRO[s.prologueIndex])">🔊 듣기</button><button class="primary" onclick="introNext()">'+(s.prologueIndex===INTRO.length-1?'책방 들어가기':'다음 →')+'</button></div>'}
else if(page==='shop')h='<p class="kicker">마법의 책방 · 복원 '+s.restoredIds.length+'/10권</p><h2>어떤 이야기를 펼칠까요?</h2><div class="character">🐈‍⬛ <p>서묵: 흠, 다음 책을 골라 보라고.</p></div><div class="shop-grid">'+TALES.map((t,n)=>'<button class="book '+(s.restoredIds.includes('ep'+(n+1))?'restored':'')+'" onclick="book('+n+')"><span>📕 '+(n+1)+'</span>'+esc(t)+'</button>').join('')+'</div><div class="footer"><button onclick="alert(\'복딱 보관함은 15단계에서 구현합니다.\')">🎒 복딱</button><button onclick="alert(\'단서 기록은 16단계에서 구현합니다.\')">📜 단서</button><button onclick="alert(\'학습 기록은 17단계에서 구현합니다.\')">⭐ 학습 기록</button></div>';
else if(page==='book'&&e){const done=p.phase==='completed';h='<button onclick="go(\'shop\')">← 책방으로</button><div class="character">'+e.icon+'</div><p class="kicker">전래동화 '+(i+1)+'</p><h2>'+esc(TALES[i])+'</h2><p>사라진 존재를 찾아 이야기를 복원하세요.</p><p class="note">'+(done?'이 책의 이야기가 복원되었습니다.':p.phase==='modern'?'현대 한국에서 단서를 조사할 차례입니다.':p.phase==='recovered'?'복딱이 사라진 존재를 찾았습니다. 이야기로 돌아가세요.':'장면 '+(p.scene+1)+'/3 · 장면 전환 시범판')+'</p><button class="primary" onclick="openEpisode()">'+(done?'복원 완료 ✓':p.phase==='modern'?'현대 한국으로 이동 →':p.phase==='recovered'?'이야기 복원하기 →':'이야기 펼치기 →')+'</button>'}
else if(page==='scene'&&e){const scene=Math.min(2,p.scene),d=e.scene[scene];h='<div class="scene-head"><button onclick="go(\'book\')">← 책 정보</button><span class="status-pill">전래동화 '+(i+1)+' · TOPIK '+(s.topik==='unknown'?'미선택':s.topik+'급')+'</span></div><h2>'+esc(TALES[i])+'</h2><div class="scene-progress">'+[0,1,2].map(n=>'<span class="'+(n===scene?'active':n<scene?'done':'')+'">장면 '+(n+1)+'</span>').join('')+'</div><div class="scene-stage"><div class="scene-emoji">'+e.icon+' 📖</div><div class="scene-text">'+esc(d[0])+'</div><p class="small-note">장면 이미지와 캐릭터는 후속 단계에서 연결합니다.</p></div><div class="dialogue-line">'+esc(d[1])+'</div>'+talkHTML()+(scene<2?'<div class="clue">🔎 단서 '+(scene===0?'A':'B')+' · '+esc(d[2])+'</div>':'<div class="clue">🔎 단서 A와 B를 연결해 사라진 존재를 추리해 보세요.<br><span class="small-note">정답 추론 미션은 14단계에서 구현합니다.</span></div>')+'<div class="scene-actions"><button onclick="backScene()">← 이전</button><button onclick="speak(EPISODES[s.selectedBook].scene[progress(s.selectedBook).scene][1])">🔊 듣기</button><button class="primary" onclick="nextScene()">'+(scene===2?'현대 한국 탐색 →':'단서 확인 · 다음 →')+'</button></div>'}
else if(page==='modern'&&e){const loc=e.places[p.location];h='<div class="scene-head"><button onclick="go(\'book\')">← 책 정보</button><span class="status-pill">현대 한국 탐색 · '+(p.location+1)+'/'+e.places.length+'</span></div><h2>'+esc(TALES[i])+' · 탐색 지도</h2><div class="location-grid">'+e.places.map((x,n)=>'<button class="location-card '+(n===p.location?'current':'')+'" onclick="chooseLocation('+n+')" '+(n>p.location?'disabled':'')+'><div style="font-size:40px">📍</div>'+esc(x)+'</button>').join('')+'</div><div class="scene-stage"><div class="scene-emoji">🏙️ 🔎</div><div class="scene-text">'+esc(loc)+'</div></div><div class="dialogue-line">루시: 이곳에서 이야기의 흔적을 찾아보자!</div><p class="note">12단계 장면 이동 시범판입니다. NPC 대화·검증·실제 회수 미션은 13~16단계에서 연결합니다.</p><div class="scene-actions"><button onclick="go(\'book\')">← 돌아가기</button><button class="primary" onclick="modernNext()">'+(p.location===e.places.length-1?'회수 연출로 이동 →':'다음 장소 →')+'</button></div>'}
else if(page==='return'&&e)h='<p class="kicker">전래동화 귀환</p><div class="scene-stage"><div class="scene-emoji">🎒 ✨ '+e.icon+'</div><div class="scene-text">복딱이 '+esc(e.target)+'을(를) 데리고 돌아왔어요!</div></div><p class="note">이 단계의 회수는 화면 이동 테스트용 연출입니다. 실제 정답 검증과 회수 조건은 후속 단계에서 구현합니다.</p><button class="primary" onclick="returnStory()">이야기 복원 →</button>';
else if(page==='restored'&&e)h='<section class="hero"><div class="art">✨ 📖 ✨</div><h2>이야기가 돌아왔어요!</h2><p>「'+esc(TALES[i])+'」가 복원되었습니다.</p><p class="kicker">복원한 책 '+s.restoredIds.length+' / 10권</p><button class="primary" onclick="go(\'shop\')">책방으로 돌아가기 →</button></section>';
else if(page==='settings')h='<button onclick="go(\'shop\')">← 책방으로</button><h2>설정</h2><label>한국어 수준</label><select id="level" onchange="set({topik:this.value})">'+levels()+'</select><label>안내 언어 (번역 후속 구현)</label><select id="lang" onchange="set({uiLanguage:this.value})"><option value="ko">한국어</option><option value="en">English</option><option value="ja">日本語</option><option value="zh">简体中文</option><option value="vi">Tiếng Việt</option></select><div class="actions"><button onclick="go(\'start\')">시작 화면</button><button onclick="reset()">저장 기록 초기화</button></div>';
else {s.page='shop';save();return render()}
view.innerHTML=h;setSelect('lang',s.uiLanguage);setSelect('level',s.topik);setSelect('diag',s.diagnostic);
}
function introNext(){if(s.prologueIndex>=INTRO.length-1)go('shop');else set({prologueIndex:s.prologueIndex+1})}
function chooseLocation(n){if(n<=progress(s.selectedBook).location)updateProgress(s.selectedBook,{location:n})}
function resume(){if(s.selectedBook!==null&&s.episodeProgress[s.selectedBook]){const p=progress(s.selectedBook);go(p.phase==='modern'?'modern':p.phase==='recovered'?'return':p.phase==='completed'?'shop':'scene')}else go(s.prologueIndex>0?'prologue':'shop')}

const DIALOGUES={
lucy:['여기는 어디일까?','이야기가 이상해졌어. 단서를 찾아보자!','이야기를 다시 이어 주고 싶어.'],
seomuk:['책이 점점 얇아지고 있어.','잘 봐. 작은 차이에도 이유가 있지.','네가 직접 찾아야 해.'],
bokddak:['내가 도와줄게!','이건 중요한 단서 같아!','복딱! 현대 한국으로 출발!']
};
let talk={context:'',index:0,translated:false,rate:1,voiceOn:true,npc:'',npcStep:0};
const NPCS={
'전통시장':[['상인','어서 오세요. 무엇을 찾으세요?'],['상인','금빛 물건을 들고 지나간 사람을 보았어요.'],['상인','분실물 보관소에도 물어보세요.']],
'분실물 보관소':[['직원','찾으시는 물건의 특징을 말씀해 주세요.'],['직원','접수 기록과 실제 물건을 비교해 보세요.'],['직원','기록만으로는 확실하지 않을 수 있어요.']],
'공원':[['관리인','무엇을 찾으세요?'],['관리인','이곳에서 특이한 물건을 보았다는 사람이 있어요.'],['관리인','주변을 자세히 살펴보세요.']],
'원예 상점':[['가게 주인','어떤 씨앗을 찾으세요?'],['가게 주인','모양과 쓰임을 알려주시면 함께 찾아볼게요.'],['가게 주인','씨앗을 함부로 가져가면 안 돼요.']],
'문화체험관':[['안내원','전래동화와 관련된 것을 찾으시나요?'],['안내원','전시 설명을 읽으면 단서가 될 거예요.'],['안내원','어떤 물건인지 직접 비교해 보세요.']],
'박물관':[['해설사','안녕하세요. 어떤 전시를 찾으세요?'],['해설사','전시품의 이름과 쓰임을 확인해 보세요.'],['해설사','비슷해 보여도 서로 다른 물건이 있어요.']],
'한복·공예점':[['가게 주인','어떤 옷을 찾으세요?'],['가게 주인','옷의 모양과 쓰임을 설명해 주세요.'],['가게 주인','이 옷이 맞는지 다시 확인해 보세요.']],
'생태공원':[['해설사','어떤 생물을 찾고 있나요?'],['해설사','생김새와 사는 곳을 함께 살펴보세요.'],['해설사','동물을 발견하면 안전하게 전문가에게 알려주세요.']],
'야생동물 구조센터':[['보호사','어떤 동물을 찾고 있나요?'],['보호사','동물은 허락 없이 만지거나 옮기면 안 됩니다.'],['보호사','안전한 이동은 보호사가 도와줄게요.']]
};
function dialogContext(){return s.page==='scene'?'scene-'+s.selectedBook+'-'+progress(s.selectedBook).scene:s.page==='modern'?'modern-'+s.selectedBook+'-'+progress(s.selectedBook).location:''}
function dialogLines(){if(s.selectedBook===null)return [];const ep=EPISODES[s.selectedBook],p=progress(s.selectedBook);if(s.page==='scene'){const d=ep.scene[p.scene];return [['루시',d[1]],['서묵',p.scene===2?'두 단서를 연결해서 생각해 봐.':DIALOGUES.seomuk[p.scene]],['복딱',DIALOGUES.bokddak[p.scene]],['루시',p.scene===2?'누가, 무엇이 사라졌을까?':d[2]]]}if(s.page==='modern'){const place=ep.places[p.location],npc=NPCS[place]||[['안내원','무엇을 찾고 있나요?'],['안내원','주변 사람에게 물어보세요.'],['안내원','단서를 다시 확인해 보세요.']];return [['루시','실례합니다. 잠깐 여쭤봐도 될까요?'],...npc,['복딱','이제 다른 단서도 살펴보자!']]}return []}
function resetTalk(){talk={context:dialogContext(),index:0,translated:false,rate:1,voiceOn:true,npc:'',npcStep:0}}
function ensureTalk(){const ctx=dialogContext();if(talk.context!==ctx)resetTalk()}
function currentTalk(){ensureTalk();const lines=dialogLines();return lines[Math.min(talk.index,Math.max(0,lines.length-1))]||['루시','이야기를 살펴보자.']}
function talkNext(){ensureTalk();const n=dialogLines().length;talk.index=Math.min(talk.index+1,n-1);talk.translated=false;render()}
function talkPrev(){ensureTalk();talk.index=Math.max(0,talk.index-1);talk.translated=false;render()}
function talkRate(){talk.rate=talk.rate===1?0.75:talk.rate===0.75?1.25:1;render()}
function talkTranslate(){talk.translated=!talk.translated;render()}
function talkSpeak(){const line=currentTalk();if(!('speechSynthesis'in window))return alert('음성 합성을 지원하지 않습니다.');speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(line[1]);u.lang='ko-KR';u.rate=talk.rate;u.onerror=()=>{const e=document.getElementById('speech-status');if(e)e.textContent='음성 재생에 실패했습니다. 문장을 읽거나 다시 시도해 주세요.'};speechSynthesis.speak(u)}
function talkStop(){if('speechSynthesis'in window)speechSynthesis.cancel()}
function talkHTML(){ensureTalk();const lines=dialogLines(),line=currentTalk(),last=talk.index===lines.length-1;return '<section class="talkbox" aria-label="인물 대화"><div class="talkhead"><span class="speaker">💬 '+esc(line[0])+'</span><span class="dialogue-progress">대화 '+(talk.index+1)+' / '+lines.length+'</span></div><div class="talktext" tabindex="0">'+esc(line[1])+'</div><div class="talktools"><button onclick="talkSpeak()" aria-label="현재 대사 듣기">🔊 듣기</button><button onclick="talkStop()" aria-label="음성 멈추기">■ 멈춤</button><button onclick="talkRate()">속도 '+talk.rate+'×</button><button onclick="talkTranslate()">🌐 뜻 보기</button><button onclick="talkPrev()" '+(talk.index===0?'disabled':'')+'>◀ 이전 대사</button><button onclick="talkNext()" '+(last?'disabled':'')+'>다음 대사 ▶</button></div><div id="speech-status" class="small-note" role="status"></div>'+(talk.translated?'<div class="transcript">현재 번역 콘텐츠는 제작 중입니다. 원문: '+esc(line[1])+'</div>':'')+'</section>'}
function interactNPC(){ensureTalk();const lines=dialogLines();talk.index=Math.min(lines.length-1,Math.max(1,talk.index+1));render()}
function talkReady(){ensureTalk();return talk.index>=dialogLines().length-1}

render();
</script></body></html>
