/* asset recovery: keep this app self-contained and retry images from the repository source if CDN deployment misses a binary asset */
(function(){
  const RAW='https://raw.githubusercontent.com/openmplus-stack/thejaram-game-project/main/games/sentence-builder-grade6/';
  function recover(img){
    if(!img || img.dataset.assetRecovery==='1') return;
    const src=img.getAttribute('src')||'';
    if(!src || /^data:|^blob:|^https:\/\/raw\.githubusercontent\.com/.test(src)) return;
    let rel=src.replace(/^\.\//,'');
    if(rel.startsWith('../munjang-talktalk/assets/')) rel='assets/'+rel.split('/assets/')[1];
    if(rel.startsWith('assets/')){
      img.dataset.assetRecovery='1';
      img.src=RAW+rel;
    }
  }
  document.addEventListener('error',e=>{ if(e.target && e.target.tagName==='IMG') recover(e.target); },true);
})();

function getPredicateFrameV2(value){
  const raw=String(value||'').trim().replace(/[.?!,]+$/,'');

}

function requiredRolesForV2(predicate){
  const frame=getPredicateFrameV2(predicate);
  return frame?frame.required.slice():[];
}

function nextRequiredRoleV2(event){
  const e=event||{};
  const frame=getPredicateFrameV2(e.predicate);
  if(!frame)return null;
  return frame.required.find(role=>{

    return Array.isArray(v)?v.length===0:!v;
  })||null;
}

function semanticTypesForV2(value){
  const raw=String(value||'').trim().replace(/(은|는|이|가|을|를|에|에서|와|과|에게)$/,'');
  const types=[];
  Object.entries(SEMANTIC_LEXICON_V2).forEach(([type,words])=>{if(words.includes(raw))types.push(type)});
  return types;
}

function predicateCandidatesForNounV2(value){
  const raw=String(value||'').trim().replace(/(은|는|이|가|을|를|에|에서|와|과|에게)$/,'');
  return (NOUN_PREDICATE_LINKS_V2[raw]||[]).slice();
}

function isSemanticFitV2(predicate,role,value){
  const frame=getPredicateFrameV2(predicate);
  if(!frame||!frame.semantic||!frame.semantic[role])return true;
  const allowed=frame.semantic[role];
  const types=semanticTypesForV2(value);
  if(!types.length)return null;
  return types.some(t=>allowed.includes(t));
}

function meaningCandidatesV2(rawInput){
  const raw=String(rawInput||'').trim().replace(/[.?!,]+$/,'');
  if(!raw)return [];
  if(AMBIGUOUS_INPUT_HINTS_V2[raw])return AMBIGUOUS_INPUT_HINTS_V2[raw].slice();
  const predicates=predicateCandidatesForNounV2(raw);
  if(predicates.length){
    return predicates.slice(0,4).map(p=>{
      const f=getPredicateFrameV2(p);
      return f?raw+' + '+f.display:raw+' + '+p;
    });
  }
  return [];
}

function tokenizeMeaningInputV2(rawInput){

function predicateFromLooseTokenV2(token){
  const raw=String(token||'').trim();
  const direct=getPredicateFrameV2(raw);
  if(direct)return {key:Object.keys(PREDICATE_FRAMES_V2).find(k=>PREDICATE_FRAMES_V2[k]===direct)||raw,frame:direct,confidence:1};
  const maps={
    '했어':'놀다','했다':'놀다','해':'놀다',
    '갔어':'가다','갔다':'가다',
    '먹었어':'먹다','먹었다':'먹다',
    '마셨어':'마시다','마셨다':'마시다',
    '읽었어':'읽다','읽었다':'읽다',
    '썼어':'쓰다','썼다':'쓰다',
    '놀았어':'놀다','놀았다':'놀다',
    '만났어':'만나다','만났다':'만나다',
    '줬어':'주다','주었어':'주다','주었다':'주다',
    '받았어':'받다','받았다':'받다',
    '만들었어':'만들다','만들었다':'만들다',
    '도왔어':'돕다','도와줬어':'돕다',
    '좋아해':'좋아하다','좋아했어':'좋아하다'
  };
  const key=maps[raw];
  return key?{key,frame:PREDICATE_FRAMES_V2[key],confidence:.85}:null;
}

function inferRoleCandidatesV2(tokens,predicateKey){
  const frame=getPredicateFrameV2(predicateKey);
  const candidates=[];
  tokens.forEach((token,index)=>{
    const types=semanticTypesForV2(token);
    const roleScores={};
    if(types.includes('person')){
      roleScores.subject=.55;
      if(frame&&frame.required.includes('recipient'))roleScores.recipient=.7;
      if(frame&&frame.required.includes('object')&&frame.semantic&&frame.semantic.object&&frame.semantic.object.includes('person'))roleScores.object=.72;
      if(frame&&frame.optional.includes('companion'))roleScores.companion=.68;
    }
    if(types.includes('place')){
      if(frame&&frame.required.includes('destination'))roleScores.destination=.82;
      if(frame&&frame.optional.includes('place'))roleScores.place=.72;
    }
    if(types.some(t=>['food','drink','reading','writing','thing','toy','sport','activity','craft','animal','topic'].includes(t))){
      if(frame&&frame.required.includes('object'))roleScores.object=.78;
      else roleScores.object=.52;
    }
    if(token==='나')roleScores.subject=.95;
    candidates.push({token,index,types,roleScores});
  });
  return candidates;
}

function detectAffectTokensV2(tokens){
  const emotionMap={
    '무서워':'무서웠다','무서웠어':'무서웠다','무섭다':'무서웠다',
    '좋아':'좋았다','좋았어':'좋았다','좋다':'좋았다',
    '싫어':'싫었다','싫었어':'싫었다','싫다':'싫었다',
    '기뻐':'기뻤다','기뻤어':'기뻤다',
    '슬퍼':'슬펐다','슬펐어':'슬펐다',
    '화나':'화가 났다','화났어':'화가 났다',
    '재밌어':'재미있었다','재미있어':'재미있었다',
    '재미있었어':'재미있었다',
    '궁금해':'궁금했다','궁금했어':'궁금했다'
  };
  return tokens.map((t,i)=>emotionMap[t]?{token:t,index:i,normalized:emotionMap[t]}:null).filter(Boolean);
}

function buildMeaningHypothesesV2(rawInput){
  const raw=String(rawInput||'').trim();
  const tokens=tokenizeMeaningInputV2(raw);
  const result={
    raw,
    tokens,
    status:'needs-meaning',
    predicate:null,
    roles:{},
    affect:detectAffectTokensV2(tokens),
    ambiguities:[],
    hypotheses:[],
    confidence:0
  };
  if(!tokens.length)return result;

  let predicateHit=null,predicateIndex=-1;
  for(let i=0;i<tokens.length;i++){
    const hit=predicateFromLooseTokenV2(tokens[i]);
    if(hit){predicateHit=hit;predicateIndex=i;break}
  }
  if(predicateHit){
    result.predicate=predicateHit.key;
    result.confidence=predicateHit.confidence;
  }

  const contentTokens=tokens.filter((_,i)=>i!==predicateIndex&&!result.affect.some(a=>a.index===i));
  if(predicateHit){
    const roleCandidates=inferRoleCandidatesV2(contentTokens,predicateHit.key);
    const used=new Set();
    const frame=predicateHit.frame;
    frame.required.forEach(role=>{
      let best=null;
      roleCandidates.forEach(c=>{
        if(used.has(c.index))return;
        const score=c.roleScores[role]||0;
        if(!best||score>best.score)best={c,score};
      });
      if(best&&best.score>=.65){
        result.roles[role]=best.c.token;used.add(best.c.index);
      }
    });
    contentTokens.forEach((t,i)=>{
      if(!used.has(i)){
        const types=semanticTypesForV2(t);
        if(types.includes('place')&&!result.roles.place&&!result.roles.destination){
          if(frame.required.includes('destination'))result.roles.destination=t;
          else result.roles.place=t;
        }else if(types.includes('person')&&!result.roles.subject){
          result.roles.subject=t;
        }else if(!result.roles.object&&types.length){
          result.roles.object=t;
        }
      }
    });
  }

  if(!predicateHit){
    const singleHints=tokens.flatMap(t=>meaningCandidatesV2(t).map(x=>({token:t,text:x})));
    if(singleHints.length){
      result.hypotheses=singleHints.slice(0,6).map((x,i)=>({id:'h'+(i+1),text:x.text,sourceToken:x.token,confidence:.55}));
      result.ambiguities.push({type:'missing-predicate',message:'무엇을 했는지 조금 더 알려 주세요.'});
    }
  }else{
    const frame=predicateHit.frame;
    const missing=frame.required.filter(role=>!result.roles[role]);
    if(missing.length){
      missing.forEach(role=>result.ambiguities.push({
        type:'missing-role',
        role,
        message:(frame.questions&&frame.questions[role])||((MEANING_ROLES_V2[role]&&MEANING_ROLES_V2[role].label)||role)
      }));
    }
    const assigned=Object.entries(result.roles);
    assigned.forEach(([role,value])=>{
      const fit=isSemanticFitV2(predicateHit.key,role,value);
      if(fit===false){
        result.ambiguities.push({type:'semantic-mismatch',role,value,message:'“'+value+'”의 뜻이 이 행동과 잘 맞는지 확인해 주세요.'});
      }
    });
    if(!result.ambiguities.length){
      result.status='meaning-ready';
      result.confidence=Math.max(result.confidence,.8);
    }
  }

  if(result.affect.length&&!result.roles.emotion){
    result.roles.emotion=result.affect[0].normalized;
  }
  return result;
}

function meaningClarificationChoicesV2(analysis){
  const a=analysis||{};
  const choices=[];
  (a.ambiguities||[]).forEach(item=>{
    if(item.type==='missing-predicate'){
      (a.tokens||[]).forEach(t=>{
        meaningCandidatesV2(t).forEach(x=>choices.push({type:'predicate-or-event',label:x}));
      });
    }else if(item.type==='missing-role'&&a.predicate){
      const frame=getPredicateFrameV2(a.predicate);
      const role=item.role;
      const allowed=(frame&&frame.semantic&&frame.semantic[role])||[];
      Object.entries(SEMANTIC_LEXICON_V2).forEach(([type,words])=>{
        if(allowed.includes(type))words.slice(0,6).forEach(w=>choices.push({type:'role',role,label:w}));
      });
    }else if(item.type==='semantic-mismatch'){
      const preds=predicateCandidatesForNounV2(item.value);
      preds.slice(0,4).forEach(p=>{
        const f=getPredicateFrameV2(p);
        choices.push({type:'repair',role:item.role,label:item.value+' + '+(f?f.display:p)});
      });
    }
  });
  const seen=new Set();
  return choices.filter(x=>{const k=(x.role||'')+'|'+x.label;if(seen.has(k))return false;seen.add(k);return true}).slice(0,8);
}

function recordMeaningAnalysisV2(rawInput){
  const analysis=buildMeaningHypothesesV2(rawInput);
  storyV2.rawInputs.push({text:String(rawInput||''),at:new Date().toISOString()});
  storyV2.meanings.push(analysis);
  storyV2.learningLog.ambiguityChecks+=(analysis.ambiguities||[]).length;
  return analysis;
}


function stripRoleParticleV2(value){
  return String(value||'').trim().replace(/[.?!,]+$/,'').replace(/(은|는|이|가|을|를|에게|한테|와|과|랑|이랑|에|에서)$/,'');
}

function withRoleParticleV2(value,role){
  const w=stripRoleParticleV2(value);
  if(!w)return '';
  if(role==='subject')return w+(hasBatchim(w)?'이':'가');
  if(role==='object')return w+(hasBatchim(w)?'을':'를');
  if(role==='recipient')return w+'에게';
  if(role==='companion')return w+(hasBatchim(w)?'과':'와');
  if(role==='destination')return w+'에';
  if(role==='place')return w+'에서';
  return w;
}

function predicateDisplayV2(predicate){
  const frame=getPredicateFrameV2(predicate);
  return frame?frame.display:String(predicate||'');
}

function previewMeaningSentenceV2(predicate,roles){
  const r=roles||{};
  const p=predicateDisplayV2(predicate);
  const parts=[];
  if(r.time)parts.push(String(r.time));
  if(r.subject)parts.push(withRoleParticleV2(r.subject,'subject'));
  if(r.companion)parts.push(withRoleParticleV2(r.companion,'companion'));
  if(r.destination)parts.push(withRoleParticleV2(r.destination,'destination'));
  if(r.place)parts.push(withRoleParticleV2(r.place,'place'));
  if(r.recipient)parts.push(withRoleParticleV2(r.recipient,'recipient'));
  if(r.object)parts.push(withRoleParticleV2(r.object,'object'));
  if(r.manner)parts.push(String(r.manner));
  if(r.reason)parts.unshift(String(r.reason));
  parts.push(p);
  return parts.filter(Boolean).join(' ').replace(/\s+/g,' ').trim()+'.';
}

function cloneRolesV2(roles){
  return JSON.parse(JSON.stringify(roles||{}));
}

function pushMeaningCandidateV2(list,predicate,roles,reason,confidence){
  const text=previewMeaningSentenceV2(predicate,roles);
  if(!text||list.some(x=>x.text===text))return;
  list.push({
    id:'meaning-'+(list.length+1),
    predicate,
    roles:cloneRolesV2(roles),
    text,
    reason:reason||'가능한 뜻',
    confidence:Number(confidence||.5)
  });
}

function roleConfirmationCandidatesV2(analysis){
  const a=analysis||{};
  const predicate=a.predicate;
  const frame=getPredicateFrameV2(predicate);
  if(!predicate||!frame)return [];
  const base=cloneRolesV2(a.roles);
  const list=[];
  const tokens=(a.tokens||[]).map(stripRoleParticleV2).filter(Boolean);
  const people=tokens.filter(t=>semanticTypesForV2(t).includes('person'));
  const objects=tokens.filter(t=>semanticTypesForV2(t).some(type=>['food','drink','reading','writing','thing','toy','sport','activity','craft','animal','topic'].includes(type)));

  // 현재 분석 결과를 첫 후보로 둔다. 빠진 주어만 있으면 화자 '나'를 임시 후보로 보완한다.
  const current=cloneRolesV2(base);
  if(frame.required.includes('subject')&&!current.subject)current.subject='나';
  const currentMissing=frame.required.filter(role=>!current[role]);
  if(!currentMissing.length){
    pushMeaningCandidateV2(list,predicate,current,'입력한 말의 가장 가까운 뜻',.78);
  }

  // 주다/받다는 행위자와 상대가 뒤바뀌기 쉬우므로 방향을 반드시 확인한다.
  if(predicate==='주다'){
    const person=people[0]||base.recipient||base.subject;
    const thing=base.object||objects[0];
    if(person&&thing){
      pushMeaningCandidateV2(list,'주다',{subject:'나',recipient:person,object:thing},'내가 그 사람에게 준 뜻',.72);
      pushMeaningCandidateV2(list,'주다',{subject:person,recipient:'나',object:thing},'그 사람이 나에게 준 뜻',.72);
    }
  }
  if(predicate==='받다'){
    const person=people[0]||base.recipient||base.subject;
    const thing=base.object||objects[0];
    if(person&&thing){
      pushMeaningCandidateV2(list,'받다',{subject:'나',recipient:person,object:thing},'내가 그 사람에게서 받은 뜻',.72);
      pushMeaningCandidateV2(list,'받다',{subject:person,recipient:'나',object:thing},'그 사람이 나에게서 받은 뜻',.62);
    }
  }

  // 사람 대상 동사는 '내가 그 사람을' / '그 사람이 나를' 두 방향을 확인한다.
  if(['만나다','돕다','좋아하다'].includes(predicate)&&people.length){
    const person=people[0];
    pushMeaningCandidateV2(list,predicate,{...base,subject:'나',object:person},'내가 그 사람에게 한 뜻',.7);
    pushMeaningCandidateV2(list,predicate,{...base,subject:person,object:'나'},'그 사람이 나에게 한 뜻',.62);
  }

  // 장소+감정처럼 동사가 빠진 입력은 사건과 감정을 분리하는 후보를 만든다.
  const emotion=(a.affect&&a.affect[0])?a.affect[0].normalized:(base.emotion||'');
  const place=tokens.find(t=>semanticTypesForV2(t).includes('place'));
  if(emotion&&place&&!list.some(x=>x.roles&&x.roles.destination===place)){
    pushMeaningCandidateV2(list,'가다',{subject:'나',destination:place},'그 장소에 간 사건',.48);
  }

  return list.slice(0,4);
}

function clarificationModelV2(rawInput){
  const analysis=typeof rawInput==='string'?buildMeaningHypothesesV2(rawInput):(rawInput||{});
  const roleCandidates=roleConfirmationCandidatesV2(analysis);
  const lexicalChoices=meaningClarificationChoicesV2(analysis);
  const needsRoleChoice=roleCandidates.length>1;
  return {
    title:needsRoleChoice?'혹시 이런 뜻이에요?':'조금만 더 알려 주세요.',
    instruction:needsRoleChoice?'내가 말하고 싶은 뜻에 가장 가까운 문장을 골라 주세요.':'맞는 뜻을 고르거나 직접 말해 주세요.',
    analysis,
    sentenceCandidates:roleCandidates,
    wordChoices:lexicalChoices,
    allowOther:true,
    otherLabel:'다른 뜻이에요',
    allowTyped:true,
    typedLabel:'내가 직접 말할게요'
  };
}

  };
  storyV2.events.push(event);
  storyV2.expression.selected=candidate.text||previewMeaningSentenceV2(candidate.predicate,candidate.roles);
  storyV2.learningLog.meaningRepairs+=1;
  return event;
}

function confirmRoleValueV2(event,role,value,source='choice'){
  if(!event||!role)return event;
  event[role]=stripRoleParticleV2(value);
  event.confirmedRoles=event.confirmedRoles||{};
  event.confirmedRoles[role]={value:event[role],source};
  return event;
}

function inferredSubjectFromInputV2(event,analysis){
  if(!event||event.subject)return event;
  const tokens=((analysis&&analysis.tokens)||[]).map(stripRoleParticleV2).filter(Boolean);
  const people=tokens.filter(t=>semanticTypesForV2(t).includes('person'));
  if(people.length===0){
    event.subject='나';
    event.confirmedRoles=event.confirmedRoles||{};
    event.confirmedRoles.subject={value:'나',source:'implied-korean-subject'};
  }
  return event;
}

function roleChoicePoolV2(event,role){
  const frame=getPredicateFrameV2(event&&event.predicate);
  const allowed=(frame&&frame.semantic&&frame.semantic[role])||[];
  let words=[];
  if(role==='subject'){
    words=[...SEMANTIC_LEXICON_V2.person,...SEMANTIC_LEXICON_V2.animal];
  }else if(role==='recipient'||role==='companion'){
    words=[...SEMANTIC_LEXICON_V2.person];
  }else if(role==='destination'||role==='place'){
    words=[...SEMANTIC_LEXICON_V2.place];
  }else{
    allowed.forEach(type=>{words.push(...(SEMANTIC_LEXICON_V2[type]||[]))});
    if(!words.length&&role==='object'){
      ['food','drink','reading','writing','thing','toy','sport','activity','craft','animal','topic'].forEach(type=>words.push(...(SEMANTIC_LEXICON_V2[type]||[])));
    }
  }
  return [...new Set(words)].filter(Boolean);
}

function roleQuestionV2(event,role){
  const frame=getPredicateFrameV2(event&&event.predicate);
  if(frame&&frame.questions&&frame.questions[role])return frame.questions[role];
  return (MEANING_ROLES_V2[role]&&MEANING_ROLES_V2[role].label)||'조금 더 알려 주세요.';
}

function renderRequiredRoleOrCoreV2(event,analysis){

  renderCoreSentenceV2(event);
}

function withTopicParticleV2(value){
  const w=stripRoleParticleV2(value);
  if(!w)return '';
  return w+(hasBatchim(w)?'은':'는');
}

function composeEventSentenceV2(event,options={}){
  const e=event||{};
  const parts=[];
  const subjectMode=options.subjectMode||'topic';
  const omitSubject=!!options.omitSubject;
  const frontPlace=!!options.frontPlace;

  if(e.reason)parts.push(String(e.reason));
  if(e.time)parts.push(String(e.time));
  if(frontPlace){
    if(e.destination)parts.push(withRoleParticleV2(e.destination,'destination'));
    if(e.place)parts.push(withRoleParticleV2(e.place,'place'));
  }

  if(e.subject&&!omitSubject){
    parts.push(subjectMode==='focus'?withRoleParticleV2(e.subject,'subject'):withTopicParticleV2(e.subject));
  }

  if(e.companion)parts.push(withRoleParticleV2(e.companion,'companion'));

  if(!frontPlace){
    if(e.destination)parts.push(withRoleParticleV2(e.destination,'destination'));
    if(e.place)parts.push(withRoleParticleV2(e.place,'place'));
  }

  if(e.recipient)parts.push(withRoleParticleV2(e.recipient,'recipient'));
  if(e.object)parts.push(withRoleParticleV2(e.object,'object'));
  if(e.manner)parts.push(String(e.manner));
  parts.push(predicateDisplayV2(e.predicate));

  return parts.filter(Boolean).join(' ').replace(/\s+/g,' ').trim().replace(/[.?!]+$/,'')+'.';
}

function naturalSentenceCandidatesV2(event){
  const list=[];
  const push=(text,label)=>{
    if(!text||list.some(x=>x.text===text))return;
    list.push({text,label});
  };

  push(composeEventSentenceV2(event,{subjectMode:'topic'}),'가장 자연스러운 기본 표현');
  push(composeEventSentenceV2(event,{subjectMode:'focus'}),'누가 했는지 또렷하게 말하는 표현');

  const subject=stripRoleParticleV2(event&&event.subject);
  if(subject==='나'){
    push(composeEventSentenceV2(event,{omitSubject:true}),'주어를 자연스럽게 생략한 표현');
  }else if(event&&(event.place||event.destination)){
    push(composeEventSentenceV2(event,{subjectMode:'topic',frontPlace:true}),'장소를 먼저 말하는 표현');
  }

  return list.slice(0,3);
}

  if(!frame)return [];
  const order=(frame.expansionOrder||frame.optional||[]).filter(role=>!event[role]);
  return order.filter(role=>!frame.required.includes(role));
}

function expansionChoicePoolV2(event,role){

function inheritEventContextV2(previous,next){
  const prev=previous||{},n=next||{};
  if(!n.subject&&prev.subject)n.subject=prev.subject;
  if(!n.place&&prev.place)n.place=prev.place;
  if(!n.destination&&prev.destination&&!n.place)n.place=prev.destination;

function normalizeReflectionTextV2(kind,value){
  let v=String(value||'').trim().replace(/[.?!]+$/,'');

  if(kind==='emotion'){
    if(/(했다|났다|됐다|있었다|없었다|웠다|았다|었다)$/.test(v))return '나는 '+v+'.';
    return '나는 '+v+'고 느꼈다.';
  }
  if(kind==='thought'){
    if(/생각했다$/.test(v))return '나는 '+v+'.';
    return '나는 '+v+'고 생각했다.';
  }
  return v+'.';
}

const SAFE_CORRECTION_RULES_V2=[
  {type:'spelling',from:/버수/g,to:'버스',label:'맞춤법'},
  {type:'spelling',from:/뻐스/g,to:'버스',label:'맞춤법'},
  {type:'spelling',from:/선생임/g,to:'선생님',label:'맞춤법'},
  {type:'spelling',from:/선생닝/g,to:'선생님',label:'맞춤법'},
  {type:'spelling',from:/먹엇/g,to:'먹었',label:'활용'},
  {type:'spelling',from:/마셧/g,to:'마셨',label:'활용'},
  {type:'spelling',from:/읽엇/g,to:'읽었',label:'활용'},
  {type:'spelling',from:/햇/g,to:'했',label:'활용'},
  {type:'spacing',from:/배가고파/g,to:'배가 고파',label:'띄어쓰기'},
  {type:'spacing',from:/목이말라/g,to:'목이 말라',label:'띄어쓰기'},
  {type:'spacing',from:/화가나/g,to:'화가 나',label:'띄어쓰기'}
];

function safeCorrectionV2(text){
  let out=String(text||'').trim();
  const changes=[];
  SAFE_CORRECTION_RULES_V2.forEach(rule=>{
    const before=out;
    out=out.replace(rule.from,rule.to);
    if(out!==before)changes.push({level:'safe',type:rule.type,label:rule.label,before,after:out});
  });
  out=out.replace(/\s+/g,' ').trim();
  if(out && !/[.?!]$/.test(out))out+='.';
  return {text:out,changes};
}

function semanticSuggestionChangesV2(original,polished){
  const safe=safeCorrectionV2(original).text;
  if(!polished||safe===polished)return [];
  return [{
    level:'choice',
    type:'expression',
    label:'표현 다듬기',
    before:safe,
    after:polished,
    reason:'조사·어순·문장 구성을 더 자연스럽게 만든 표현입니다. 뜻이 같은지 확인한 뒤 선택해 주세요.'
  }];
}

function correctionPlanV2(original,polished){
  const safe=safeCorrectionV2(original);
  return {
    original:String(original||''),
    safeText:safe.text,
    safeChanges:safe.changes,
    suggestedChanges:semanticSuggestionChangesV2(original,polished),
    polished:String(polished||'')
  };
}

function originalExpressionV2(){
  return (storyV2.rawInputs||[])
    .map(x=>String((x&&x.text)||'').trim())
    .filter(Boolean)
    .join(' / ');
}

function tokenizeForCompareV2(text){
  return String(text||'')
    .replace(/[.?!]/g,'')
    .split(/\s+/)
    .map(x=>x.trim())
    .filter(Boolean);
}

function diffWordsV2(original,polished){
  const a=tokenizeForCompareV2(original);
  const b=tokenizeForCompareV2(polished);
  const rows=[];
  const max=Math.max(a.length,b.length);
  for(let i=0;i<max;i++){
    const before=a[i]||'';
    const after=b[i]||'';
    rows.push({before,after,changed:before!==after});
  }
  return rows;
}

function renderDiffLineV2(original,polished){
  const rows=diffWordsV2(original,polished);
  if(!rows.length)return '';
  return rows.map(r=>{
    const shown=r.after||r.before;
    if(!shown)return '';
    return r.changed
      ?'<span style="display:inline-block;padding:3px 6px;margin:2px;border-radius:8px;background:#fff2b8"><b>'+escapeHtml(shown)+'</b></span>'
      :'<span style="display:inline-block;padding:3px 4px;margin:2px">'+escapeHtml(shown)+'</span>';
  }).join(' ');
}

function firstCoreSentenceV2(){
  const first=(storyV2.events||[]).find(e=>e&&e.confirmed);
  return first?composeEventSentenceV2(first,{subjectMode:'topic'}):'';
}

function detailedFirstSentenceV2(){
  const first=(storyV2.events||[]).find(e=>e&&e.confirmed);
  if(!first)return '';
  return expandedSentenceV2(first);
}

function confirmedMeaningSummaryV2(){
  const first=(storyV2.events||[]).find(e=>e&&e.confirmed);
  if(!first)return '';
  const frame=getPredicateFrameV2(first.predicate);
  const labels=[];
  if(first.subject)labels.push('누가: '+stripRoleParticleV2(first.subject));
  if(first.object)labels.push('무엇을: '+stripRoleParticleV2(first.object));
  if(first.recipient)labels.push('누구에게: '+stripRoleParticleV2(first.recipient));
  if(first.destination)labels.push('어디에: '+stripRoleParticleV2(first.destination));
  if(first.place)labels.push('어디에서: '+stripRoleParticleV2(first.place));
  if(frame)labels.push('행동: '+predicateDisplayV2(first.predicate));
  return labels.join(' · ');
}

function thoughtGrowthStepsV2(finalText){
  const original=originalExpressionV2();
  const meaning=confirmedMeaningSummaryV2();
  const core=firstCoreSentenceV2();
  const detailed=detailedFirstSentenceV2();
  const story=currentStoryTextV2();
  const finalValue=String(finalText||storyV2.expression.selected||storyV2.expression.corrected||story||'').trim();
  return [
    {icon:'🗣️',title:'처음 말한 것',text:original},
    {icon:'🔎',title:'뜻을 찾아본 것',text:meaning},
    {icon:'🌱',title:'핵심문장',text:core},

    {icon:'🌳',title:'나의 이야기',text:story},
    {icon:'✨',title:'최종 표현',text:finalValue}

}

function renderMeaningClarificationV2(analysis){
  const model=clarificationModelV2(analysis);
  stepText.textContent='뜻 확인';
  bar.style.width='24%';

  let candidates=model.sentenceCandidates||[];
  if(!candidates.length && analysis.status==='meaning-ready'){
    candidates=[{
      id:'meaning-ready-1',
      predicate:analysis.predicate,
      roles:cloneRolesV2(analysis.roles),
      text:previewMeaningSentenceV2(analysis.predicate,analysis.roles),
      reason:'입력한 뜻',
      confidence:analysis.confidence||.8
    }];
  }

  const wordChoices=(model.wordChoices||[]).slice(0,8);
  card.innerHTML=`
    <h1>${escapeHtml(model.title)}</h1>
    <p class="help">${escapeHtml(model.instruction)}</p>
    ${candidates.length?`
      <div class="story-two" style="margin-top:12px">
        ${candidates.map((x,i)=>`
          <button type="button" class="choice meaning-sentence-choice-v2" data-i="${i}" style="display:block;width:100%;margin:8px 0;text-align:left">
            <b>${escapeHtml(x.text)}</b><br>
            <small>${escapeHtml(x.reason||'가능한 뜻')}</small>
          </button>
        `).join('')}
      </div>`:''}
    ${wordChoices.length?`
      <div class="examples-panel" style="margin-top:14px">
        <p class="help" style="margin:0 0 10px">필요한 말을 하나 골라도 돼요.</p>
        <div class="choices">
          ${wordChoices.map((x,i)=>`<button type="button" class="choice meaning-word-choice-v2" data-i="${i}">${escapeHtml(x.label)}</button>`).join('')}
        </div>
      </div>`:''}
    <div class="actions" style="margin-top:18px">
      <button type="button" class="btn" id="meaningOtherV2">다른 뜻이에요</button>
      <button type="button" class="btn next" id="meaningRetryV2">내가 다시 말할게요</button>
    </div>
    <div style="clear:both"></div>
  `;

  card.querySelectorAll('.meaning-sentence-choice-v2').forEach(b=>b.onclick=()=>{
    const chosen=candidates[Number(b.dataset.i)];
    const event=applyMeaningCandidateV2(chosen);
    renderMeaningConfirmedV2(event);
  });

  card.querySelectorAll('.meaning-word-choice-v2').forEach(b=>b.onclick=()=>{
    const chosen=wordChoices[Number(b.dataset.i)];
    if(chosen&&chosen.type==='role'&&chosen.role&&analysis.predicate){
      analysis.roles=analysis.roles||{};
      analysis.roles[chosen.role]=chosen.label;
      const refreshed=buildMeaningHypothesesV2(
        [analysis.roles.subject,analysis.roles.object,analysis.roles.recipient,analysis.roles.destination,analysis.predicate]
          .filter(Boolean).join(' ')
      );
      renderMeaningClarificationV2(refreshed);
      return;
    }
    renderMeaningStartV2();
  });

  card.querySelector('#meaningOtherV2').onclick=()=>{
    storyV2.learningLog.meaningRepairs+=1;
    renderMeaningStartV2();
  };
  card.querySelector('#meaningRetryV2').onclick=renderMeaningStartV2;
}

const STORE_KEY='sentenceTokTokRewardV1';
function normalizeState(raw){
 const x=(raw&&typeof raw==='object')?raw:{};
 return {
  fish:Number.isFinite(Number(x.fish))?Math.max(0,Number(x.fish)):0,
  fed:Number.isFinite(Number(x.fed))?Math.max(0,Number(x.fed)):0,
  sentences:Array.isArray(x.sentences)?x.sentences.filter(v=>v&&typeof v.text==='string'):[],
  treasures:Array.isArray(x.treasures)?x.treasures:[],
  specialPenguins:Array.isArray(x.specialPenguins)?x.specialPenguins:[],
  fishInventory:Array.isArray(x.fishInventory)?x.fishInventory.map(Number).filter(n=>n>=1&&n<=10):[],
  penguinInHabitat:x.penguinInHabitat!==false
 }
}

 state.fishInventory=state.fishInventory.map(Number).filter(n=>n>=1&&n<=10);
 const missing=Math.max(0,(Number(state.fish)||0)-state.fishInventory.length);

function bindFishInventoryDrag(){

 let down=false,startX=0,startScroll=0,moved=false;
 el.addEventListener('pointerdown',e=>{down=true;moved=false;startX=e.clientX;startScroll=el.scrollLeft;el.classList.add('dragging');try{el.setPointerCapture(e.pointerId)}catch(_){}});
 el.addEventListener('pointermove',e=>{if(!down)return;const dx=e.clientX-startX;if(Math.abs(dx)>4)moved=true;el.scrollLeft=startScroll-dx});
 const end=e=>{down=false;el.classList.remove('dragging');try{el.releasePointerCapture(e.pointerId)}catch(_){}};
 el.addEventListener('pointerup',end);el.addEventListener('pointercancel',end);el.addEventListener('pointerleave',e=>{if(down&&e.buttons===0)end(e)});

function normalizeMeaningText(text){
 return String(text||'').toLowerCase().replace(/[\s.,!?'"“”‘’]/g,'').replace(/(은|는|이|가|을|를|에서|에)$/,'');
}
function grantCompletionReward(text,kind='sentence'){
 const normalized=normalizeMeaningText(text);
 const existing=state.sentences.find(x=>normalizeMeaningText(x.text)===normalized);
 if(existing)return {duplicate:true,fish:0,reward:null,rewardType:null};
 state.sentences.push({text,kind,at:new Date().toISOString()});state.fish+=1;
 let reward=null,rewardType=null,roll=Math.random();
 if(roll<.18){let locked=treasurePool.filter(x=>!state.treasures.includes(x));if(locked.length){reward=locked[Math.floor(Math.random()*locked.length)];rewardType='treasure';state.treasures.push(reward)}}
 else if(roll<.23){let locked=specialPool.filter(x=>!state.specialPenguins.includes(x));if(locked.length){reward=locked[Math.floor(Math.random()*locked.length)];rewardType='penguin';state.specialPenguins.push(reward)}}
 saveState();return {duplicate:false,fish:1,reward,rewardType}
}
function rewardSentence(sentence){return grantCompletionReward(sentence,'sentence')}

 return s
}

 if(/기분|뿌듯|마음/.test(last)){result=['그 뒤에 다음 할 일을 시작했어요.','그리고 오늘 있었던 일을 떠올려 보았어요.'];thought=['나는 왜 그런 기분이 들었는지 생각해 보았어요.','다음에도 이렇게 해 보고 싶다고 생각했어요.'];feeling=[]}
 if(/생각/.test(last)){result=['그 뒤에 생각한 대로 해 보기로 했어요.','그리고 다음 할 일을 시작했어요.'];thought=[];feeling=['생각을 정리하니 마음이 편해졌어요.','앞으로 잘할 수 있을 것 같아 기분이 좋았어요.']}
 if(/마쳤|끝냈|정리했/.test(last)){result=['그리고 집이나 다음 장소로 이동했어요.'];thought=['나는 오늘 한 일을 잘 마쳤다고 생각했어요.'];feeling=['해야 할 일을 끝내서 뿌듯했어요.']}
 const used=new Set((storyDraft||[]).map(v=>v.replace(/^(그래서|그리고|그 뒤에|그러자)\s*/,'').trim()));
 const clean=list=>validStoryChoices(list.filter(v=>!used.has(v.replace(/^(그래서|그리고|그 뒤에|그러자)\s*/,'').trim())));

}
function contextualQuestions(){
 const last=(storyDraft&&storyDraft.length)?storyDraft[storyDraft.length-1]:'';
 const p=ans.predicate||'',rawObject=ans.object||'',o=rawObject?stripParticle(rawObject):'';
 const hasObject=!!rawObject,hasPlace=!!ans.place,hasSubject=!!ans.subject,hasReason=!!ans.reason;
 let result='그 다음에는 어떻게 되었어요?',thought='그 일에 대해 어떤 생각을 했어요?',feeling='그때 어떤 기분이 들었어요?';

 // 구체적인 정보가 실제로 선택되었을 때만 그 정보를 질문에 사용한다.
 if(hasObject&&(/샀어요|골랐어요/.test(last)||(/샀어요|골랐어요/.test(p)&&storyDraft.length===1)))result=o+'을(를) 고른 다음에는 무엇을 했어요?';
 else if(!hasObject&&/샀어요|골랐어요/.test(p))result='그 다음에는 무엇을 했어요?';

 if(/먹었어요|마셨어요|든든/.test(last))result='그 다음에는 어떻게 되었어요?';
 if(hasSubject&&(/주었어요|건넸어요|돌려주었어요/.test(last)||/주었어요|건넸어요|돌려주었어요/.test(p)))result='그 사람은 어떻게 반응했어요?';
 else if(/주었어요|건넸어요|돌려주었어요/.test(last)||/주었어요|건넸어요|돌려주었어요/.test(p))result='그 다음에는 어떻게 되었어요?';
 if(hasObject&&(/숙제/.test(o)||/해야 할 일|끝냈어요|마쳤어요/.test(last)))result='그 일을 끝낸 다음에는 무엇을 했어요?';
 if(hasObject&&(/찾았어요/.test(last)||/찾았어요/.test(p)))result='찾은 다음에는 그것을 어떻게 했어요?';
 else if(!hasObject&&(/찾았어요/.test(last)||/찾았어요/.test(p)))result='찾은 다음에는 무엇을 했어요?';

 if(/기분|뿌듯|마음/.test(last)){thought=hasReason?'왜 그런 기분이 들었다고 생각해요?':'그 기분에 대해 어떤 생각을 했어요?';feeling='그 기분은 계속되었나요?'}
 if(/생각/.test(last)){result='그렇게 생각한 뒤에는 무엇을 했어요?';thought='다음에는 어떻게 하고 싶어요?'}

 // 장소·주어·이유가 없으면 후속 질문이 이를 새 사실처럼 전제하지 않는다.
 if(!hasPlace)thought=thought.replace(/그곳에서[^?]*\?/g,'그 일에 대해 어떤 생각을 했어요?');
 if(!hasSubject)result=result.replace(/친구|상대방|그 사람/g,'그 다음');
 if(!hasReason)thought=thought.replace(/^왜 /,'');
 return {result,thought,feeling}
}

function coherentNext(kind,text){
 const prev=(storyDraft&&storyDraft.length)?storyDraft[storyDraft.length-1]:'';
 let t=text.trim();
 if(kind==='result'&&!/^(그래서|그리고|그 뒤에|그러자|하지만|그런데)/.test(t)){
   t=(/했어요|샀어요|먹었어요|마셨어요|주었어요|끝냈어요/.test(prev)?'그 뒤에 ':'그리고 ')+t;
 }
 if(kind==='thought'&&!/^(그래서|그리고|그 뒤에|그러자|하지만|그런데)/.test(t)&&storyDraft.length>1)t='그리고 '+t;
 if(kind==='feeling'&&!/^(그래서|그리고|그 뒤에|그러자|하지만|그런데)/.test(t))t='그래서 '+t;
 return t.replace(/그래서 그래서/g,'그래서').replace(/그리고 그리고/g,'그리고').replace(/그 뒤에 그 뒤에/g,'그 뒤에')
}

function polishStory(lines){
 let out=(lines||[]).map((v,i)=>{
  let s=String(v||'').trim().replace(/\s+/g,' ');
  s=s.replace(/에서에서/g,'에서').replace(/은은|는는/g,m=>m[0]).replace(/을을|를를/g,m=>m[0]);
  // 첫 문장에서 주어가 이미 분명하면 뒤 문장의 반복되는 '나는'은 생략한다.
  if(i>0&&/^나는\s+/.test(s))s=s.replace(/^나는\s+/,'');
  // 연결어가 중복된 경우 하나만 남긴다.
  s=s.replace(/^(그래서|그리고|그 뒤에|그러자)\s+\1\s+/,'$1 ');
  // 문장부호는 하나로 정리한다.
  s=s.replace(/[.?!]+$/,'')+'.';
  return s;
 }).filter(Boolean);
 // 같은 의미의 문장이 연속되는 경우 뒤 문장을 제거한다.
 out=out.filter((v,i,a)=>i===0||normalizeMeaningText(v)!==normalizeMeaningText(a[i-1]));
 return out
}

function commitSentence(sentence){
 const text=String(sentence||'').trim();
 if(!text)return {ok:false,error:'empty'};
 // 핵심 완료 처리: 다른 기능에 의존하지 않는다.
 if(!state||typeof state!=='object')state={};
 if(!Array.isArray(state.sentences))state.sentences=[];
 if(!Array.isArray(state.fishInventory))state.fishInventory=[];
 if(!Array.isArray(state.treasures))state.treasures=[];
 if(!Array.isArray(state.specialPenguins))state.specialPenguins=[];
 const key=text.replace(/\s+/g,'').replace(/[.?!]/g,'');
 const duplicate=state.sentences.some(x=>x&&typeof x.text==='string'&&x.text.replace(/\s+/g,'').replace(/[.?!]/g,'')===key);
 if(duplicate)return {ok:true,duplicate:true,fish:0,persisted:true};
 let grade=1;try{grade=drawFishGrade()}catch(_){}
 state.sentences.push({text,kind:'sentence',at:new Date().toISOString()});
 state.fishInventory.push(grade);
 state.fish=state.fishInventory.length;
 let persisted=false;
 try{localStorage.setItem(STORE_KEY,JSON.stringify(state));persisted=true}catch(_){}
 return {ok:true,duplicate:false,fish:1,fishGrade:grade,persisted}
}
