<style>:root{--sky:#dff4ff;--grass:#eaf5cf;--cream:#fffdf4;--ink:#27404a;--muted:#6d7c78;--green:#54b89c;--green2:#dff5e8;--yellow:#ffca58;--pink:#ffdce3;--line:#e6dfc8}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif;color:var(--ink);background:linear-gradient(#dff4ff 0 42%,#f5f1c9 72%,#e6f4c9)}button,input{font:inherit}.app{max-width:1000px;margin:auto;min-height:100vh;padding:22px}.brand{font-weight:950;font-size:24px}.top{display:flex;align-items:center;gap:15px}.progress{height:12px;flex:1;background:#fff9;border-radius:20px;overflow:hidden}.bar{height:100%;background:var(--green);width:0}.card{margin-top:18px;background:#fffdf4f2;border:2px solid #fff;border-radius:30px;padding:28px;box-shadow:0 12px 36px #577d6b22}.hero{min-height:78vh;display:grid;place-items:center;text-align:center}.logo{font-size:46px;font-weight:1000;line-height:1.05;color:#32715e;text-shadow:0 3px #fff}.hedgehog{width:170px;height:170px;margin:16px auto;position:relative}.spines{position:absolute;inset:5px;border-radius:50%;background:#8b654d;box-shadow:0 0 0 13px #9d7659;z-index:1}.face{position:absolute;left:28px;top:35px;width:118px;height:112px;border-radius:50% 50% 45% 45%;background:#f7d7aa;z-index:2;box-shadow:inset 0 -7px 0 #efc894}.eye{position:absolute;top:43px;width:13px;height:17px;background:#2d2825;border-radius:50%}.eye.l{left:32px}.eye.r{right:32px}.nose{position:absolute;top:65px;left:52px;width:14px;height:12px;background:#372b29;border-radius:50%}.cheek{position:absolute;top:66px;width:18px;height:10px;background:#f3a8a1aa;border-radius:50%}.cheek.l{left:18px}.cheek.r{right:18px}.face:after{content:"⌣";position:absolute;left:49px;top:69px;font-size:24px;font-weight:900;color:#6c4938}.speech{max-width:560px;margin:12px auto;background:white;border-radius:24px;padding:17px 22px;font-size:20px;font-weight:800}.menu{display:grid;gap:12px;max-width:520px;margin:18px auto}.btn{border:0;border-radius:18px;padding:16px 22px;f <body><div class="app"><div id="top" class="top" style="display:none"><div class="brand">🌱 생각을 문장으로</div><div class="progress"><div id="bar" class="bar"></div></div></div><main id="main"><section class="hero"><div class="hedgehog" role="img" aria-label="생각을 도와주는 고슴도치"><div class="spines"></div><div class="face"><i class="eye l"></i><i class="eye r"></i><i class="nose"></i><i class="cheek l"></i><i class="cheek r"></i></div></div><div class="logo">생각을<br>문장으로</div><div class="speech">안녕! 오늘은 어떤 생각을 찾아볼까?<br>한 단어에서 시작해도 괜찮아.</div><div class="menu"><button class="btn primary" id="startBtn">📖 이야기 만들기</button><button class="btn secondary" id="storyBtn">📚 나의 이야기장</button></div></section></main></div>

 eventSeed:{q:"가장 먼저 떠오르는 말은 뭐야?",h:"사람, 물건, 장소, 행동 무엇이든 괜찮아.",c:["학교","친구","선생님","시험","준비물","게임","운동","급식","학원","가족","버스","숙제","발표","쉬는 시간","점심시간","집"],slot:"topic"},

terestNextDetail.q=t+"에 대해 무엇을 더 알고 싶어?";if(state.node==="thought"){var e=state.facts.event||"",r=state.facts.result||"",em=state.facts.emotion||"";if(/실수했다|잊어버렸다|없어서 곤란했다|문제가 생겼다|원하는 대로 되지 않았다/.test(e)){nodes.thought.q="다음에는 무엇을 다르게 해보고 싶어?";nodes.thought.h="같은 일이 생겼을 때 바꾸고 싶은 행동을 생각해 보자.";nodes.thought.c=["미리 준비하고 싶다","한 번 더 확인하고 싶다","천천히 하고 싶다","도움을 요청하고 싶다","다른 방법을 써보고 싶다","다시 해보고 싶다","직접 말하기"]}else if(/칭찬|잘했다|혼자 해냈다/.test(e)||/기뻤다|뿌듯했다/.test(em)){nodes.thought.q="다음에도 해보고 싶은 것이 있어?";nodes.thought.h="좋았던 경험을 다음 행동으로 이어 보자.";nodes.thought.c=["다음에도 해보고 싶다","더 잘해보고 싶다","친구와 함께하고 싶다","다른 것도 해보고 싶다","계속 연습하고 싶다","직접 말하기"]}else if(/친구|가족|엄마|아빠|선생님/.test(t)){nodes.thought.q="다음에 함께하고 싶은 것이 있어?";nodes.thought.h="그 사람과 다음에 하고 싶은 일을 생각해 보자.";nodes.thought.c=["또 놀고 싶다","같이 이야기하고 싶다","같이 먹고 싶다","함께 다른 것을 해보고 싶다","도와주고 싶다","직접 말하기"]}else{nodes.thought.q="다음에는 어떻게 하고 싶어?";nodes.thought.h="다음에 내가 하고 싶은 행동을 한 가지 생각해 보자.";nodes.thought.c=["다시 해보고 싶다","더 잘해보고 싶다","다른 방법을 써보고 싶다","도움을 받고 싶다","천천히 해보고 싶다","직접 말하기"]}}}
function needsActionObject(v){v=noPeriod(v);return /(?:먹었어|먹었다|마셨어|마셨다)$/.test(v)}
function actionObjectQuestion(v){v=noPeriod(v);if(/먹/.test(v)){nodes.actionObject.q="무엇을 먹었어?";nodes.actionObject.h="먹은 것을 한 가지만 말해 보자.";nodes.actionObject.c=["점심","밥","간식","빵","과자","과일","직접 말하기"]}else if(/마셨/.test(v)){nodes.actionObject.q="무엇을 마셨어?";nodes.actionObject.h="마신 것을 한 가지만 말해 보자.";nodes.actionObject.c=["물","우유","주스","음료","직접 말하기"]}}

function hasSpecificMeaning(f){return !!(f.specific||f.actionDetail||f.nextDetail)}
function configureSpecificQuestion(t){var k=topicKind(t);if(t==="게임"){nodes.interestSpecific.q="어떤 게임을 주로 해?";nodes.interestSpecific.h="자주 하는 게임의 이름이나 종류를 말해 보자.";nodes.interestSpecific.c=["모바일 게임","컴퓨터 게임","콘솔 게임","보드게임","직접 말하기"]}else if(k==="reading"){nodes.interestSpecific.q="어떤 "+t+"을 좋아해?";nodes.interestSpecific.h="좋아하는 "+t+"의 이름이나 종류를 말해 보자.";nodes.interestSpecific.c=["동화책","만화책","과학책","역사책","이야기책","직접 말하기"]}else if(t==="운동"){nodes.interestSpecific.q="어떤 운동을 주로 해?";nodes.interestSpecific.h="좋아하거나 자주 하는 운동을 말해 보자.";nodes.interestSpecific.c=["축구","농구","수영","달리기","자전거","직접 말하기"]}else{nodes.interestSpecific.q=t+" 중에서 특히 어떤 것을 좋아해?";nodes.interestSpecific.h="이름이나 종류를 한 가지 말해 보자.";nodes.interestSpecific.c=["직접 말하기"]}}
function nextMeaningQuestion(node,value){var f=state.facts,t=noPeriod(f.topic);if(state.mode==="interest"){if(node==="interestWhy"&&isGenericTopic(t)&&!hasSpecificMeaning(f)){configureSpecificQuestion(t);return "interestSpecific"}if(node==="interestReasonDetail"&&isGenericTopic(t)&&!hasSpecificMeaning(f)){configureSpecificQuestion(t);return "interestSpecific"}if(node==="interestSpecific")return "interestThought"}return null}
function needsActorDetail(v){v=noPeriod(v);return /친구|가족|엄마|아빠|선생님/.test(v)&&!/잃어버|다쳤|속상|울었|아팠|화가|칭찬|도와|싸웠|다퉜/.test(v)}
function normalizeChildClause(v){v=noPeriod(v);return v.replace(/했대$/,"했다").replace(/했어$/,"했다").replace(/였어$/,"였다").replace(/없어$/,"없었다").replace(/잃어버렸대$/,"잃어버렸다")}
function emotionEventStory(f){var e=normalizeChildClause(f.eventActorDetail||f.event),em=noPeriod(f.emotion);if(!e)return em?sentence("나는 "+em):"";var other=/^(친구|엄마|아빠|가족|선생님)/.test(e);if(other&&em)return sentence(e+" 그래서 나도 "+em);if(em)return sentence(e+" 그래서 "+em);return sentence(e)}
function exampleSentences(n){var f=state.facts,t=noPeriod(f.topic),out=[];if(state.mode==="emotion"){var e=normalizeChildClause(f.eventActorDetail||f.event),em=noPeriod(f.emotion);if(e&&em){out.push(sentence(e+" 그래서 나도 "+em));out.push(sentence(e+" 나도 그 이야기를 듣고 "+em));}else if(em){out.push(sentence("나는 "+em));}}else if(state.mode==="event"||state.mode==="free"){var fr=semanticFrame(f),ev=eventNarrative(fr);if(ev)out.push(ev);if(ev&&fr.emotion)out.push(sentence(noPeriod(ev)+" 그때 "+fr.emotion));}else if(state.mode==="interest"){if(t)out.push(sentence("나는 "+particle(t,"을","를")+" 좋아한다"));if(t&&f.reason)out.push(sentence(particle(t,"이","가")+" "+noPeriod(f.reason).replace(/서$/,"")+"어서 좋아한다"));}return [...new Set(out.filter(Boolean))].slice(0,3)}

function missingNode(){
 const f=state.facts;

 if(state.mode==="event"||state.mode==="free"){
  if(f.event&&!f.result&&!f.cause&&!f.eventActorDetail)return "addResult";
  if(f.emotion&&!f.emotionReason&&f.result)return "addReason";
  if(!f.thought&&!f.next)return "addThought";
 }

 if(state.mode==="interest"&&!f.next)return "interestThought";

}

function hintPrompt(n){var s=n.slot,t=state.facts.topic||"그것";if(s==="topic")return "사람, 장소, 물건, 활동 중에서 하나를 떠올려 봐.";if(s==="event")return t+"에 대해 ‘무슨 일이 있었지?’라고 생각해 봐.";if(s==="eventDetail")return "‘무엇을?’, ‘어떤 것을?’, ‘무슨 일로?’라고 한 번 더 생각해 봐.";if(s==="result")return "그 일이 생긴 뒤 무엇이 달라졌는지 생각해 봐.";if(s==="emotion")return "그때 내 몸과 마음이 어땠는지 떠올려 봐.";if(s==="emotionReason"||s==="reason"||s==="cause")return "‘왜?’라고 한 번만 더 물어봐.";if(s==="thought")return "그 일을 겪고 머릿속에 든 말을 떠올려 봐.";if(s==="next")return "다음에 내가 해볼 수 있는 일을 생각해 봐.";if(s==="question")return t+"에 대해 ‘왜? 어떻게? 어디서? 무엇을?’ 중 하나를 골라 생각해 봐.";if(s==="known")return "이미 알고 있는 아주 작은 사실 하나만 떠올려 봐.";if(s==="specific")return t+" 중에서 내가 실제로 좋아하거나 자주 하는 것을 떠올려 봐.";if(s==="action")return t+"을 할 때 내가 실제로 하는 행동을 떠올려 봐.";if(s==="reasonDetail")return "‘어떤 점이?’라고 한 번 더 생각해 봐.";if(s==="actionDetail")return "내가 자주 보는 내용 하나를 떠올려 봐.";if(s==="nextDetail")return "가장 궁금한 것 하나만 골라 봐.";return "질문의 중요한 말을 다시 보고 한 단어만 떠올려 봐."}

  if(specific)a.push(specific);else if(reason)a.push(reason);
  var next=naturalInterestNext(t,f.next||f.thought,f.nextDetail,f.action,f.actionDetail);
  var action=naturalInterestAction(t,f.action,f.actionDetail);
  if(action&&!(next&&/유튜브|책을 보고/.test(next)))a.push(action);
  if(next)a.push(next);
  return [...new Set(a.filter(Boolean))].slice(0,4)
 }
 return makeEventStory(f)
}
function storyTitle(){const f=state.facts,t=trimEnd(f.topic);if(state.mode==="curiosity")return t? t+"에 대한 나의 궁금증":"내가 궁금한 것";if(state.mode==="interest")return t? "내가 좋아하는 "+t:"내가 좋아하는 것";if(t&&/^(친구|엄마|아빠|가족|선생님|형|누나|언니|동생)$/.test(t))return t+"와 있었던 일";if(t)return t+"에 있었던 일";return "나의 이야기"}
function stopSpeech(){if("speechSynthesis" in window)window.speechSynthesis.cancel()}

function toggleLine(i){state.checked[i]=!state.checked[i];reviewStory()}
function speakSelected(){var lines=state.draft.filter(function(x,i){return state.checked[i]});if(lines.length)speakText(lines.join(" "))}
function editLine(i){var box=document.querySelector("#line"+i);box.innerHTML='<div class="reviewtext">어떻게 바꾸고 싶어?</div><input class="editbox" id="edit'+i+'"><div class="help" style="margin-top:8px">문장을 고친 뒤 아래 버튼을 눌러야 수정이 완료돼.</div><div class="reviewactions"><button class="smallbtn" onclick="saveEdit('+i+')">✓ 이 문장으로 확인</button><button class="smallbtn" onclick="reviewStory()">취소</button></div>';var input=document.querySelector("#edit"+i);input.value=state.draft[i];input.focus();input.addEventListener("keydown",function(e){if(e.key==="Enter")saveEdit(i)})}
function saveEdit(i){var input=document.querySelector("#edit"+i),v=input.value.trim();if(!v)return;state.draft[i]=/[.!?]$/.test(v)?v:v+".";state.checked[i]=true;reviewStory()}
