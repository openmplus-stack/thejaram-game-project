<body><div class="app"><div id="top" class="top" style="display:none"><div class="brand">🌱 생각을 문장으로</div><div class="progress"><div id="bar" class="bar"></div></div></div><main id="main"><section class="hero"><div class="hedgehog" role="img" aria-label="생각을 도와주는 고슴도치"><div class="spines"></div><div class="face"><i class="eye l"></i><i class="eye r"></i><i class="nose"></i><i class="cheek l"></i><i class="cheek r"></i></div></div><div class="logo">생각을<br>문장으로</div><div class="speech">안녕! 오늘은 어떤 생각을 찾아볼까?<br>한 단어에서 시작해도 괜찮아.</div><div class="menu"><button class="btn primary" id="startBtn">📖 이야기 만들기</button><button class="btn secondary" id="storyBtn">📚 나의 이야기장</button></div></section></main></div>

 "공룡":["공룡은 왜 사라졌을까?","공룡은 무엇을 먹었을까?","공룡은 어디에서 살았을까?","어떤 공룡이 가장 컸을까?","공룡마다 무엇이 달랐을까?","공룡은 어떻게 움직였을까?","공룡의 화석은 어떻게 만들어질까?","공룡에 대해 더 알고 싶은 것은 무엇일까?"],

 "우주":["우주는 얼마나 클까?","별은 왜 빛날까?","달은 왜 모양이 달라질까?","행성은 어떻게 움직일까?","우주에는 무엇이 있을까?","사람은 어떻게 우주에 갈까?","지구와 다른 행성은 무엇이 다를까?","우주에서 가장 궁금한 것은 무엇일까?"],
 "동물":["어디에서 살까?","무엇을 먹을까?","어떻게 움직일까?","몸은 어떻게 생겼을까?","새끼는 어떻게 자랄까?","다른 동물과 무엇이 다를까?","어떻게 자신을 지킬까?","가장 궁금한 동물은 무엇일까?"],
 "로봇":["로봇은 어떻게 움직일까?","로봇은 어떤 일을 할까?","사람과 로봇은 무엇이 다를까?","로봇은 어떻게 명령을 알아들을까?","어떤 로봇을 만들고 싶을까?","로봇은 어디에서 사용될까?","로봇에게 무엇을 시키고 싶을까?","앞으로 로봇은 어떻게 달라질까?"]
};
function topicCategory(t){t=String(t||"");if(/친구|엄마|아빠|가족|선생님|형|누나|언니|동생|사람/.test(t))return "person";if(/자동차|차|버스|기차|비행기|배|자전거|탈것/.test(t))return "vehicle";if(/공룡|동물|고양이|강아지|개|새|곤충|나비|물고기/.test(t))return "animal";if(/우주|과학|별|달|해|바다|날씨|식물|나무|꽃|자연/.test(t))return "science";if(/게임|운동|축구|그림|음악|춤|요리|만들기|사진|책/.test(t))return "activity";return "general"}
function semanticQuestions(t){t=trimEnd(t);if(TOPIC_QUESTIONS[t])return TOPIC_QUESTIONS[t];const cat=topicCategory(t),p=particle(t,"은","는"),g=particle(t,"이","가");const sets={
 person:[p+" 어떤 사람일까?",p+" 무엇을 좋아할까?",p+" 무엇을 잘할까?",g+" 한 말 중 기억나는 것은 무엇일까?",p+" 나와 무엇을 함께했을까?",p+" 어떤 기분이었을까?",p+" 나와 무엇이 비슷할까?",p+" 나와 무엇이 다를까?"],
 vehicle:[p+" 어떻게 움직일까?",p+" 어디에 사용될까?",p+" 안에 무엇이 있을까?",p+" 왜 필요할까?",p+" 다른 탈것과 무엇이 다를까?",p+" 어떻게 멈출까?",p+" 누가 사용할까?",p+" 어떤 점이 가장 궁금할까?"],
 animal:[p+" 어디에서 살까?",p+" 무엇을 먹을까?",p+" 어떻게 움직일까?",p+" 몸은 어떻게 생겼을까?",p+" 어떻게 자랄까?",p+" 다른 동물과 무엇이 다를까?",p+" 어떻게 자신을 지킬까?",p+" 어떤 점이 가장 궁금할까?"],
 science:[p+" 어떻게 생길까?",p+" 왜 그럴까?",p+" 어디에서 볼 수 있을까?",p+" 어떻게 변할까?",p+" 무엇과 관련이 있을까?",p+" 다른 것과 무엇이 다를까?",p+" 우리 생활과 어떤 관계가 있을까?",p+" 어떤 점이 가장 궁금할까?"],
 activity:[p+" 할 때 무엇을 할까?",p+" 어떤 점이 재미있을까?",p+" 잘하려면 무엇이 필요할까?",p+" 누구와 함께할 수 있을까?",p+" 어디에서 할 수 있을까?",p+" 어려운 점은 무엇일까?",p+" 더 잘하고 싶은 것은 무엇일까?",p+" 새롭게 해보고 싶은 것은 무엇일까?"],
 general:[p+" 어떤 특징이 있을까?",p+" 무엇을 할 때 필요할까?",p+" 어디에서 볼 수 있을까?",p+" 왜 중요할까?",p+" 무엇과 관련이 있을까?",p+" 다른 것과 무엇이 다를까?",p+" 내가 알고 있는 것은 무엇일까?",p+" 더 알고 싶은 것은 무엇일까?"]};return sets[cat]}
function applySemanticNode(){if(state.node!=="curiosityFocus")return;const t=state.facts.topic;if(!t)return;nodes.curiosityFocus.q=t+"에 대해 무엇이 가장 궁금해?";nodes.curiosityFocus.h="내가 궁금한 방향을 하나 골라 더 깊게 생각해 보자.";nodes.curiosityFocus.c=semanticQuestions(t)}
function nextNode(node,value){
 if(node==="eventSeed"||node==="freeSeed") return "event";
 if(node==="emotionSeed") return "emotionEvent";
 if(node==="emotionEvent") return "emotionCause";
 if(node==="event"){if(/실수|잊|없어서|바뀌/.test(value))return "problemResult";if(/잘했다|도움을 받았다|함께/.test(value))return "positiveDetail";return "neutralResult"}
 if(["problemResult","positiveDetail","neutralResult"].includes(node))return "emotion";
 if(node==="emotion")return "emotionCause";
 if(node==="emotionCause")return "thought";
 if(node==="thought")return "next";
 if(node==="curiositySeed")return "curiosityFocus";
 if(node==="curiosityFocus")return "curiosityWhy";
 if(node==="curiosityWhy")return "curiosityKnow";
 if(node==="curiosityKnow")return "curiosityNext";
 if(node==="interestSeed")return "interestWhy";
 if(node==="interestWhy")return "interestDetail";
 if(node==="interestDetail")return "interestThought";
 return "finish";
}
function missingNode(){
 const f=state.facts;
 if(state.mode==="event"||state.mode==="free"||state.mode==="emotion"){
  if(f.event&&!f.result&&!f.cause)return "addResult";
  if(f.emotion&&!f.emotionReason)return "addReason";
  if(!f.thought)return "addThought";
  if(!f.next)return "addNext";
 }
 if(state.mode==="curiosity"&&!f.next)return "curiosityNext";
 if(state.mode==="interest"&&!f.next)return "interestThought";
 return null
}
function reviewThoughts(){const m=missingNode();if(!m){finish();return}state.node=m;bar.style.width="88%";render()}
function thoughtMap(){if(!state.answers.length)return "";return '<div class="thoughts"><b>🌱 지금까지 찾은 생각</b><div class="map">'+state.answers.map((a,i)=>'<span class="thought">'+esc(a.value)+'</span>'+(i<state.answers.length-1?'<span class="arrow">→</span>':"")).join("")+'</div></div>'}
function render(){applySemanticNode();const n=nodes[state.node];bar.style.width=Math.min(92,15+state.answers.length*13)+"%";const opts=n.c.filter(x=>x!=="직접 말하기");main.innerHTML='<section class="card"><div class="mascot-row"><div class="mini">'+H+'</div><div><div class="question">'+esc(n.q)+'</div><div class="help">먼저 내 생각을 직접 써 보자.</div></div></div><div class="tryfirst"><div class="trytitle">✏️ 내 생각 먼저 쓰기</div><div class="help" style="margin:0">한 단어나 짧은 말도 괜찮아.</div><div class="inputrow"><input id="custom" placeholder="여기에 내 생각을 써 봐"><button class="btn secondary" id="customBtn">말 더하기</button></div></div><div class="examples">💡 잘 모르겠으면 아래 예시를 참고해 봐</div><div class="choices">'+opts.map((x,i)=>'<button class="choice" data-i="'+i+'">'+esc(x)+'</button>').join("")+'</div>'+thoughtMap()+'<div class="nav"><button class="btn ghost" onclick="back()">← 이전</button><button class="btn ghost" onclick="skip()">잘 모르겠어</button></div></section>';document.querySelectorAll(".choice").forEach(b=>b.onclick=()=>choose(opts[+b.dataset.i]));document.querySelector("#customBtn").onclick=customAnswer}
function choose(v){if(v==="직접 말하기"){document.querySelector("#custom").focus();return}save(v)}
function customAnswer(){const v=document.querySelector("#custom").value.trim();if(v)save(v)}
function save(v){const n=nodes[state.node];state.answers.push({node:state.node,slot:n.slot,value:v});state.facts[n.slot]=v;const nx=nextNode(state.node,v);if(nx==="review")reviewThoughts();else if(nx==="finish")finish();else{state.node=nx;render()}}
function skip(){const nx=nextNode(state.node,"");if(nx==="review")reviewThoughts();else if(nx==="finish")finish();else{state.node=nx;render()}}
function back(){if(!state.answers.length){startMenu();return}const last=state.answers.pop();delete state.facts[last.slot];state.node=last.node;render()}
function trimEnd(v){return String(v||"").trim().replace(/[.!?]+$/,"")}
function hasBatchim(word){const s=trimEnd(word),ch=s.charCodeAt(s.length-1);return ch>=0xAC00&&ch<=0xD7A3&&((ch-0xAC00)%28)!==0}
function particle(word,batchim,noBatchim){return trimEnd(word)+(hasBatchim(word)?batchim:noBatchim)}
function endDa(v){v=trimEnd(v);if(!v)return "";if(/(다|겠다|했다|됐다|였다|이었다|있었다|없었다)$/.test(v))return v+".";if(/고 싶어$/.test(v))return v.replace(/고 싶어$/,"고 싶다.");if(/궁금해$/.test(v))return v.replace(/궁금해$/,"궁금하다.");return v+"."}
function reasonText(v){v=trimEnd(v);const map={"재미있어서":"재미있기 때문이다","멋있어서":"멋있기 때문이다","귀여워서":"귀엽기 때문이다","신기해서":"신기하기 때문이다","편안해서":"편안하기 때문이다","잘할 수 있어서":"잘할 수 있기 때문이다","새로운 것을 알 수 있어서":"새로운 것을 알 수 있기 때문이다","책에서 봐서":"책에서 보았기 때문이다","영상에서 봐서":"영상에서 보았기 때문이다","직접 봐서":"직접 보았기 때문이다","수업에서 배워서":"수업에서 배웠기 때문이다","친구가 말해서":"친구가 말해 주었기 때문이다","좋아해서":"좋아하기 때문이다","잘 몰라서":"잘 모르기 때문이다"};return map[v]||(/서$/.test(v)?v.replace(/서$/,"기 때문이다"):v)}
function curiositySentence(t,q){q=trimEnd(q);if(/[?？]$/.test(q))q=q.replace(/[?？]+$/,"");if(q.startsWith(t))return q.replace(/을까$/,"는지").replace(/할까$/,"하는지").replace(/일까$/,"인지").replace(/까$/,"지")+" 궁금하다.";const special={"왜 그런지":"왜 그런지","어떻게 하는지":"어떻게 하는지","어디에 있는지":"어디에 있는지","무엇을 먹는지":"무엇을 먹는지","어떻게 생겼는지":"어떻게 생겼는지","언제 생겼는지":"언제 생겼는지","다른 것과 무엇이 다른지":"다른 것과 무엇이 다른지"};return particle(t,"이","가")+" "+(special[q]||q)+" 궁금하다."}
function noPeriod(v){return trimEnd(v)}
function joinCauseEmotion(emotion,reason){const e=noPeriod(emotion),r=reasonText(reason);if(!e)return "";if(!reason)return "그때 "+endDa(e);return "그때 "+e+". 그 이유는 "+r+"."}
function makeStory(){const f=state.facts,t=trimEnd(f.topic),a=[];
 if(state.mode==="curiosity"){
  if(t&&f.question)a.push(curiositySentence(t,f.question));else if(t)a.push("나는 "+t+"에 대해 궁금하다.");
  if(f.cause)a.push("이것이 궁금해진 이유는 "+reasonText(f.cause)+".");
  if(f.known&&f.known!=="거의 모른다")a.push("내가 지금 알고 있는 것은 "+endDa(f.known));
  else if(f.known==="거의 모른다")a.push("아직 이것에 대해서는 잘 모른다.");
  if(f.next)a.push("그래서 앞으로 "+endDa(f.next));
 }else if(state.mode==="interest"){
  if(t)a.push("나는 "+particle(t,"을","를")+" 좋아한다.");
  if(f.reason)a.push("특히 좋아하는 이유는 "+reasonText(f.reason)+".");
  if(f.action)a.push("그래서 평소에 "+endDa(f.action));
  if(f.next)a.push("앞으로는 "+endDa(f.next));
 }else{
  if(t&&f.event)a.push(particle(t,"과","와")+" 관련해 "+endDa(f.event));else if(f.event)a.push(endDa(f.event));
  if(f.result)a.push("그래서 "+endDa(f.result));else if(f.cause)a.push("그 일이 잘된 데에는 "+endDa(f.cause));
  if(f.emotion)a.push(joinCauseEmotion(f.emotion,f.emotionReason));
  else if(f.thought)a.push("이 일을 겪고 "+endDa(f.thought));
  if(f.next)a.push("다음에는 "+endDa(f.next));else if(f.thought&&f.emotion)a.push("이 일을 겪고 "+endDa(f.thought));
 }
 return a.filter(Boolean).slice(0,4)
}
function storyTitle(){const f=state.facts,t=trimEnd(f.topic);if(state.mode==="curiosity")return t? t+"에 대한 나의 궁금증":"내가 궁금한 것";if(state.mode==="interest")return t? "내가 좋아하는 "+t:"내가 좋아하는 것";if(t)return t+"에 있었던 일";return "나의 이야기"}
function finish(){bar.style.width="96%";state.draft=makeStory();state.checked=state.draft.map(function(){return false});reviewStory()}
function reviewStory(){var rows=state.draft.map(function(x,i){var cls=state.checked[i]?"reviewline confirmed":"reviewline";return '<div class="'+cls+'" id="line'+i+'"><div class="reviewtext">'+esc(x)+'</div><div class="reviewactions"><button class="smallbtn" onclick="approveLine('+i+')">✓ 좋아요</button><button class="smallbtn" onclick="editLine('+i+')">✏️ 바꾸고 싶어요</button></div></div>'}).join("");var disabled=state.checked.every(Boolean)?"":' disabled style="opacity:.45"';main.innerHTML='<section class="card"><div class="question">문장을 하나씩 확인해 볼까?</div><div class="help">내 생각과 맞으면 ‘좋아요’를 누르고, 다르면 내가 직접 바꿀 수 있어.</div><div style="font-size:24px;font-weight:950;margin:14px 0">'+esc(storyTitle())+'</div>'+rows+'<div class="nav"><button class="btn ghost" onclick="back()">← 생각 고치기</button><button class="btn primary" onclick="confirmStory()"'+disabled+'>내 글로 확정하기</button></div></section>'}
function approveLine(i){state.checked[i]=true;reviewStory()}
function editLine(i){var box=document.querySelector("#line"+i);box.innerHTML='<div class="reviewtext">어떻게 바꾸고 싶어?</div><input class="editbox" id="edit'+i+'"><div class="reviewactions"><button class="smallbtn" onclick="saveEdit('+i+')">수정한 문장 사용하기</button><button class="smallbtn" onclick="reviewStory()">취소</button></div>';var input=document.querySelector("#edit"+i);input.value=state.draft[i];input.focus()}
function saveEdit(i){var input=document.querySelector("#edit"+i),v=input.value.trim();if(!v)return;state.draft[i]=/[.!?]$/.test(v)?v:v+".";state.checked[i]=true;reviewStory()}
function confirmStory(){if(!state.checked.every(Boolean))return;bar.style.width="100%";var body=state.draft.map(function(x){return '<span>'+esc(x)+' </span>'}).join("");main.innerHTML='<section class="card"><div class="question">내가 만든 글이 완성됐어!</div><div class="help">내가 직접 확인하고 고친 문장으로 완성했다.</div><div class="result"><div style="font-size:17px;color:#6d7c78;font-weight:800">🌱 내가 만든 글</div><div style="font-size:27px;font-weight:950;margin:5px 0 14px">'+esc(storyTitle())+'</div><div style="line-height:2">'+body+'</div></div><div class="nav"><button class="btn ghost" onclick="reviewStory()">← 다시 확인하기</button><button class="btn primary" onclick="home()">새 이야기 시작</button></div></section>'}
document.querySelector("#startBtn")?.addEventListener("click",startMenu);document.querySelector("#storyBtn")?.addEventListener("click",()=>alert("나의 이야기장은 다음 개발 단계에서 연결됩니다."));
</script></body></html>
