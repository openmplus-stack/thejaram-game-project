<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>요약 탐정 사무소 | THE JARAM 독서인지</title>
<meta name="description" content="핵심정보를 찾고 세부정보를 줄인 뒤 사건과 결과를 연결해 한 문장으로 요약하고 수행 결과를 확인하는 독서인지 학습 앱입니다.">
<script src="https://cdn.tailwindcss.com"></script>
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
html{font-size:14pt}body{font-family:'Noto Sans KR','Inter',sans-serif;background:#f3f4f6;margin:0}.fade-in{animation:fadeIn .25s ease-out}@keyframes fadeIn{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}::-webkit-scrollbar{width:7px}::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:6px}.story-card{transition:.18s}.story-card:hover{transform:translateY(-1px)}

@media print{
  @page{size:A4;margin:12mm}
  body{background:#fff!important;font-size:11pt}
  body *{visibility:hidden}
  #result-sheet,#result-sheet *{visibility:visible}
  #result-sheet{position:absolute;left:0;top:0;width:100%;padding:0!important;margin:0!important;border:0!important;box-shadow:none!important}
  .no-print{display:none!important}
  #result-sheet .grid{display:grid!important}
  #result-sheet .md\:grid-cols-2{grid-template-columns:1fr 1fr!important}
  #result-sheet .rounded-xl,#result-sheet .rounded-2xl{break-inside:avoid;page-break-inside:avoid}
}

</style>
</head>
<body><div id="root"></div>
<script type="text/babel">
const {useState,useEffect}=React;
const playSuccess=()=>{try{if(window.Tone){Tone.start();const s=new Tone.PolySynth(Tone.Synth).toDestination();const n=Tone.now();s.triggerAttackRelease('C5','8n',n);s.triggerAttackRelease('E5','8n',n+.1);s.triggerAttackRelease('G5','4n',n+.2);setTimeout(()=>s.dispose(),800)}}catch(e){}};
const SCENARIOS=[
{id:1,title:'과학 숙제 실종 사건',story:['나는 어젯밤 늦게까지 과학 숙제를 완벽하게 해냈다.','아침에 늦잠을 자서 허둥지둥 학교에 갔다.','과학 시간에 가방을 열어보니 숙제 노트가 없었다.','나는 입을 쩍 벌리고 멍하니 책상만 바라보았다.'],core:{who:'나',event:'숙제 노트를 집에 두고 왔다.',result:'멍하니 책상만 바라보았다.'},importance:['helpful','optional','essential','essential'],cause:'숙제 노트를 집에 두고 왔다',connector:'그래서',effect:'나는 멍하니 책상만 바라보았다',summary:'나는 숙제 노트가 없어서 책상을 바라보았다.'},
{id:2,title:'코 한가운데의 불청객',story:['내일은 내가 좋아하는 친구와 처음으로 놀러 가는 날이다.','아침에 일어나서 세수를 하려고 거울을 보았다.','코 정중앙에 엄청나게 큰 빨간 여드름이 났다.','나는 비명을 지르며 세면대를 쾅 내리쳤다.'],core:{who:'나',event:'코 한가운데 큰 여드름이 났다.',result:'비명을 지르며 세면대를 내리쳤다.'},importance:['helpful','optional','essential','essential'],cause:'코 한가운데 큰 여드름이 난 것을 보았다',connector:'그래서',effect:'나는 놀라고 속상해 세면대를 쾅 내리쳤다',summary:'나는 코의 큰 여드름을 보고 세면대를 내리쳤다.'},
{id:3,title:'무서운 선생님의 박수',story:['나는 국어 시간에 내가 쓴 시를 덜덜 떨며 발표했다.','평소 무서운 호랑이 선생님이 내 시를 끝까지 들으셨다.','선생님이 크게 박수를 치며 최고라고 칭찬해 주셨다.','나는 얼굴이 빨개진 채 고개를 푹 숙였다.'],core:{who:'나',event:'선생님에게 칭찬을 받았다.',result:'얼굴이 빨개져 고개를 숙였다.'},importance:['helpful','optional','essential','essential'],cause:'선생님에게 큰 칭찬을 받았다',connector:'그래서',effect:'나는 부끄러워 얼굴이 빨개진 채 고개를 숙였다',summary:'나는 선생님의 칭찬을 받고 고개를 숙였다.'},
{id:4,title:'억울한 짝꿍의 거짓말',story:['쉬는 시간에 내 짝꿍이 장난을 치다 화분을 깼다.','선생님이 들어오시자 짝꿍은 내가 밀어서 그랬다고 거짓말을 했다.','선생님은 내 변명은 듣지도 않고 나를 크게 혼내셨다.','나는 눈물을 꾹 참으며 주먹을 부르르 떨었다.'],core:{who:'나',event:'짝꿍의 거짓말 때문에 억울하게 혼났다.',result:'눈물을 참으며 주먹을 떨었다.'},importance:['helpful','essential','essential','essential'],cause:'짝꿍의 거짓말 때문에 억울하게 혼났다',connector:'그래서',effect:'나는 눈물을 참으며 주먹을 부르르 떨었다',summary:'나는 짝꿍의 거짓말로 혼나 주먹을 떨었다.'},
{id:5,title:'새 스니커즈 테러 사건',story:['나는 용돈을 모아 하얀 스니커즈를 새로 샀다.','오늘 처음으로 그 신발을 신고 기분 좋게 밖으로 나갔다.','옆으로 지나가던 자전거가 물웅덩이를 밟아 내 신발에 흙탕물을 튀겼다.','나는 입을 떡 벌린 채 내 발끝만 쳐다보았다.'],core:{who:'나',event:'새 신발에 흙탕물이 튀었다.',result:'놀라서 발끝만 쳐다보았다.'},importance:['helpful','optional','essential','essential'],cause:'새 신발에 흙탕물이 튀었다',connector:'그래서',effect:'나는 놀라서 발끝만 쳐다보았다',summary:'나는 흙탕물이 튄 새 신발을 바라보았다.'},
{id:6,title:'빈 폴더의 공포',story:['나는 역사 수행평가 발표를 위해 PPT를 열심히 만들었다.','내 발표 순서가 되어 교탁 컴퓨터에 USB를 꽂았다.','USB 안에는 PPT 파일이 없고 텅 빈 폴더뿐이었다.','나는 마우스를 쥔 채 식은땀을 뻘뻘 흘렸다.'],core:{who:'나',event:'USB에 발표 파일이 없었다.',result:'식은땀을 흘렸다.'},importance:['helpful','helpful','essential','essential'],cause:'USB에 발표 파일이 없었다',connector:'그래서',effect:'나는 당황해 식은땀을 뻘뻘 흘렸다',summary:'나는 USB에 발표 파일이 없어 식은땀을 흘렸다.'},
{id:7,title:'콘서트 티켓의 최후',story:['나는 아이돌 콘서트 티켓을 겨우 예매해서 받아왔다.','신이 나서 거실 소파 위에 티켓 봉투를 올려두었다.','우리 집 강아지가 그 봉투를 물어뜯어 갈기갈기 찢어 놓았다.','나는 다리에 힘이 풀려 바닥에 털썩 주저앉았다.'],core:{who:'나',event:'강아지가 콘서트 티켓을 찢었다.',result:'바닥에 털썩 주저앉았다.'},importance:['helpful','optional','essential','essential'],cause:'강아지가 콘서트 티켓을 찢어 놓았다',connector:'그래서',effect:'나는 충격을 받아 바닥에 털썩 주저앉았다',summary:'나는 강아지가 찢은 티켓을 보고 주저앉았다.'},
{id:8,title:'츤데레 오빠의 우산',story:['학교가 끝났는데 갑자기 비가 억수같이 쏟아졌다.','나는 우산이 없어서 현관에서 발만 동동 굴렀다.','맨날 나랑 싸우던 오빠가 자기 우산을 내 쪽으로 툭 던져주고 빗속으로 뛰어갔다.','나는 우산을 꽉 움켜쥐고 오빠의 뒷모습을 빤히 바라보았다.'],core:{who:'나',event:'오빠가 나에게 자기 우산을 주었다.',result:'오빠의 뒷모습을 바라보았다.'},importance:['helpful','helpful','essential','essential'],cause:'오빠가 나에게 자기 우산을 주고 빗속으로 뛰어갔다',connector:'그래서',effect:'나는 우산을 쥐고 오빠의 뒷모습을 바라보았다',summary:'나는 우산을 주고 가는 오빠를 바라보았다.'},
{id:9,title:'치즈 돈가스 대참사',story:['나는 용돈을 털어 분식점에서 제일 비싼 치즈 돈가스를 시켰다.','배가 너무 고파서 돈가스를 크게 썰어 포크로 푹 찍었다.','입으로 가져가던 순간 치즈가 미끄러지며 돈가스가 바닥에 떨어졌다.','나는 빈 포크를 들고 멍하니 바닥만 쳐다보았다.'],core:{who:'나',event:'돈가스를 바닥에 떨어뜨렸다.',result:'멍하니 바닥을 쳐다보았다.'},importance:['helpful','optional','essential','essential'],cause:'먹으려던 돈가스를 바닥에 떨어뜨렸다',connector:'그래서',effect:'나는 빈 포크를 들고 멍하니 바닥을 쳐다보았다',summary:'나는 떨어진 돈가스를 바라보았다.'},
{id:10,title:'서프라이즈 생일 선물',story:['오늘은 내 생일인데 부모님 두 분 다 바쁘셔서 혼자 집에 있었다.','저녁에 초인종이 울려서 나가보니 택배 상자가 놓여 있었다.','내가 스쳐 지나가듯 갖고 싶다던 한정판 백팩과 엄마의 편지가 들어있었다.','나는 상자를 꼭 끌어안고 코끝이 시큰해졌다.'],core:{who:'나',event:'원하던 백팩과 엄마의 편지를 선물로 받았다.',result:'감동해 상자를 안고 코끝이 시큰해졌다.'},importance:['helpful','optional','essential','essential'],cause:'원하던 백팩과 엄마의 편지를 깜짝 선물로 받았다',connector:'그래서',effect:'나는 감동해 상자를 꼭 안고 코끝이 시큰해졌다',summary:'나는 백팩과 엄마의 편지를 받고 상자를 끌어안았다.'}
];
const labels={essential:'꼭 필요해요',helpful:'있으면 좋아요',optional:'없어도 돼요'};
const colors={essential:'bg-red-50 border-red-300 text-red-700',helpful:'bg-amber-50 border-amber-300 text-amber-700',optional:'bg-gray-50 border-gray-300 text-gray-600'};
const Btn=({children,onClick,disabled=false,kind='blue',className=''})=><button onClick={onClick} disabled={disabled} className={`rounded-xl px-5 py-3 font-extrabold transition active:scale-[.98] disabled:opacity-40 disabled:cursor-not-allowed ${kind==='green'?'bg-green-600 hover:bg-green-700 text-white':kind==='white'?'bg-white border border-gray-300 hover:bg-gray-50 text-gray-700':'bg-blue-600 hover:bg-blue-700 text-white'} ${className}`}>{children}</button>;
const Reveal=({children})=><div className="fade-in mt-4 rounded-xl border border-green-200 bg-green-50 p-4"><div className="font-extrabold text-green-700 mb-2">💡 탐정 수첩</div>{children}</div>;
const norm=x=>(x||'').replace(/\s+/g,'').replace(/[.,!?"'’“”]/g,'');
const hit=(answer,target)=>{const a=norm(answer),t=norm(target);if(!a||!t)return false;if(a.includes(t)||t.includes(a))return true;const toks=t.replace(/(은|는|이|가|을|를|에|에서|에게|으로|로|와|과|도|만|때문에|그래서|하고|했다|하였다|되었다|있었다|없었다|나는|내가)/g,' ').split(/\s+/).filter(x=>x.length>=2);return toks.some(x=>a.includes(x))};
const level=(score,max)=>score/max>=.8?'잘함':score/max>=.5?'연습 중':'도움이 필요함';
function Step1({s,next,save}){const [a,setA]=useState(['','','']);const [show,setShow]=useState(false);const fields=[['누가?','이야기의 중심 인물'],['무슨 일이 있었나?','가장 중요한 사건'],['그래서 어떻게 되었나?','사건 뒤의 결과·반응']];const go=()=>{save({answers:a});next()};return <div className="fade-in"><h2 className="text-2xl font-extrabold">1단계 · 중요한 사건 찾기</h2><p className="mt-1 text-gray-600">이야기 전체를 다시 쓰지 말고, 핵심 세 가지만 찾아보세요.</p><div className="mt-5 space-y-3">{fields.map((f,i)=><div key={f[0]} className="grid md:grid-cols-[230px_1fr] gap-3 items-center rounded-xl bg-gray-50 border p-3"><div><div className="font-extrabold text-blue-700">{f[0]}</div><div className="text-sm text-gray-500">{f[1]}</div></div><input key={`case-${s.id}-field-${i}`} name={`case_${s.id}_step1_${i}_${Date.now()}`} type="text" value={a[i]} disabled={show} onChange={e=>{const n=[...a];n[i]=e.target.value;setA(n)}} autoComplete="new-password" autoCorrect="off" autoCapitalize="none" spellCheck="false" data-form-type="other" className="w-full rounded-lg border bg-white p-3 text-lg outline-none focus:border-blue-500"/></div>)}</div>{!show?<Btn className="w-full mt-5" disabled={a.some(x=>!x.trim())} onClick={()=>{playSuccess();setShow(true)}}>확인하기</Btn>:<><Reveal><div className="space-y-2 text-lg"><p><b>누가?</b> {s.core.who}</p><p><b>중요한 사건:</b> {s.core.event}</p><p><b>결과:</b> {s.core.result}</p></div></Reveal><div className="text-right mt-4"><Btn kind="green" onClick={go}>다음 단계 →</Btn></div></>}</div>}
function Step2({s,next,save}){const [ans,setAns]=useState(Array(s.story.length).fill(null));const [show,setShow]=useState(false);const all=ans.every(Boolean);const go=()=>{save({answers:ans});next()};return <div className="fade-in"><h2 className="text-2xl font-extrabold">2단계 · 필요한 내용만 남기기</h2><p className="mt-1 text-gray-600">요약에 얼마나 필요한 문장인지 판단하세요. 모든 내용을 넣을 필요는 없습니다.</p><div className="mt-4 space-y-3">{s.story.map((x,i)=><div key={i} className="rounded-xl border bg-white p-4"><p className="font-semibold leading-relaxed"><span className="text-blue-600 font-extrabold mr-2">{i+1}</span>{x}</p><div className="mt-3 flex flex-wrap gap-2">{['essential','helpful','optional'].map(k=><button key={k} disabled={show} onClick={()=>{const n=[...ans];n[i]=k;setAns(n)}} className={`px-3 py-2 rounded-lg border font-bold text-sm ${ans[i]===k?colors[k]:'bg-white text-gray-500 border-gray-200'}`}>{labels[k]}</button>)}</div>{show&&<div className={`mt-3 inline-block rounded-lg border px-3 py-1 text-sm font-bold ${colors[s.importance[i]]}`}>탐정 판단: {labels[s.importance[i]]}</div>}</div>)}</div>{!show?<Btn className="w-full mt-5" disabled={!all} onClick={()=>{playSuccess();setShow(true)}}>판단 확인하기</Btn>:<><Reveal><p><b>기억하세요.</b> 핵심 사건과 결과를 남기고 세부 정보는 줄이는 것이 중요합니다.</p></Reveal><div className="text-right mt-4"><Btn kind="green" onClick={go}>사건 연결하기 →</Btn></div></>}</div>}
function Step3({s,next,save}){const items=[s.cause,s.effect];const [order,setOrder]=useState([null,null]);const [connector,setConnector]=useState('');const [selected,setSelected]=useState(null);const [show,setShow]=useState(false);const place=i=>{if(selected!==null){const n=[...order];n[i]=selected;setOrder(n);setSelected(null)}};const go=()=>{save({order,connector});next()};return <div className="fade-in"><h2 className="text-2xl font-extrabold">3단계 · 사건 연결하기</h2><p className="mt-1 text-gray-600">먼저 일어난 핵심 사건과 그 결과를 연결해 보세요.</p><div className="mt-5 rounded-xl bg-blue-50 border border-blue-200 p-4"><div className="font-extrabold text-blue-700 mb-3">사건 카드</div><div className="grid md:grid-cols-2 gap-3">{items.map((x,i)=><button key={i} disabled={show} onClick={()=>setSelected(i)} className={`p-4 text-left rounded-xl border font-bold ${selected===i?'bg-blue-600 text-white border-blue-700':'bg-white border-blue-200 text-gray-800'}`}>{x}</button>)}</div></div><div className="mt-5 grid md:grid-cols-[1fr_150px_1fr] gap-3 items-center"><button disabled={show} onClick={()=>place(0)} className="min-h-24 rounded-xl border-2 border-dashed border-blue-300 bg-white p-4 font-bold">{order[0]!==null?items[order[0]]:'① 먼저 일어난 핵심 사건'}</button><select disabled={show} value={connector} onChange={e=>setConnector(e.target.value)} className="rounded-xl border p-3 font-bold text-center"><option value="">연결말</option><option>그래서</option><option>때문에</option><option>~해서</option><option>~하자</option></select><button disabled={show} onClick={()=>place(1)} className="min-h-24 rounded-xl border-2 border-dashed border-green-300 bg-white p-4 font-bold">{order[1]!==null?items[order[1]]:'② 그 뒤의 결과'}</button></div>{!show?<Btn className="w-full mt-6" disabled={order.some(x=>x===null)||!connector} onClick={()=>{playSuccess();setShow(true)}}>연결 확인하기</Btn>:<><Reveal><div className="text-lg"><span className="font-bold text-blue-700">{s.cause}</span> <span className="mx-2 font-extrabold text-orange-600">→ {s.connector} →</span> <span className="font-bold text-green-700">{s.effect}</span></div></Reveal><div className="text-right mt-4"><Btn kind="green" onClick={go}>내 말로 요약하기 →</Btn></div></>}</div>}
function Step4({s,done,save}){const [v,setV]=useState('');const [show,setShow]=useState(false);return <div className="fade-in"><h2 className="text-2xl font-extrabold">4단계 · 내 말로 한 줄 요약</h2><p className="mt-1 text-gray-600">이제 힌트 없이 가장 중요한 내용을 한 문장으로 압축해 보세요.</p><textarea disabled={show} value={v} onChange={e=>setV(e.target.value)} className="mt-5 w-full min-h-36 rounded-xl border p-4 text-xl leading-relaxed outline-none focus:border-blue-500" placeholder="핵심만 짧게 한 문장으로 써 보세요." autoComplete="new-password" autoCorrect="off" autoCapitalize="none" spellCheck="false"/>{!show?<Btn className="w-full mt-4" disabled={!v.trim()} onClick={()=>{playSuccess();setShow(true)}}>나의 요약 점검하기</Btn>:<><Reveal><p className="text-sm text-gray-500 mb-1">모범 요약 예시</p><p className="text-xl font-extrabold text-gray-900">{s.summary}</p><p className="mt-2 text-sm text-gray-600">문장이 똑같지 않아도 핵심 내용과 관계가 들어 있으면 좋은 요약입니다.</p></Reveal><Btn className="w-full mt-5 text-lg" onClick={()=>{save({answer:v});done(v)}}>📋 결과지 보기</Btn></>}</div>}

const escapeHtml=(v)=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const downloadResultHtml=(s,data,analysis)=>{
 const {a,imp,sum,rows,total,max,strengths,needs,relationScore,relationNote}=analysis;
 const importance=s.story.map((x,i)=>`<li><b>${i+1}번</b> · ${escapeHtml(labels[imp[i]]||'-')} ${imp[i]===s.importance[i]?'✓':`→ ${escapeHtml(labels[s.importance[i]])}`}</li>`).join('');
 const rowHtml=rows.map(r=>`<tr><td>${escapeHtml(r[0])}</td><td>${escapeHtml(level(r[1],r[2]))}</td><td>${r[1]}/${r[2]}</td></tr>`).join('');
 const list=(xs,fallback)=> (xs.length?xs:[fallback]).map(x=>`<li>${escapeHtml(x)}</li>`).join('');
 const doc=`<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>요약 탐정 결과지 - ${escapeHtml(s.title)}</title><style>
 body{font-family:-apple-system,BlinkMacSystemFont,"Noto Sans KR","Malgun Gothic",sans-serif;color:#1f2937;max-width:820px;margin:32px auto;padding:0 24px;line-height:1.65}
 h1{text-align:center;margin-bottom:4px}.sub{text-align:center;color:#6b7280}.box{border:1px solid #d1d5db;border-radius:14px;padding:18px;margin:16px 0}.blue{background:#eff6ff}.green{background:#f0fdf4}.amber{background:#fffbeb}
 table{width:100%;border-collapse:collapse;margin-top:10px}th,td{border:1px solid #d1d5db;padding:9px;text-align:left}th{background:#f9fafb}
 .answer{font-size:1.15em;font-weight:700;background:#f9fafb;padding:14px;border-radius:10px}.small{font-size:.9em;color:#6b7280}
 @media print{@page{size:A4;margin:12mm}body{margin:0;max-width:none}.box{break-inside:avoid}}
 </style></head><body>
 <h1>요약 탐정 결과지</h1><div class="sub">#${s.id} ${escapeHtml(s.title)}</div>
 <div class="box blue"><b>전체 수행</b><h2>${escapeHtml(level(total,max))}</h2><div class="small">이 결과는 학습 방향을 보기 위한 수행 기록이며, 표준화 검사 점수가 아닙니다.</div></div>
 <div class="box"><h2>영역별 수행</h2><table><thead><tr><th>영역</th><th>수준</th><th>기록</th></tr></thead><tbody>${rowHtml}</tbody></table></div>
 <div class="box"><h2>아동의 실제 답</h2><p><b>누가?</b> ${escapeHtml(a[0])}</p><p><b>중요한 사건:</b> ${escapeHtml(a[1])}</p><p><b>결과:</b> ${escapeHtml(a[2])}</p>
 <h3>중요도 판단</h3><ul>${importance}</ul><p><b>선택한 연결말:</b> ${escapeHtml(data.step3?.connector||'-')}</p>
 <div class="box ${relationScore?'green':'amber'}"><b>사건 관계 분석</b><p>${escapeHtml(relationNote)}</p></div>
 <div class="answer">내가 쓴 한 줄 요약<br>${escapeHtml(sum)}</div><p class="small">모범 예시</p><p><b>${escapeHtml(s.summary)}</b></p></div>
 <div class="box green"><h2>잘한 점</h2><ul>${list(strengths,'끝까지 과제를 수행하고 자신의 문장으로 요약했습니다.')}</ul></div>
 <div class="box amber"><h2>다음 연습</h2><ul>${list(needs.slice(0,3),'현재 방식으로 새로운 이야기에서도 독립 요약을 연습해 보세요.')}</ul></div>
 <div class="box"><b>교사용 관찰 포인트</b><p>정답 개수만 보지 말고, 카드 조작과 독립 요약을 함께 비교하세요. 카드 배치에서 오류가 있어도 최종 문장에서 핵심 사건과 결과를 정확히 연결했다면 관계 이해가 확인된 것으로 기록하고, 조작 실수 가능성을 별도로 관찰하세요.</p></div>
 </body></html>`;
 const blob=new Blob([doc],{type:'text/html;charset=utf-8'});
 const url=URL.createObjectURL(blob),link=document.createElement('a');
 link.href=url;link.download=`요약탐정_결과지_${s.id}_${s.title.replace(/[\\/:*?"<>|]/g,'_')}.html`;
 document.body.appendChild(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);
};

function Result({s,data,back}){const a=data.step1?.answers||['','',''];const imp=data.step2?.answers||[];const ord=data.step3?.order||[];const sum=data.step4?.answer||'';const coreHits=[hit(a[0],s.core.who),hit(a[1],s.core.event),hit(a[2],s.core.result)];const impScore=imp.filter((x,i)=>x===s.importance[i]).length;const orderScore=(ord[0]===0&&ord[1]===1)?1:0;const sumHits=[hit(sum,s.core.who),hit(sum,s.core.event)||hit(sum,s.cause),hit(sum,s.core.result)||hit(sum,s.effect)];const concise=norm(sum).length<=norm(s.summary).length+12;const summaryRelation=(sumHits[1]&&sumHits[2]);const relationScore=(orderScore||summaryRelation)?1:0;const relationNote=orderScore?'카드 배치에서 사건→결과 순서를 정확히 연결함':summaryRelation?'카드 배치에서는 오류가 있었으나, 독립 요약에서 핵심 사건→결과 관계를 정확히 표현함':'카드 배치와 독립 요약 모두에서 사건→결과 관계를 추가로 확인할 필요가 있음';const rows=[['핵심정보 찾기',coreHits.filter(Boolean).length,3],['중요도 판단',impScore,s.story.length],['사건 관계 이해',relationScore,1],['독립 요약',sumHits.filter(Boolean).length+(concise?1:0),4]];const total=rows.reduce((n,r)=>n+r[1],0),max=rows.reduce((n,r)=>n+r[2],0);const strengths=[];if(coreHits.filter(Boolean).length>=2)strengths.push('이야기에서 핵심 인물·사건·결과를 찾는 힘이 보입니다.');if(impScore>=3)strengths.push('중요한 내용과 세부 내용을 비교적 잘 구별했습니다.');if(orderScore)strengths.push('카드 배치에서 사건과 결과의 순서를 바르게 연결했습니다.');else if(summaryRelation)strengths.push('카드 배치에서는 오류가 있었지만, 독립 요약에서 사건과 결과의 관계를 정확히 표현했습니다.');if(sumHits.filter(Boolean).length>=2)strengths.push('자기 문장에 핵심 사건과 결과를 담았습니다.');if(concise)strengths.push('불필요하게 길어지지 않고 짧게 요약했습니다.');const needs=[];if(!coreHits[1])needs.push('가장 중요한 사건을 한 문장으로 찾는 연습');if(!coreHits[2])needs.push('사건 뒤에 생긴 결과를 찾는 연습');if(impScore<3)needs.push('꼭 필요한 내용과 세부 정보를 구별하는 연습');if(!orderScore&&!summaryRelation)needs.push('먼저 일어난 일과 그 결과를 순서대로 연결하는 연습');if(sumHits.filter(Boolean).length<2)needs.push('핵심 사건과 결과를 한 문장에 함께 넣는 연습');if(!concise)needs.push('수식어와 세부 내용을 빼고 더 짧게 쓰는 연습');const analysis={a,imp,ord,sum,rows,total,max,strengths,needs,relationScore,relationNote};return <div id="result-sheet" className="fade-in"><div className="text-center"><div className="text-4xl">📋</div><h2 className="mt-2 text-3xl font-extrabold">요약 탐정 결과지</h2><p className="mt-1 text-gray-500">#{s.id} {s.title}</p></div><div className="mt-6 rounded-2xl bg-blue-50 border border-blue-200 p-5"><div className="text-sm text-blue-700 font-bold">전체 수행</div><div className="mt-1 text-3xl font-extrabold text-blue-900">{level(total,max)}</div><p className="mt-2 text-sm text-gray-600">이 결과는 학습 방향을 보기 위한 수행 기록이며, 표준화 검사 점수가 아닙니다.</p></div><div className="mt-5 grid md:grid-cols-2 gap-3">{rows.map(r=><div className="rounded-xl border bg-white p-4"><div className="font-extrabold">{r[0]}</div><div className="mt-1 text-lg text-blue-700 font-bold">{level(r[1],r[2])} <span className="text-sm text-gray-400">({r[1]}/{r[2]})</span></div></div>)}</div><div className="mt-5 rounded-xl border bg-white p-5"><h3 className="font-extrabold text-xl">아동의 실제 답</h3><div className="mt-3 space-y-3 text-gray-800"><p><b>누가?</b> {a[0]}</p><p><b>중요한 사건:</b> {a[1]}</p><p><b>결과:</b> {a[2]}</p><div className="border-t pt-3"><b>중요도 판단:</b>{s.story.map((x,i)=><div className="mt-2 text-sm"><span className="font-bold">{i+1}번</span> · {labels[imp[i]]||'-'} {imp[i]===s.importance[i]?<span className="text-green-600 font-bold">✓</span>:<span className="text-orange-600">→ {labels[s.importance[i]]}</span>}</div>)}</div><p className="border-t pt-3"><b>선택한 연결말:</b> {data.step3?.connector||'-'}</p><div className={`rounded-xl border p-4 ${relationScore?'bg-green-50 border-green-200':'bg-amber-50 border-amber-200'}`}><div className="font-extrabold">사건 관계 분석</div><p className="mt-1 text-sm">{relationNote}</p></div><div className="rounded-xl bg-gray-50 p-4"><div className="text-sm text-gray-500">내가 쓴 한 줄 요약</div><p className="mt-1 text-xl font-extrabold">{sum}</p><div className="mt-3 text-sm text-gray-500">모범 예시</div><p className="font-bold">{s.summary}</p></div></div></div><div className="mt-5 grid md:grid-cols-2 gap-4"><div className="rounded-xl bg-green-50 border border-green-200 p-5"><h3 className="font-extrabold text-green-800">잘한 점</h3><ul className="mt-2 space-y-2 text-sm">{(strengths.length?strengths:['끝까지 과제를 수행하고 자신의 문장으로 요약했습니다.']).map(x=><li>• {x}</li>)}</ul></div><div className="rounded-xl bg-amber-50 border border-amber-200 p-5"><h3 className="font-extrabold text-amber-800">다음 연습</h3><ul className="mt-2 space-y-2 text-sm">{(needs.length?needs:['현재 방식으로 새로운 이야기에서도 독립 요약을 연습해 보세요.']).slice(0,3).map(x=><li>• {x}</li>)}</ul></div></div><div className="mt-5 rounded-xl bg-gray-50 border p-4"><b>교사용 관찰 포인트</b><p className="mt-1 text-sm text-gray-600">정답 개수만 보지 말고, 카드 조작과 독립 요약을 함께 비교하세요. 카드 배치에서 오류가 있어도 최종 문장에서 핵심 사건과 결과를 정확히 연결했다면 관계 이해가 확인된 것으로 기록하고, 조작 실수 가능성을 별도로 관찰하세요.</p></div><div className="no-print mt-6 grid md:grid-cols-2 gap-3">
<Btn kind="white" className="w-full text-lg" onClick={()=>window.print()}>🖨 결과지 인쇄</Btn>
<Btn kind="green" className="w-full text-lg" onClick={()=>downloadResultHtml(s,data,analysis)}>⬇ 결과지 다운로드</Btn>
</div>
<div className="no-print"><Btn className="w-full mt-3" onClick={back}>사건 목록으로</Btn></div></div>}
function App(){const [id,setId]=useState(null),[step,setStep]=useState(1),[completed,setCompleted]=useState(()=>new Set()),[records,setRecords]=useState({}),[showResult,setShowResult]=useState(false);const select=x=>{setId(x);setStep(1);setShowResult(false)};const save=(part,obj)=>setRecords(p=>({...p,[id]:{...(p[id]||{}),[part]:obj}}));const finish=(v)=>{setRecords(p=>({...p,[id]:{...(p[id]||{}),step4:{answer:v}}}));setCompleted(p=>new Set([...p,id]));setShowResult(true)};if(!id)return <main className="max-w-5xl mx-auto min-h-screen px-5 py-8"><header className="text-center mb-7"><div className="mx-auto w-16 h-16 rounded-2xl bg-blue-600 text-white grid place-items-center text-4xl shadow">🕵️</div><h1 className="mt-3 text-4xl font-extrabold">요약 탐정 사무소</h1><p className="mt-2 text-gray-500">중요한 단서를 찾고, 필요 없는 내용은 버리고, 한 문장으로 사건을 해결하세요.</p></header><div className="grid md:grid-cols-2 gap-3">{SCENARIOS.map(s=><button key={s.id} onClick={()=>select(s.id)} className="story-card flex items-center gap-3 rounded-xl bg-white border p-4 text-left shadow-sm hover:border-blue-300"><span className={`w-11 h-11 rounded-full grid place-items-center font-extrabold ${completed.has(s.id)?'bg-green-100 text-green-700':'bg-blue-100 text-blue-700'}`}>{completed.has(s.id)?'✓':s.id}</span><div><div className="font-extrabold text-lg">{s.title}</div><div className="text-sm text-gray-500">4단계 요약 수사</div></div></button>)}</div></main>;
const s=SCENARIOS.find(x=>x.id===id);const idx=SCENARIOS.findIndex(x=>x.id===id);if(showResult)return <main className="max-w-5xl mx-auto min-h-screen px-4 md:px-8 py-6"><section className="rounded-2xl bg-white border shadow-sm p-5 md:p-7"><Result s={s} data={records[id]||{}} back={()=>{setId(null);setStep(1);setShowResult(false)}}/></section></main>;
return <main className="max-w-6xl mx-auto min-h-screen px-4 md:px-8 py-5"><header className="rounded-xl bg-white border shadow-sm p-3 flex flex-wrap gap-3 justify-between items-center"><button onClick={()=>setId(null)} className="font-bold text-gray-600">← 사건 목록</button><div className="font-extrabold"><span className="text-blue-600">#{s.id}</span> {s.title}</div><div className="flex gap-2"><button disabled={idx===0} onClick={()=>select(SCENARIOS[idx-1].id)} className="px-3 py-2 rounded-lg border disabled:opacity-30">이전</button><button disabled={idx===SCENARIOS.length-1} onClick={()=>select(SCENARIOS[idx+1].id)} className="px-3 py-2 rounded-lg border disabled:opacity-30">다음</button></div></header><div className="mt-4 rounded-2xl bg-blue-50 border-2 border-blue-200 p-5"><div className="font-extrabold text-blue-800 mb-2">🕵️ 사건 개요</div><p className="text-xl leading-[1.9] font-semibold text-gray-800 break-keep">{s.story.join(' ')}</p></div><div className="my-4 flex items-center gap-2">{[1,2,3,4].map(n=><React.Fragment key={n}><div className={`w-9 h-9 rounded-full grid place-items-center font-extrabold ${step===n?'bg-blue-600 text-white':step>n?'bg-green-500 text-white':'bg-gray-200 text-gray-500'}`}>{step>n?'✓':n}</div>{n<4&&<div className={`h-1 flex-1 rounded ${step>n?'bg-green-400':'bg-gray-200'}`}/>}</React.Fragment>)}</div><section className="rounded-2xl bg-white border shadow-sm p-5 md:p-7 mb-8">{step===1&&<Step1 key={`step1-${s.id}`} s={s} save={x=>save('step1',x)} next={()=>setStep(2)}/>} {step===2&&<Step2 s={s} save={x=>save('step2',x)} next={()=>setStep(3)}/>} {step===3&&<Step3 s={s} save={x=>save('step3',x)} next={()=>setStep(4)}/>} {step===4&&<Step4 key={`step4-${s.id}`} s={s} save={x=>save('step4',x)} done={finish}/>}</section></main>}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script></body></html>
