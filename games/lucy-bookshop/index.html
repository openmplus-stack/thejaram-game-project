<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f8edda"><meta name="description" content="루시와 수상한 책방: 한국어 전래동화 모험 게임 개발용 11단계 프로토타입"><title>루시와 수상한 책방</title><style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,'Noto Sans KR',sans-serif;color:#49382d;background:radial-gradient(circle at 80% 10%,#f7e4b9,transparent 40%),linear-gradient(135deg,#f8f1e4,#d8eae2);min-height:100vh}.app{max-width:1180px;margin:auto;padding:20px}.top{display:flex;align-items:center;justify-content:space-between;padding:10px 0 20px;font-weight:800;font-size:23px}.panel{background:#fff9edee;border:1px solid #ddc6a4;border-radius:25px;padding:clamp(22px,4vw,52px);box-shadow:0 14px 45px #67543a1a;min-height:570px}.hero{text-align:center;display:grid;place-content:center;gap:16px}.hero h1{font-size:clamp(38px,6vw,75px);margin:0;line-height:1.25}.hero .art{font-size:85px}.muted{color:#7a7165}.actions{display:flex;justify-content:center;flex-wrap:wrap;gap:12px;margin-top:15px}button,select{font:inherit}button{cursor:pointer;border:0;border-radius:14px;padding:15px 24px;font-size:20px;font-weight:700;background:#e8d8bc;color:#49382d}button.primary{background:#277c77;color:white}button:disabled{opacity:.4;cursor:not-allowed}button:focus-visible,select:focus-visible{outline:3px solid #d6a649;outline-offset:3px}select{display:block;width:100%;max-width:600px;margin:8px 0 22px;padding:15px;border:2px solid #c5b49a;border-radius:12px;background:white;font-size:21px}label{display:block;font-weight:700;margin-top:15px}h2{font-size:clamp(27px,4vw,40px)}.story-art{font-size:80px;text-align:center;padding:35px;background:#e2ecdf;border-radius:20px}.dialogue{background:#fff;border:1px solid #decaa8;border-radius:18px;padding:25px;font-size:clamp(23px,3vw,30px);line-height:1.7}.kicker{font-weight:800;color:#2d7975}.shop-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}.book{min-height:125px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:#87634e;color:white;padding:12px;font-size:16px}.book.restored{background:#287d7a}.book span{font-size:24px}.character{text-align:center;font-size:60px;padding:22px}.character p{font-size:18px}.footer{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin-top:22px}.note{background:#e5eee8;padding:14px;border-radius:12px}.small{font-size:15px}footer{text-align:center;margin:25px;color:#736b62}@media(max-width:650px){.app{padding:12px}.top{font-size:17px}.panel{padding:20px;min-height:70vh}.shop-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.book{min-height:95px}button{font-size:17px;padding:13px}.story-art{font-size:55px}}
</style></head><body><div class="app"><div class="top"><span>📖 루시와 수상한 책방</span><button onclick="go('settings')">⚙️ 설정</button></div><main id="view" class="panel"></main><footer>11단계 개발용 프로토타입 · 전래동화 미션은 후속 단계에서 구현합니다.</footer></div><script>
const key='lucy-bookshop-save-v1',init={page:'start',uiLanguage:'ko',topik:'unknown',diagnostic:'later',prologueIndex:0,restoredIds:[],selectedBook:null};let s;try{s={...init,...JSON.parse(localStorage.getItem(key)||'{}')}}catch{s={...init}};const tales=['금도끼 은도끼','흥부와 놀부','해와 달이 된 오누이','도깨비 방망이','선녀와 나무꾼','팥죽 할멈과 호랑이','혹부리 영감','토끼와 자라','콩쥐 팥쥐','견우와 직녀'];const story=['낯선 골목을 걷던 루시는 아주 작은 책방을 발견했어요. 낡은 간판에는 「수상한 책방」이라고 적혀 있었지요.','문을 열자 책들이 스스로 꿈틀거렸어요. "거기 서!" 늙은 검은 고양이가 책장 위에서 소리쳤어요.','그때 반짝이는 무언가가 책에서 튀어나왔어요. 알록달록한 복주머니가 펄쩍 뛰어올라 그것을 꿀꺽 삼켰지요.','"복딱! 또 너무 크게 삼켰잖아!" 고양이가 투덜거렸어요. 루시는 깜짝 놀라 가슴의 오래된 펜던트를 붙잡았어요.','고양이는 펜던트를 보고 눈을 크게 떴어요. "그 목걸이… 어디서 났지?" 루시가 대답하기도 전에 다른 물건이 책 밖으로 도망쳤어요.','"이야기들이 사라지고 있어!" 복딱이 말했어요. "우리와 함께 찾아줄래?" 이제 루시의 모험이 시작됩니다.'];const v=document.getElementById('view');function save(){localStorage.setItem(key,JSON.stringify(s))}function set(p){Object.assign(s,p);save();render()}function go(p){set({page:p})}function newGame(){set({...init,page:'setup'})}function speak(){if(!window.speechSynthesis)return alert('음성을 지원하지 않는 기기입니다.');speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(story[s.prologueIndex]);u.lang='ko-KR';u.rate=.9;speechSynthesis.speak(u)}function levelOptions(){return '<option value="unknown">모르겠어요</option>'+[1,2,3,4,5,6].map(n=>'<option value="'+n+'">TOPIK '+n+'급</option>').join('')}function selectValue(id,value){document.getElementById(id).value=value}function book(n){set({page:'book',selectedBook:n})}function next(){s.prologueIndex>=story.length-1?go('shop'):set({prologueIndex:s.prologueIndex+1})}function reset(){if(confirm('이 기기의 진행 기록을 초기화할까요?')){localStorage.removeItem(key);s={...init};render()}}function render(){const p=s.page;let h='';if(p==='start'){h='<section class="hero"><div class="art">📚 ✨ 🐈‍⬛</div><p class="kicker">한국어로 이야기를 되찾는 모험</p><h1>루시와<br>수상한 책방</h1><p>사라진 전래동화 속 비밀을 찾아보세요.</p><div class="actions"><button class="primary" onclick="newGame()">모험 시작하기 →</button><button onclick="go(\'shop\')" '+(localStorage.getItem(key)&&s.prologueIndex>0?'':'disabled')+'>이어하기</button></div></section>'}else if(p==='setup'){h='<p class="kicker">모험 준비</p><h2>루시와 함께 떠나볼까요?</h2><label>화면 안내 언어</label><select id="lang" onchange="set({uiLanguage:this.value})"><option value="ko">한국어</option><option value="en">English (번역 예정)</option><option value="ja">日本語 (번역 예정)</option><option value="zh">简体中文 (번역 예정)</option><option value="vi">Tiếng Việt (번역 예정)</option></select><p class="muted small">현재 시범판의 안내문은 한국어로 제공됩니다.</p><label>한국어 수준</label><select id="level" onchange="set({topik:this.value})">'+levelOptions()+'</select><label>간단한 수준 확인</label><select id="diag" onchange="set({diagnostic:this.value})"><option value="later">나중에 할래요</option><option value="now">지금 확인할래요 (후속 개발)</option></select><div class="actions"><button onclick="go(\'start\')">이전</button><button class="primary" onclick="set({page:\'prologue\',prologueIndex:0})">이야기 시작 →</button></div>'}else if(p==='prologue'){h='<p class="kicker">프롤로그 '+(s.prologueIndex+1)+' / '+story.length+'</p><div class="story-art">📚 🐈‍⬛ ✨</div><div class="dialogue">'+story[s.prologueIndex]+'</div><div class="actions"><button onclick="set({prologueIndex:Math.max(0,s.prologueIndex-1)})" '+(s.prologueIndex===0?'disabled':'')+'>이전</button><button onclick="speak()">🔊 듣기</button><button class="primary" onclick="next()">'+(s.prologueIndex===story.length-1?'책방 들어가기':'다음 →')+'</button></div>'}else if(p==='shop'){h='<p class="kicker">마법의 책방 · 복원 '+s.restoredIds.length+'/10권</p><h2>어떤 이야기를 펼칠까요?</h2><div class="character">🐈‍⬛ <p>서묵: 흠, 다음 책을 골라 보라고.</p></div><div class="shop-grid">'+tales.map((t,i)=>'<button class="book '+(s.restoredIds.includes('ep'+(i+1))?'restored':'')+'" onclick="book('+i+')"><span>📕 '+(i+1)+'</span>'+t+'</button>').join('')+'</div><div class="footer"><button onclick="alert(\'복딱 보관함은 15단계에서 구현합니다.\')">🎒 복딱</button><button onclick="alert(\'단서 기록은 16단계에서 구현합니다.\')">📜 단서</button><button onclick="alert(\'학습 기록은 17단계에서 구현합니다.\')">⭐ 학습 기록</button></div>'}else if(p==='book'){h='<button onclick="go(\'shop\')">← 책방으로</button><div class="character">📕</div><p class="kicker">전래동화 '+((s.selectedBook??0)+1)+'</p><h2>'+tales[s.selectedBook??0]+'</h2><p>사라진 존재를 찾는 모험입니다.</p><p class="note">11단계에서는 책 선택 화면까지 구현했습니다. 실제 학습 미션은 후속 단계에서 연결합니다.</p><button class="primary" onclick="alert(\'전래동화 장면은 12단계부터 구현합니다.\')">이야기 펼치기 →</button>'}else if(p==='settings'){h='<button onclick="go(\'shop\')">← 책방으로</button><h2>설정</h2><label>한국어 수준</label><select id="level" onchange="set({topik:this.value})">'+levelOptions()+'</select><label>안내 언어 (번역 후속 구현)</label><select id="lang" onchange="set({uiLanguage:this.value})"><option value="ko">한국어</option><option value="en">English</option><option value="ja">日本語</option><option value="zh">简体中文</option><option value="vi">Tiếng Việt</option></select><div class="actions"><button onclick="go(\'start\')">시작 화면</button><button onclick="reset()">저장 기록 초기화</button></div>'}v.innerHTML=h;if(document.getElementById('lang'))selectValue('lang',s.uiLanguage);if(document.getElementById('level'))selectValue('level',s.topik);if(document.getElementById('diag'))selectValue('diag',s.diagnostic)}render();
</script></body></html>
