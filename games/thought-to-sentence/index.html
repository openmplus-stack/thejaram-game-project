<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="description" content="한 단어에서 시작해 생각을 발견하고 확장해 나만의 글을 만드는 자기표현 학습 앱"><title>생각을 문장으로</title>
<style>:root{--sky:#dff4ff;--grass:#eaf5cf;--cream:#fffdf4;--ink:#27404a;--muted:#6d7c78;--green:#54b89c;--green2:#dff5e8;--yellow:#ffca58;--pink:#ffdce3;--line:#e6dfc8}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif;color:var(--ink);background:linear-gradient(#dff4ff 0 42%,#f5f1c9 72%,#e6f4c9)}button,input{font:inherit}.app{max-width:1000px;margin:auto;min-height:100vh;padding:22px}.brand{font-weight:950;font-size:24px}.top{display:flex;align-items:center;gap:15px}.progress{height:12px;flex:1;background:#fff9;border-radius:20px;overflow:hidden}.bar{height:100%;background:var(--green);width:0}.card{margin-top:18px;background:#fffdf4f2;border:2px solid #fff;border-radius:30px;padding:28px;box-shadow:0 12px 36px #577d6b22}.hero{min-height:78vh;display:grid;place-items:center;text-align:center}.logo{font-size:46px;font-weight:1000;line-height:1.05;color:#32715e;text-shadow:0 3px #fff}.hedgehog{width:170px;height:170px;margin:16px auto;position:relative}.spines{position:absolute;inset:5px;border-radius:50%;background:#8b654d;box-shadow:0 0 0 13px #9d7659;z-index:1}.face{position:absolute;left:28px;top:35px;width:118px;height:112px;border-radius:50% 50% 45% 45%;background:#f7d7aa;z-index:2;box-shadow:inset 0 -7px 0 #efc894}.eye{position:absolute;top:43px;width:13px;height:17px;background:#2d2825;border-radius:50%}.eye.l{left:32px}.eye.r{right:32px}.nose{position:absolute;top:65px;left:52px;width:14px;height:12px;background:#372b29;border-radius:50%}.cheek{position:absolute;top:66px;width:18px;height:10px;background:#f3a8a1aa;border-radius:50%}.cheek.l{left:18px}.cheek.r{right:18px}.face:after{content:"⌣";position:absolute;left:49px;top:69px;font-size:24px;font-weight:900;color:#6c4938}.speech{max-width:560px;margin:12px auto;background:white;border-radius:24px;padding:17px 22px;font-size:20px;font-weight:800}.menu{display:grid;gap:12px;max-width:520px;margin:18px auto}.btn{border:0;border-radius:18px;padding:16px 22px;font-weight:900;cursor:pointer}.primary{background:var(--yellow);color:#604719;box-shadow:0 4px #e3aa38}.secondary{background:#72d2c2;color:#174e48}.ghost{background:#fff;border:2px solid var(--line)}.question{font-size:30px;font-weight:950;margin:8px 0}.help{font-size:17px;color:var(--muted);margin-bottom:20px}.mascot-row{display:flex;gap:18px;align-items:center}.mini{transform:scale(.45);transform-origin:center;width:82px;height:82px;margin:-15px}.choices{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.choice{background:#fff;border:2px solid var(--line);border-radius:20px;padding:18px;text-align:left;font-weight:850;font-size:18px}.choice:hover,.choice.sel{border-color:var(--green);background:var(--green2)}.icon{font-size:26px;margin-right:8px}.inputrow{display:flex;gap:10px;margin:12px 0 22px}.tryfirst{background:#eaf8f3;border:2px solid #bfe8da;border-radius:22px;padding:18px;margin:12px 0 22px}.trytitle{font-size:18px;font-weight:950;margin-bottom:4px}.examples{font-size:17px;font-weight:900;color:#5f716c;margin:8px 0 12px}.inputrow input{flex:1;border:2px solid var(--line);border-radius:18px;padding:16px;font-size:19px}.nav{display:flex;justify-content:space-between;margin-top:22px;gap:12px}.thoughts{margin-top:18px;padding:16px;background:#fff;border-radius:20px}.thought{display:inline-block;margin:5px;padding:9px 13px;background:#edf7df;border-radius:20px;font-weight:750}.map{display:flex;flex-wrap:wrap;gap:10px;align-items:center}.arrow{font-weight:1000;color:#8a9b80}.result{font-size:21px;line-height:1.8;background:#fff;padding:22px;border-radius:22px}@media(max-width:650px){.app{padding:12px}.card{padding:20px}.choices{grid-template-columns:1fr}.logo{font-size:38px}.question{font-size:25px}}</style></head>
<body><div class="app"><div id="top" class="top" style="display:none"><div class="brand">🌱 생각을 문장으로</div><div class="progress"><div id="bar" class="bar"></div></div></div><main id="main"><section class="hero"><div class="hedgehog" role="img" aria-label="생각을 도와주는 고슴도치"><div class="spines"></div><div class="face"><i class="eye l"></i><i class="eye r"></i><i class="nose"></i><i class="cheek l"></i><i class="cheek r"></i></div></div><div class="logo">생각을<br>문장으로</div><div class="speech">안녕! 오늘은 어떤 생각을 찾아볼까?<br>한 단어에서 시작해도 괜찮아.</div><div class="menu"><button class="btn primary" id="startBtn">📖 이야기 만들기</button><button class="btn secondary" id="storyBtn">📚 나의 이야기장</button></div></section></main></div>
<script>
const main=document.querySelector("#main"),topBar=document.querySelector("#top"),bar=document.querySelector("#bar");
const H='<div class="hedgehog" role="img" aria-label="생각을 도와주는 고슴도치"><div class="spines"></div><div class="face"><i class="eye l"></i><i class="eye r"></i><i class="nose"></i><i class="cheek l"></i><i class="cheek r"></i></div></div>';
const START=[["☀️","오늘 있었던 일","event"],["💡","기억나는 일","event"],["❤️","기분에 관한 일","emotion"],["🔎","궁금한 것","curiosity"],["⭐","좋아하는 것","interest"],["🏫","학교에서 있었던 일","event"],["🏠","집에서 있었던 일","event"],["👫","친구 이야기","event"],["👨‍👩‍👧","가족 이야기","event"],["📚","공부·숙제","event"],["🎮","게임","interest"],["⚽","운동","interest"],["🎨","그림·만들기","interest"],["🎵","음악·춤","interest"],["🐾","동물","interest"],["🚗","자동차·탈것","interest"],["🌍","나라·여행","curiosity"],["🔬","과학·자연","curiosity"],["😟","속상하거나 어려웠던 일","emotion"],["✏️","내가 정하기","free"]];
let state={mode:"",node:"",answers:[],facts:{}};
const nodes={
 eventSeed:{q:"가장 먼저 떠오르는 말은 뭐야?",h:"사람, 물건, 장소, 행동 무엇이든 괜찮아.",c:["학교","친구","선생님","시험","준비물","게임","운동","급식","학원","가족","버스","숙제","발표","쉬는 시간","점심시간","집"],slot:"topic"},
 emotionSeed:{q:"어떤 기분이 가장 먼저 떠올라?",h:"먼저 기분을 고르고, 왜 그런 기분이 들었는지 찾아보자.",c:["기뻤다","뿌듯했다","편안했다","놀랐다","당황했다","속상했다","걱정됐다","화가 났다"],slot:"emotion"},
 curiositySeed:{q:"무엇이 궁금해?",h:"알고 싶은 것을 한 단어나 짧은 말로 말해도 괜찮아.",c:["동물","공룡","우주","자동차","사람","나라","과학","로봇","곤충","바다","날씨","역사","음식","식물","컴퓨터","직접 말하기"],slot:"topic"},
 interestSeed:{q:"무엇을 좋아해?",h:"좋아하는 대상이나 활동을 골라 보자.",c:["동물","공룡","자동차","그림","음악","운동","게임","책","로봇","요리","여행","만들기","사진","춤","과학","역사"],slot:"topic"},
 freeSeed:{q:"지금 떠오르는 말을 적어 볼까?",h:"한 단어만 적어도 괜찮아.",c:["사람","물건","장소","한 일","기분","궁금한 것","좋아하는 것","직접 말하기"],slot:"topic"},
 event:{q:"그것과 관련해 무슨 일이 있었어?",h:"가장 기억나는 한 가지 일을 골라 보자.",c:["잘했다","실수했다","잊어버렸다","없어서 곤란했다","도움을 받았다","친구와 함께했다","기다렸다","계획이 바뀌었다","칭찬을 받았다","문제가 생겼다","새로운 것을 했다","원하는 대로 되지 않았다","무언가를 찾았다","친구와 다퉜다","혼자 해냈다","직접 말하기"],slot:"event"},
 problemResult:{q:"그래서 어떤 일이 생겼어?",h:"문제 때문에 달라진 일을 찾아보자.",c:["할 수 없었다","잘 되지 않았다","시간이 더 걸렸다","다시 해야 했다","도움을 요청했다","친구에게 빌렸다","선생님께 말했다","그냥 계속했다"],slot:"result"},
 positiveDetail:{q:"무엇이 잘되게 도와줬어?",h:"잘된 이유나 내가 한 행동을 찾아보자.",c:["미리 준비했다","연습했다","도움을 받았다","끝까지 해봤다","친구와 함께했다","천천히 했다","내가 방법을 찾았다","직접 말하기"],slot:"cause"},
 neutralResult:{q:"그 다음에는 어떻게 되었어?",h:"바로 다음에 일어난 일을 생각해 보자.",c:["문제가 해결됐다","잘 되지 않았다","다시 해봤다","도움을 요청했다","기다렸다","기분이 좋아졌다","더 어려워졌다","직접 말하기"],slot:"result"},
 emotion:{q:"그때 어떤 기분이 들었어?",h:"기분은 하나가 아니어도 괜찮아.",c:["기뻤다","뿌듯했다","편안했다","놀랐다","당황했다","속상했다","걱정됐다","화가 났다"],slot:"emotion"},
 emotionCause:{q:"왜 그런 기분이 들었을까?",h:"내 마음의 이유를 한 번 더 생각해 보자.",c:["원하는 대로 돼서","생각과 달라서","잘할 수 있어서","잘하지 못해서","도움을 받아서","혼자 해결해서","갑자기 일어나서","직접 말하기"],slot:"emotionReason"},
 thought:{q:"이 일에서 어떤 생각이 들었어?",h:"맞고 틀린 답은 없어. 내가 든 생각을 고른다.",c:["다행이라고 생각했다","아쉽다고 생각했다","다시 해보고 싶었다","도움이 필요하다고 생각했다","내가 잘했다고 생각했다","다르게 해봐야겠다고 생각했다","더 알고 싶었다","직접 말하기"],slot:"thought"},
 next:{q:"다음에는 어떻게 하고 싶어?",h:"비슷한 일이 생기면 내가 할 수 있는 일을 생각해 보자.",c:["미리 준비하겠다","한 번 더 확인하겠다","도움을 요청하겠다","내 생각을 말하겠다","천천히 해보겠다","다시 도전하겠다","다른 방법을 찾아보겠다","직접 말하기"],slot:"next"},
 curiosityFocus:{q:"그것에서 무엇을 더 알고 싶어?",h:"궁금한 부분을 조금 더 자세히 생각해 보자.",c:["왜 그런지","어떻게 하는지","어디에 있는지","무엇을 먹는지","어떻게 생겼는지","언제 생겼는지","다른 것과 무엇이 다른지","직접 말하기"],slot:"question"},
 curiosityWhy:{q:"왜 그것이 궁금해졌어?",h:"궁금해진 계기를 떠올려 보자.",c:["책에서 봐서","영상에서 봐서","직접 봐서","수업에서 배워서","친구가 말해서","신기해서","좋아해서","잘 몰라서"],slot:"cause"},
 curiosityKnow:{q:"지금 알고 있는 것은 뭐야?",h:"조금만 알고 있어도 괜찮아.",c:["생김새를 안다","이름을 안다","사는 곳을 안다","하는 일을 안다","특징을 안다","들은 적이 있다","거의 모른다","직접 말하기"],slot:"known"},
 curiosityNext:{q:"어떻게 알아보고 싶어?",h:"내가 직접 알아볼 방법을 고른다.",c:["책을 찾아보겠다","검색해 보겠다","선생님께 묻겠다","가족에게 묻겠다","영상으로 보겠다","직접 관찰하겠다","친구와 이야기하겠다","다른 방법을 생각하겠다"],slot:"next"},
 interestWhy:{q:"어떤 점이 좋아?",h:"좋아하는 이유를 구체적으로 찾아보자.",c:["재미있어서","멋있어서","귀여워서","신기해서","편안해서","잘할 수 있어서","새로운 것을 알 수 있어서","직접 말하기"],slot:"reason"},
 interestDetail:{q:"그것을 할 때 무엇을 해?",h:"좋아하는 것을 실제 행동과 연결해 보자.",c:["자주 본다","직접 해본다","찾아본다","모은다","그린다","친구와 이야기한다","더 배우고 싶다","직접 말하기"],slot:"action"},
 interestThought:{q:"그것에 대해 더 하고 싶은 것은 뭐야?",h:"내 관심을 다음 생각으로 이어 보자.",c:["더 알아보고 싶다","더 잘하고 싶다","직접 해보고 싶다","다른 사람에게 알려주고 싶다","새로운 것을 찾아보고 싶다","계속 즐기고 싶다","관련된 곳에 가보고 싶다","직접 말하기"],slot:"next"},
 emotionEvent:{q:"무슨 일이 있어서 그렇게 느꼈어?",h:"기분보다 먼저 있었던 일을 찾아보자.",c:["잘한 일이 있었다","실수했다","원하는 대로 되지 않았다","칭찬을 받았다","친구와 일이 있었다","갑자기 바뀐 일이 있었다","기다려야 했다","직접 말하기"],slot:"event"}
};
function esc(v){return String(v||"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function home(){state={mode:"",node:"",answers:[],facts:{}};topBar.style.display="none";main.innerHTML='<section class="hero">'+H+'<div class="logo">생각을<br>문장으로</div><div class="speech">안녕! 오늘은 어떤 생각을 찾아볼까?<br>한 단어에서 시작해도 괜찮아.</div><div class="menu"><button class="btn primary" onclick="startMenu()">📖 이야기 만들기</button><button class="btn secondary" onclick="alert(\'나의 이야기장은 다음 개발 단계에서 연결됩니다.\')">📚 나의 이야기장</button></div></section>'}
function startMenu(){topBar.style.display="flex";bar.style.width="8%";main.innerHTML='<section class="card"><div class="question">어떤 생각에서 시작할까?</div><div class="help">시작점에 따라 고슴도치가 다른 질문을 한다.</div><div class="choices">'+START.map((x,i)=>'<button class="choice" onclick="pickStart('+i+')"><span class="icon">'+x[0]+'</span>'+x[1]+'</button>').join("")+'</div><div class="nav"><button class="btn ghost" onclick="home()">← 홈</button></div></section>'}
function pickStart(i){state.mode=START[i][2];state.node={event:"eventSeed",emotion:"emotionSeed",curiosity:"curiositySeed",interest:"interestSeed",free:"freeSeed"}[state.mode];render()}
function nextNode(node,value){
 if(node==="eventSeed"||node==="freeSeed") return "event";
 if(node==="emotionSeed") return "emotionEvent";
 if(node==="emotionEvent") return "emotionCause";
 if(node==="event"){if(/실수|잊|없어서|바뀌/.test(value))return "problemResult";if(/잘했다|도움을 받았다|함께/.test(value))return "positiveDetail";return "neutralResult"}
 if(["problemResult","positiveDetail","neutralResult"].includes(node))return "emotion";
 if(node==="emotion")return "emotionCause";
 if(node==="emotionCause")return "thought";
 if(node==="thought")return "next";
 if(node==="curiositySeed")return "curiosityFocus";
 if(node==="curiosityFocus")return "curiosityWhy";
 if(node==="curiosityWhy")return "curiosityKnow";
 if(node==="curiosityKnow")return "curiosityNext";
 if(node==="interestSeed")return "interestWhy";
 if(node==="interestWhy")return "interestDetail";
 if(node==="interestDetail")return "interestThought";
 return "finish";
}
function thoughtMap(){if(!state.answers.length)return "";return '<div class="thoughts"><b>🌱 지금까지 찾은 생각</b><div class="map">'+state.answers.map((a,i)=>'<span class="thought">'+esc(a.value)+'</span>'+(i<state.answers.length-1?'<span class="arrow">→</span>':"")).join("")+'</div></div>'}
function render(){const n=nodes[state.node];bar.style.width=Math.min(92,15+state.answers.length*13)+"%";const opts=n.c.filter(x=>x!=="직접 말하기");main.innerHTML='<section class="card"><div class="mascot-row"><div class="mini">'+H+'</div><div><div class="question">'+esc(n.q)+'</div><div class="help">먼저 내 생각을 직접 써 보자.</div></div></div><div class="tryfirst"><div class="trytitle">✏️ 내 생각 먼저 쓰기</div><div class="help" style="margin:0">한 단어나 짧은 말도 괜찮아.</div><div class="inputrow"><input id="custom" placeholder="여기에 내 생각을 써 봐"><button class="btn secondary" id="customBtn">말 더하기</button></div></div><div class="examples">💡 잘 모르겠으면 아래 예시를 참고해 봐</div><div class="choices">'+opts.map((x,i)=>'<button class="choice" data-i="'+i+'">'+esc(x)+'</button>').join("")+'</div>'+thoughtMap()+'<div class="nav"><button class="btn ghost" onclick="back()">← 이전</button><button class="btn ghost" onclick="skip()">잘 모르겠어</button></div></section>';document.querySelectorAll(".choice").forEach(b=>b.onclick=()=>choose(opts[+b.dataset.i]));document.querySelector("#customBtn").onclick=customAnswer}
function choose(v){if(v==="직접 말하기"){document.querySelector("#custom").focus();return}save(v)}
function customAnswer(){const v=document.querySelector("#custom").value.trim();if(v)save(v)}
function save(v){const n=nodes[state.node];state.answers.push({node:state.node,slot:n.slot,value:v});state.facts[n.slot]=v;const nx=nextNode(state.node,v);if(nx==="finish")finish();else{state.node=nx;render()}}
function skip(){const nx=nextNode(state.node,"");if(nx==="finish")finish();else{state.node=nx;render()}}
function back(){if(!state.answers.length){startMenu();return}const last=state.answers.pop();delete state.facts[last.slot];state.node=last.node;render()}
function sentence(v){v=String(v||"").trim().replace(/[.!?]+$/,"");return v?v+".":""}
function makeStory(){const f=state.facts,t=String(f.topic||"").trim(),a=[];
if(state.mode==="curiosity"){if(t)a.push("나는 "+t+"에 대해 궁금하다.");if(f.question)a.push(t+"에서 "+f.question+" 더 알고 싶다.");if(f.cause)a.push("궁금해진 이유는 "+f.cause+"이다.");if(f.next)a.push("앞으로 "+sentence(f.next));}
else if(state.mode==="interest"){if(t)a.push("나는 "+t+"을(를) 좋아한다.");if(f.reason)a.push("좋아하는 이유는 "+f.reason+"이다.");if(f.action)a.push("나는 "+sentence(f.action));if(f.next)a.push("앞으로 "+sentence(f.next));}
else{if(t&&f.event)a.push(t+"과(와) 관련해 "+sentence(f.event));else if(f.event)a.push(sentence(f.event));if(f.result)a.push("그 결과 "+sentence(f.result));else if(f.cause)a.push("그때 "+sentence(f.cause));if(f.emotion)a.push("그때 "+sentence(f.emotion));if(f.thought)a.push(sentence(f.thought));if(f.next)a.push("다음에는 "+sentence(f.next));}
return a.filter(Boolean).slice(0,4)}
function finish(){bar.style.width="100%";const story=makeStory();main.innerHTML='<section class="card"><div class="question">내 생각이 한 편의 글이 됐어!</div><div class="help">내가 고른 내용을 3~4문장으로 정리했다.</div>'+thoughtMap()+'<div class="result"><b>📝 나의 최종 문장</b><br><br>'+story.map(x=>'<div style="margin:9px 0">'+esc(x)+'</div>').join("")+'</div><div class="nav"><button class="btn ghost" onclick="back()">← 생각 고치기</button><button class="btn primary" onclick="home()">새 이야기 시작</button></div></section>'}
document.querySelector("#startBtn")?.addEventListener("click",startMenu);document.querySelector("#storyBtn")?.addEventListener("click",()=>alert("나의 이야기장은 다음 개발 단계에서 연결됩니다."));
</script></body></html>
