/* asset recovery: keep this app self-contained and retry images from the repository source if CDN deployment misses a binary asset */
(function(){
  const RAW='https://raw.githubusercontent.com/openmplus-stack/thejaram-game-project/main/games/sentence-builder-grade6/';
  function recover(img){
    if(!img || img.dataset.assetRecovery==='1') return;
    const src=img.getAttribute('src')||'';
    if(!src || /^data:|^blob:|^https:\/\/raw\.githubusercontent\.com/.test(src)) return;
    let rel=src.replace(/^\.\//,'');
    if(rel.startsWith('../munjang-talktalk/assets/')) rel='assets/'+rel.split('/assets/')[1];
    if(rel.startsWith('assets/')){
      img.dataset.assetRecovery='1';
      img.src=RAW+rel;
    }
  }
  document.addEventListener('error',e=>{ if(e.target && e.target.tagName==='IMG') recover(e.target); },true);
})();

 const main=a.destination||a.object;
 if(!main)return '';
 const parts=[];
 if(a.time)parts.push(String(a.time));
 if(a.subject)parts.push(verbFirstSubjectTextV3(a.subject));
 if(a.companion)parts.push(verbFirstCompanionTextV3(a.companion));
 if(a.place)parts.push(verbFirstPlaceTextV3(a.place));
 if(a.destination)parts.push(verbFirstDestinationTextV3(a.destination));
 else if(a.object)parts.push(verbFirstObjectTextV3(a.object));
 parts.push(grade6PastV5(verb));
 const story=[parts.filter(Boolean).join(' ')+'.'];
 if(a.reason)story.push(verbSentenceReasonV19(a.reason));
 if(a.thought)story.push(String(a.thought).replace(/[.]+$/,'')+'.');
 if(a.result)story.push(String(a.result).replace(/[.]+$/,'')+'.');
 if(a.feeling)story.push('기분은 '+String(a.feeling).replace(/[.]+$/,'')+'.');
 if(a.reaction)story.push(String(a.reaction).replace(/[.]+$/,'')+'.');
 return story.join(' ');
}

  if(VERB_COMM_EXTRA_V15[verb]&&VERB_COMM_CHOICES_V15[role])return VERB_COMM_CHOICES_V15[role].slice();
  if(VERB_EMOTION_EXTRA_V16[verb]&&VERB_EMOTION_CHOICES_V16[role])return VERB_EMOTION_CHOICES_V16[role].slice();
  if(VERB_EXEC_EXTRA_V17[verb]&&VERB_EXEC_CHOICES_V17[role])return VERB_EXEC_CHOICES_V17[role].slice();
  if(VERB_DEEP_EXTRA_V18[verb]&&VERB_DEEP_CHOICES_V18[role])return VERB_DEEP_CHOICES_V18[role].slice();
  if(VERB_AUDIT_CHOICES_V9[role])return VERB_AUDIT_CHOICES_V9[role].slice();
  if(VERB_Q_CHOICES_V8[role])return VERB_Q_CHOICES_V8[role].slice();
  if(VERB_EXPANSION_ANSWER_BANK_V7[role])return VERB_EXPANSION_ANSWER_BANK_V7[role].slice();
  const specific=VERB_SPECIFIC_CHOICES_V3[verb]&&VERB_SPECIFIC_CHOICES_V3[verb][role];
  if(VERB_FIRST_DEFINITIONS_V3[verb]?.extendedV5&&role==='object')return GRADE6_EXTENDED_OBJECTS_V5[VERB_FIRST_DEFINITIONS_V3[verb].group].slice();
  if(GRADE6_BASIC_V4.verbs[verb]&&role==='object')return GRADE6_BASIC_V4.choices[GRADE6_BASIC_V4.verbs[verb]].slice();
  if(GRADE6_BASIC_ROLE_CHOICES_V4[role])return GRADE6_BASIC_ROLE_CHOICES_V4[role].slice();
  if(Array.isArray(specific)&&specific.length)return specific.slice(0,12);

  if(role==='object'){
    if(verb==='마시다')return VERB_FIRST_CHOICES_V3.drink.slice();
    if(verb==='먹다')return VERB_FIRST_CHOICES_V3.food.slice();
    if(verb==='읽다')return VERB_FIRST_CHOICES_V3.reading.slice();
    if(verb==='쓰다')return VERB_FIRST_CHOICES_V3.writing.slice();
    if(verb==='만나다')return VERB_FIRST_CHOICES_V3.people.slice();
    return VERB_FIRST_CHOICES_V3.objectGeneral.slice();
  }

  if(role==='activity'||role==='nextAction'||role==='favorite')return VERB_FIRST_CHOICES_V3.activity.slice();
  if(role==='content')return VERB_FIRST_CHOICES_V3.thought.slice();
  if(role==='topic')return ['학교','가족','친구','고양이','강아지','여행','게임','책','운동','음식','꿈','주말'];

  const key=VERB_FIRST_ROLE_CHOICE_MAP_V3[role];
  const values=key&&VERB_FIRST_CHOICES_V3[key]?VERB_FIRST_CHOICES_V3[key]:VERB_SELECTION_FALLBACK_V10[role]||VERB_SELECTION_FALLBACK_V10.thought;
  return values.slice(0,12);
}

function verbFirstChoicePagesV3(verb,role){
  const raw=verbFirstChoicesForV3(verb,role)||[];
  const all=[...new Set(raw.map(v=>String(v||'').trim()).filter(Boolean))].slice(0,12);
  return {first:all.slice(0,6),more:all.slice(6,12)};
}

function verbFirstDefinitionV3(verb){
  return VERB_FIRST_DEFINITIONS_V3[String(verb||'').trim()]||null;

 return templates.map(([role,q])=>({role,q:q.replaceAll('{verb}',verbV7PolitePast(verb)),kind:'core'}));
}

function verbQuestionPlanV7(verb){
 const def=VERB_FIRST_DEFINITIONS_V3[verb];
 if(!def)return [];
 const family=VERB_FAMILY_BY_NAME_V7[verb]||'everyday';
 const core=verbAuditQuestionPlanV9(verb);
 const extra=((verb==='가다')?VERB_GO_EXTRA_V12:VERB_MOVE_EXTRA_V13[verb]||VERB_DAILY_EXTRA_V14[verb]||VERB_COMM_EXTRA_V15[verb]||VERB_EMOTION_EXTRA_V16[verb]||VERB_DEEP_EXTRA_V18[verb]||VERB_EXEC_EXTRA_V17[verb]||VERB_EXTRA_OVERRIDES_V8[verb]||VERB_EXPANSION_OVERRIDES_V7[verb]||VERB_EXPANSION_QUESTIONS_V7[family]).map(([role,q])=>({role,q,kind:'extension'}));
 return core.concat(extra);
}

function verbQuestionAuditV20(){
 const rows=GRADE6_GROUP_VERBS_V5.map(verb=>{
  const questions=verbQuestionPlanV7(verb);
  const problems=[];
  if(questions.length!==8)problems.push('question-count:'+questions.length);
  const seen=new Set();
  for(let i=0;i<questions.length;i++){
   const q=questions[i];
   if(!q.q||!q.role)problems.push('missing-question:'+i);
   if(seen.has(q.role))problems.push('duplicate-role:'+q.role);
   seen.add(q.role);
   const pages=verbFirstChoicePagesV3(verb,q.role);
   const choices=[...pages.first,...pages.more];
   if(choices.length!==12)problems.push('choice-count:'+q.role+':'+choices.length);
   if(new Set(choices).size!==choices.length)problems.push('repeated-options:'+q.role);
  }
  return {verb,questionCount:questions.length,problems};
 });
 return {total:rows.length,passed:rows.filter(r=>!r.problems.length).length,issues:rows.filter(r=>r.problems.length)};
}
function verbFirstQuestionPlanV3(verb){
  const def=verbFirstDefinitionV3(verb);
  if(!def)return [];
  return verbQuestionPlanV7(verb);
}

  const raw=String(value||'').trim().replace(/[.?!,]+$/,'');
  const key=PREDICATE_FRAMES_V2[raw]?raw:(PREDICATE_ALIASES_V2[raw]||raw);
  return PREDICATE_FRAMES_V2[key]||null;
}

function requiredRolesForV2(predicate){
  const frame=getPredicateFrameV2(predicate);
  return frame?frame.required.slice():[];
}

function nextRequiredRoleV2(event){
  const e=event||{};
  const frame=getPredicateFrameV2(e.predicate);
  if(!frame)return null;
  return frame.required.find(role=>{
    const v=e[role];
    return Array.isArray(v)?v.length===0:!v;
  })||null;
}

function semanticTypesForV2(value){
  const raw=String(value||'').trim().replace(/(은|는|이|가|을|를|에|에서|와|과|에게)$/,'');
  const types=[];
  Object.entries(SEMANTIC_LEXICON_V2).forEach(([type,words])=>{if(words.includes(raw))types.push(type)});
  return types;
}

function predicateCandidatesForNounV2(value){
  const raw=String(value||'').trim().replace(/(은|는|이|가|을|를|에|에서|와|과|에게)$/,'');
  return (NOUN_PREDICATE_LINKS_V2[raw]||[]).slice();
}

function isSemanticFitV2(predicate,role,value){
  const frame=getPredicateFrameV2(predicate);
  if(!frame||!frame.semantic||!frame.semantic[role])return true;
  const allowed=frame.semantic[role];
  const types=semanticTypesForV2(value);
  if(!types.length)return null;
  return types.some(t=>allowed.includes(t));
}

function meaningCandidatesV2(rawInput){
  const raw=String(rawInput||'').trim().replace(/[.?!,]+$/,'');
  if(!raw)return [];
  if(AMBIGUOUS_INPUT_HINTS_V2[raw])return AMBIGUOUS_INPUT_HINTS_V2[raw].slice();
  const predicates=predicateCandidatesForNounV2(raw);
  if(predicates.length){
    return predicates.slice(0,4).map(p=>{
      const f=getPredicateFrameV2(p);
      return f?raw+' + '+f.display:raw+' + '+p;
    });
  }
  return [];
}

  const raw=String(token||'').trim();
  const direct=getPredicateFrameV2(raw);
  if(direct)return {key:Object.keys(PREDICATE_FRAMES_V2).find(k=>PREDICATE_FRAMES_V2[k]===direct)||raw,frame:direct,confidence:1};
  const maps={
    '했어':'놀다','했다':'놀다','해':'놀다',
    '갔어':'가다','갔다':'가다',
    '먹었어':'먹다','먹었다':'먹다',
    '마셨어':'마시다','마셨다':'마시다',
    '읽었어':'읽다','읽었다':'읽다',
    '썼어':'쓰다','썼다':'쓰다',
    '놀았어':'놀다','놀았다':'놀다',
    '만났어':'만나다','만났다':'만나다',
    '줬어':'주다','주었어':'주다','주었다':'주다',
    '받았어':'받다','받았다':'받다',
    '만들었어':'만들다','만들었다':'만들다',
    '도왔어':'돕다','도와줬어':'돕다',
    '좋아':'좋아하다','좋아요':'좋아하다','좋다':'좋아하다',
    '좋아해':'좋아하다','좋아했어':'좋아하다','좋아한다':'좋아하다'
  };
  const key=maps[raw];
  return key?{key,frame:PREDICATE_FRAMES_V2[key],confidence:.85}:null;
}

function inferRoleCandidatesV2(tokens,predicateKey){
  const frame=getPredicateFrameV2(predicateKey);
  const candidates=[];
  tokens.forEach((token,index)=>{
    const types=semanticTypesForV2(token);
    const roleScores={};
    if(types.includes('person')){
      roleScores.subject=.55;
      if(frame&&frame.required.includes('recipient'))roleScores.recipient=.7;
      if(frame&&frame.required.includes('object')&&frame.semantic&&frame.semantic.object&&frame.semantic.object.includes('person'))roleScores.object=.72;
      if(frame&&frame.optional.includes('companion'))roleScores.companion=.68;
    }
    if(types.includes('place')){
      if(frame&&frame.required.includes('destination'))roleScores.destination=.82;
      if(frame&&frame.optional.includes('place'))roleScores.place=.72;
    }
    if(types.some(t=>['food','drink','reading','writing','thing','toy','sport','activity','craft','animal','topic'].includes(t))){
      if(frame&&frame.required.includes('object'))roleScores.object=.78;
      else roleScores.object=.52;
    }
    if(token==='나')roleScores.subject=.95;
    candidates.push({token,index,types,roleScores});
  });
  return candidates;
}

function detectAffectTokensV2(tokens){
  const emotionMap={
    '무서워':'무서웠다','무서웠어':'무서웠다','무섭다':'무서웠다',
    '좋아':'좋았다','좋았어':'좋았다','좋다':'좋았다',
    '싫어':'싫었다','싫었어':'싫었다','싫다':'싫었다',
    '기뻐':'기뻤다','기뻤어':'기뻤다',
    '슬퍼':'슬펐다','슬펐어':'슬펐다',
    '화나':'화가 났다','화났어':'화가 났다',
    '재밌어':'재미있었다','재미있어':'재미있었다',
    '재미있었어':'재미있었다',
    '궁금해':'궁금했다','궁금했어':'궁금했다'
  };
  return tokens.map((t,i)=>emotionMap[t]?{token:t,index:i,normalized:emotionMap[t]}:null).filter(Boolean);
}

function buildMeaningHypothesesV2(rawInput){
  const raw=String(rawInput||'').trim();
  const tokens=tokenizeMeaningInputV2(raw);
  const result={
    raw,
    tokens,
    status:'needs-meaning',
    predicate:null,
    roles:{},
    affect:detectAffectTokensV2(tokens),
    ambiguities:[],
    hypotheses:[],
    confidence:0
  };
  if(!tokens.length)return result;

  let predicateHit=null,predicateIndex=-1;
  for(let i=0;i<tokens.length;i++){
    const hit=predicateFromLooseTokenV2(tokens[i]);
    if(hit){predicateHit=hit;predicateIndex=i;break}
  }
  if(predicateHit){
    result.predicate=predicateHit.key;
    result.confidence=predicateHit.confidence;
  }

  const contentTokens=tokens.filter((_,i)=>i!==predicateIndex&&!result.affect.some(a=>a.index===i));
  if(predicateHit){
    const roleCandidates=inferRoleCandidatesV2(contentTokens,predicateHit.key);
    const used=new Set();
    const frame=predicateHit.frame;
    frame.required.forEach(role=>{
      let best=null;
      roleCandidates.forEach(c=>{
        if(used.has(c.index))return;
        const score=c.roleScores[role]||0;
        if(!best||score>best.score)best={c,score};
      });
      if(best&&best.score>=.65){
        result.roles[role]=best.c.token;used.add(best.c.index);
      }
    });
    contentTokens.forEach((t,i)=>{
      if(!used.has(i)){
        const types=semanticTypesForV2(t);
        if(types.includes('place')&&!result.roles.place&&!result.roles.destination){
          if(frame.required.includes('destination'))result.roles.destination=t;
          else result.roles.place=t;
        }else if(types.includes('person')&&!result.roles.subject){
          result.roles.subject=t;
        }else if(!result.roles.object&&types.length){
          result.roles.object=t;
        }
      }
    });

    // 한국어에서는 화자가 주어인 경우 주어를 자주 생략한다.
    // 다른 사람/동물이 주어라고 볼 근거가 없고, 필요한 나머지 역할이 잡혔다면 '나'를 보완한다.
    if(frame.required.includes('subject')&&!result.roles.subject){
      const explicitActor=contentTokens.some(t=>{
        const types=semanticTypesForV2(t);
        return types.includes('person') || (types.includes('animal') && !result.roles.object);
      });
      const otherRequired=frame.required.filter(role=>role!=='subject');
      const otherReady=otherRequired.every(role=>!!result.roles[role]);
      if(!explicitActor&&otherReady){
        result.roles.subject='나';
        result.inferredSubject=true;
      }
    }
  }

  if(!predicateHit){
    const singleHints=tokens.flatMap(t=>meaningCandidatesV2(t).map(x=>({token:t,text:x})));
    if(singleHints.length){
      result.hypotheses=singleHints.slice(0,6).map((x,i)=>({id:'h'+(i+1),text:x.text,sourceToken:x.token,confidence:.55}));
      result.ambiguities.push({type:'missing-predicate',message:'무엇을 했는지 조금 더 알려 주세요.'});
    }
  }else{
    const frame=predicateHit.frame;
    const missing=frame.required.filter(role=>!result.roles[role]);
    if(missing.length){
      missing.forEach(role=>result.ambiguities.push({
        type:'missing-role',
        role,
        message:(frame.questions&&frame.questions[role])||((MEANING_ROLES_V2[role]&&MEANING_ROLES_V2[role].label)||role)
      }));
    }
    const assigned=Object.entries(result.roles);
    assigned.forEach(([role,value])=>{
      const fit=isSemanticFitV2(predicateHit.key,role,value);
      if(fit===false){
        result.ambiguities.push({type:'semantic-mismatch',role,value,message:'“'+value+'”의 뜻이 이 행동과 잘 맞는지 확인해 주세요.'});
      }
    });
    if(!result.ambiguities.length){
      result.status='meaning-ready';
      result.confidence=Math.max(result.confidence,.8);
    }
  }

  if(result.affect.length&&!result.roles.emotion){
    result.roles.emotion=result.affect[0].normalized;
  }
  return result;
}

function meaningClarificationChoicesV2(analysis){
  const a=analysis||{};
  const choices=[];
  (a.ambiguities||[]).forEach(item=>{
    if(item.type==='missing-predicate'){
      (a.tokens||[]).forEach(t=>{
        meaningCandidatesV2(t).forEach(x=>choices.push({type:'predicate-or-event',label:x}));
      });
    }else if(item.type==='missing-role'&&a.predicate){
      const frame=getPredicateFrameV2(a.predicate);
      const role=item.role;
      const allowed=(frame&&frame.semantic&&frame.semantic[role])||[];
      Object.entries(SEMANTIC_LEXICON_V2).forEach(([type,words])=>{
        if(allowed.includes(type))words.slice(0,6).forEach(w=>choices.push({type:'role',role,label:w}));
      });
    }else if(item.type==='semantic-mismatch'){
      const preds=predicateCandidatesForNounV2(item.value);
      preds.slice(0,4).forEach(p=>{
        const f=getPredicateFrameV2(p);
        choices.push({type:'repair',role:item.role,label:item.value+' + '+(f?f.display:p)});
      });
    }
  });
  const seen=new Set();
  return choices.filter(x=>{const k=(x.role||'')+'|'+x.label;if(seen.has(k))return false;seen.add(k);return true}).slice(0,8);
}

function recordMeaningAnalysisV2(rawInput){
  const analysis=buildMeaningHypothesesV2(rawInput);
  storyV2.rawInputs.push({text:String(rawInput||''),at:new Date().toISOString()});
  storyV2.meanings.push(analysis);
  storyV2.learningLog.ambiguityChecks+=(analysis.ambiguities||[]).length;
  return analysis;
}


function stripRoleParticleV2(value){
  return String(value||'').trim().replace(/[.?!,]+$/,'').replace(/(은|는|이|가|을|를|에게|한테|와|과|랑|이랑|에|에서)$/,'');
}

function withRoleParticleV2(value,role){
  const w=stripRoleParticleV2(value);
  if(!w)return '';
  if(role==='subject')return w+(hasBatchim(w)?'이':'가');
  if(role==='object')return w+(hasBatchim(w)?'을':'를');
  if(role==='recipient')return w+'에게';
  if(role==='companion')return w+(hasBatchim(w)?'과':'와');
  if(role==='destination')return w+'에';
  if(role==='place')return w+'에서';
  return w;
}

function predicateDisplayV2(predicate){
  const frame=getPredicateFrameV2(predicate);
  return frame?frame.display:String(predicate||'');
}

function previewMeaningSentenceV2(predicate,roles){
  const r=roles||{};
  const p=predicateDisplayV2(predicate);
  const parts=[];
  if(r.time)parts.push(String(r.time));
  if(r.subject)parts.push(withRoleParticleV2(r.subject,'subject'));
  if(r.companion)parts.push(withRoleParticleV2(r.companion,'companion'));
  if(r.destination)parts.push(withRoleParticleV2(r.destination,'destination'));
  if(r.place)parts.push(withRoleParticleV2(r.place,'place'));
  if(r.recipient)parts.push(withRoleParticleV2(r.recipient,'recipient'));
  if(r.object)parts.push(withRoleParticleV2(r.object,'object'));
  if(r.manner)parts.push(String(r.manner));
  if(r.reason)parts.unshift(String(r.reason));
  parts.push(p);
  return parts.filter(Boolean).join(' ').replace(/\s+/g,' ').trim()+'.';
}

function cloneRolesV2(roles){
  return JSON.parse(JSON.stringify(roles||{}));
}

function pushMeaningCandidateV2(list,predicate,roles,reason,confidence){
  const text=previewMeaningSentenceV2(predicate,roles);
  if(!text||list.some(x=>x.text===text))return;
  list.push({
    id:'meaning-'+(list.length+1),
    predicate,
    roles:cloneRolesV2(roles),
    text,
    reason:reason||'가능한 뜻',
    confidence:Number(confidence||.5)
  });
}

function roleConfirmationCandidatesV2(analysis){
  const a=analysis||{};
  const predicate=a.predicate;
  const frame=getPredicateFrameV2(predicate);
  if(!predicate||!frame)return [];
  const base=cloneRolesV2(a.roles);
  const list=[];
  const tokens=(a.tokens||[]).map(stripRoleParticleV2).filter(Boolean);
  const people=tokens.filter(t=>semanticTypesForV2(t).includes('person'));
  const objects=tokens.filter(t=>semanticTypesForV2(t).some(type=>['food','drink','reading','writing','thing','toy','sport','activity','craft','animal','topic'].includes(type)));

  // 현재 분석 결과를 첫 후보로 둔다. 빠진 주어만 있으면 화자 '나'를 임시 후보로 보완한다.
  const current=cloneRolesV2(base);
  if(frame.required.includes('subject')&&!current.subject)current.subject='나';
  const currentMissing=frame.required.filter(role=>!current[role]);
  if(!currentMissing.length){
    pushMeaningCandidateV2(list,predicate,current,'입력한 말의 가장 가까운 뜻',.78);
  }

  // 주다/받다는 행위자와 상대가 뒤바뀌기 쉬우므로 방향을 반드시 확인한다.
  if(predicate==='주다'){
    const person=people[0]||base.recipient||base.subject;
    const thing=base.object||objects[0];
    if(person&&thing){
      pushMeaningCandidateV2(list,'주다',{subject:'나',recipient:person,object:thing},'내가 그 사람에게 준 뜻',.72);
      pushMeaningCandidateV2(list,'주다',{subject:person,recipient:'나',object:thing},'그 사람이 나에게 준 뜻',.72);
    }
  }
  if(predicate==='받다'){
    const person=people[0]||base.recipient||base.subject;
    const thing=base.object||objects[0];
    if(person&&thing){
      pushMeaningCandidateV2(list,'받다',{subject:'나',recipient:person,object:thing},'내가 그 사람에게서 받은 뜻',.72);
      pushMeaningCandidateV2(list,'받다',{subject:person,recipient:'나',object:thing},'그 사람이 나에게서 받은 뜻',.62);
    }
  }

  // 사람 대상 동사는 '내가 그 사람을' / '그 사람이 나를' 두 방향을 확인한다.
  if(['만나다','돕다','좋아하다'].includes(predicate)&&people.length){
    const person=people[0];
    pushMeaningCandidateV2(list,predicate,{...base,subject:'나',object:person},'내가 그 사람에게 한 뜻',.7);
    pushMeaningCandidateV2(list,predicate,{...base,subject:person,object:'나'},'그 사람이 나에게 한 뜻',.62);
  }

  // 장소+감정처럼 동사가 빠진 입력은 사건과 감정을 분리하는 후보를 만든다.
  const emotion=(a.affect&&a.affect[0])?a.affect[0].normalized:(base.emotion||'');
  const place=tokens.find(t=>semanticTypesForV2(t).includes('place'));
  if(emotion&&place&&!list.some(x=>x.roles&&x.roles.destination===place)){
    pushMeaningCandidateV2(list,'가다',{subject:'나',destination:place},'그 장소에 간 사건',.48);
  }

  return list.slice(0,4);
}

function concreteClarificationPromptV2(analysis){
  const a=analysis||{};
  const rawTokens=(a.tokens||[]).filter(Boolean);
  if(!a.predicate&&rawTokens.length===1){
    return '“'+rawTokens[0]+'”에 대해 무엇을 말하고 싶어요?';
  }
  const first=(a.ambiguities||[])[0];
  if(first&&first.message)return first.message;
  if(!a.predicate)return '무엇을 했는지 써 주세요.';
  const frame=getPredicateFrameV2(a.predicate);
  if(frame){
    const missing=frame.required.find(role=>!(a.roles||{})[role]);
    if(missing&&frame.questions&&frame.questions[missing])return frame.questions[missing];
  }
  return '조금 더 써 주세요.';
}

function alternateMeaningCandidatesV2(analysis,currentCandidates=[]){
  const a=analysis||{};
  const seen=new Set((currentCandidates||[]).map(x=>normalizeMeaningText(x.text||x.label||'')));
  const list=[];
  const addText=(text,reason='다른 가능한 뜻')=>{
    const key=normalizeMeaningText(text);
    if(!text||seen.has(key)||list.some(x=>normalizeMeaningText(x.text)===key))return;
    list.push({id:'alt-'+(list.length+1),text,reason,rawOnly:true});
  };

  (a.tokens||[]).forEach(token=>{
    const raw=stripRoleParticleV2(token);
    const hints=AMBIGUOUS_INPUT_HINTS_V2[raw]||[];
    hints.forEach(x=>addText(x,'같은 말에서 생각할 수 있는 다른 뜻'));
    const preds=predicateCandidatesForNounV2(raw);
    preds.forEach(p=>{
      const f=getPredicateFrameV2(p);
      if(!f)return;
      if(semanticTypesForV2(raw).includes('place')&&p==='가다')addText('나는 '+raw+'에 '+f.display+'.');
      else if(semanticTypesForV2(raw).includes('place'))addText('나는 '+raw+'에서 '+f.display+'.');
      else addText('나는 '+withRoleParticleV2(raw,'object')+' '+f.display+'.');
    });
  });

  return list.slice(0,6);
}

function analysisFromAlternativeTextV2(text){
  const raw=String(text||'').replace(/[.?!]+$/,'').trim();
  return buildMeaningHypothesesV2(raw);
}

function clarificationModelV2(rawInput){
  const analysis=typeof rawInput==='string'?buildMeaningHypothesesV2(rawInput):(rawInput||{});
  const roleCandidates=roleConfirmationCandidatesV2(analysis);
  const lexicalChoices=meaningClarificationChoicesV2(analysis);
  const hasSentenceCandidate=roleCandidates.length>0;
  return {
    title:hasSentenceCandidate?'혹시 이런 뜻이에요?':concreteClarificationPromptV2(analysis),
    instruction:hasSentenceCandidate
      ?'맞으면 문장을 눌러 주세요. 아니면 ‘다른 뜻 보기’를 눌러 주세요.'
      :'아래 보기에서 고르거나 직접 말해 주세요.',
    analysis,
    sentenceCandidates:roleCandidates,
    wordChoices:lexicalChoices,
    allowOther:true,
    otherLabel:'다른 뜻 보기',
    allowTyped:true,
    typedLabel:'내가 다시 말할게요'
  };
}

function applyMeaningCandidateV2(candidate){
  if(!candidate)return null;
  const event={
    id:'event-'+(storyV2.events.length+1),
    predicate:candidate.predicate,
    ...cloneRolesV2(candidate.roles),
    source:'meaning-confirmation',
    confirmed:true
  };
  storyV2.events.push(event);
  storyV2.expression.selected=candidate.text||previewMeaningSentenceV2(candidate.predicate,candidate.roles);
  storyV2.learningLog.meaningRepairs+=1;
  return event;
}

function confirmRoleValueV2(event,role,value,source='choice'){
  if(!event||!role)return event;
  event[role]=stripRoleParticleV2(value);
  event.confirmedRoles=event.confirmedRoles||{};
  event.confirmedRoles[role]={value:event[role],source};
  return event;
}

function inferredSubjectFromInputV2(event,analysis){
  if(!event||event.subject)return event;
  const tokens=((analysis&&analysis.tokens)||[]).map(stripRoleParticleV2).filter(Boolean);
  const people=tokens.filter(t=>semanticTypesForV2(t).includes('person'));
  if(people.length===0){
    event.subject='나';
    event.confirmedRoles=event.confirmedRoles||{};
    event.confirmedRoles.subject={value:'나',source:'implied-korean-subject'};
  }
  return event;
}

function roleChoicePoolV2(event,role){
  const frame=getPredicateFrameV2(event&&event.predicate);
  const allowed=(frame&&frame.semantic&&frame.semantic[role])||[];
  let words=[];
  if(role==='subject'){
    words=[...SEMANTIC_LEXICON_V2.person,...SEMANTIC_LEXICON_V2.animal];
  }else if(role==='recipient'||role==='companion'){
    words=[...SEMANTIC_LEXICON_V2.person];
  }else if(role==='destination'||role==='place'){
    words=[...SEMANTIC_LEXICON_V2.place];
  }else{
    allowed.forEach(type=>{words.push(...(SEMANTIC_LEXICON_V2[type]||[]))});
    if(!words.length&&role==='object'){
      ['food','drink','reading','writing','thing','toy','sport','activity','craft','animal','topic'].forEach(type=>words.push(...(SEMANTIC_LEXICON_V2[type]||[])));
    }
  }
  return [...new Set(words)].filter(Boolean);
}

function roleQuestionV2(event,role){
  const frame=getPredicateFrameV2(event&&event.predicate);
  if(frame&&frame.questions&&frame.questions[role])return frame.questions[role];
  return (MEANING_ROLES_V2[role]&&MEANING_ROLES_V2[role].label)||'조금 더 알려 주세요.';
}

function renderRequiredRoleOrCoreV2(event,analysis){
  if(!event)return renderMeaningStartV2();
  inferredSubjectFromInputV2(event,analysis);
  const nextRole=nextRequiredRoleV2(event);
  if(nextRole){renderRequiredRoleV2(event,nextRole);return}
  renderCoreSentenceV2(event);
}

function renderRequiredRoleV2(event,role){
  stepText.textContent='한 가지만 더';
  bar.style.width='42%';
  const all=roleChoicePoolV2(event,role);

  const firstCount=level===1?6:level===2?4:0;
  const first=firstCount?all.slice(0,firstCount):[];
  const extra=firstCount?all.slice(firstCount,firstCount+12):all.slice(0,12);
  const question=roleQuestionV2(event,role);

  card.innerHTML=`
    <h1>${escapeHtml(question)}</h1>
    <p class="help">지금 문장에 꼭 필요한 것 하나만 더 알려 주세요.</p>
    ${first.length?`
      <div class="choices" id="roleFirstChoicesV2">
        ${first.map(v=>`<button type="button" class="choice role-choice-v2" data-v="${escapeHtml(v)}">${escapeHtml(v)}</button>`).join('')}
      </div>
      <div style="margin-top:12px">
        <button type="button" class="btn reveal-examples" id="roleMoreV2">+ 다른 보기</button>
      </div>
      <div class="choices extra" id="roleExtraChoicesV2" hidden>
        ${extra.map(v=>`<button type="button" class="choice role-choice-v2" data-v="${escapeHtml(v)}">${escapeHtml(v)}</button>`).join('')}
      </div>
    `:''}
    <div class="custom" style="margin-top:14px">
      <label for="roleTypedV2">✏️ 내가 직접 쓰기</label>

function withTopicParticleV2(value){
  const w=stripRoleParticleV2(value);
  if(!w)return '';
  return w+(hasBatchim(w)?'은':'는');
}

function composeEventSentenceV2(event,options={}){
  const e=event||{};
  const parts=[];
  const subjectMode=options.subjectMode||'topic';
  const omitSubject=!!options.omitSubject;
  const frontPlace=!!options.frontPlace;

  if(e.reason)parts.push(String(e.reason));
  if(e.time)parts.push(String(e.time));
  if(frontPlace){
    if(e.destination)parts.push(withRoleParticleV2(e.destination,'destination'));
    if(e.place)parts.push(withRoleParticleV2(e.place,'place'));
  }

  if(e.subject&&!omitSubject){
    parts.push(subjectMode==='focus'?withRoleParticleV2(e.subject,'subject'):withTopicParticleV2(e.subject));
  }

  if(e.companion)parts.push(withRoleParticleV2(e.companion,'companion'));

  if(!frontPlace){
    if(e.destination)parts.push(withRoleParticleV2(e.destination,'destination'));
    if(e.place)parts.push(withRoleParticleV2(e.place,'place'));
  }

  if(e.recipient)parts.push(withRoleParticleV2(e.recipient,'recipient'));
  if(e.object)parts.push(withRoleParticleV2(e.object,'object'));
  if(e.manner)parts.push(String(e.manner));
  parts.push(predicateDisplayV2(e.predicate));

  return parts.filter(Boolean).join(' ').replace(/\s+/g,' ').trim().replace(/[.?!]+$/,'')+'.';
}

function naturalSentenceCandidatesV2(event){
  const list=[];
  const push=(text,label)=>{
    if(!text||list.some(x=>x.text===text))return;
    list.push({text,label});
  };

  push(composeEventSentenceV2(event,{subjectMode:'topic'}),'가장 자연스러운 기본 표현');
  push(composeEventSentenceV2(event,{subjectMode:'focus'}),'누가 했는지 또렷하게 말하는 표현');

  const subject=stripRoleParticleV2(event&&event.subject);
  if(subject==='나'){
    push(composeEventSentenceV2(event,{omitSubject:true}),'주어를 자연스럽게 생략한 표현');
  }else if(event&&(event.place||event.destination)){
    push(composeEventSentenceV2(event,{subjectMode:'topic',frontPlace:true}),'장소를 먼저 말하는 표현');
  }

  return list.slice(0,3);
}

function inheritEventContextV2(previous,next){
  const prev=previous||{},n=next||{};

  if(!n.place&&prev.place)n.place=prev.place;
  if(!n.destination&&prev.destination&&!n.place)n.place=prev.destination;
  return n;
}

    if(/(했다|났다|됐다|있었다|없었다|웠다|았다|었다)$/.test(v))return '나는 '+v+'.';
    return '나는 '+v+'고 느꼈다.';

  if(kind==='thought'){
    if(/생각했다$/.test(v))return '나는 '+v+'.';
    return '나는 '+v+'고 생각했다.';
  }
  return v+'.';
}

const SAFE_CORRECTION_RULES_V2=[
  {type:'spelling',from:/버수/g,to:'버스',label:'맞춤법'},
  {type:'spelling',from:/뻐스/g,to:'버스',label:'맞춤법'},
  {type:'spelling',from:/선생임/g,to:'선생님',label:'맞춤법'},
  {type:'spelling',from:/선생닝/g,to:'선생님',label:'맞춤법'},
  {type:'spelling',from:/먹엇/g,to:'먹었',label:'활용'},
  {type:'spelling',from:/마셧/g,to:'마셨',label:'활용'},
  {type:'spelling',from:/읽엇/g,to:'읽었',label:'활용'},
  {type:'spelling',from:/햇/g,to:'했',label:'활용'},
  {type:'spacing',from:/배가고파/g,to:'배가 고파',label:'띄어쓰기'},
  {type:'spacing',from:/목이말라/g,to:'목이 말라',label:'띄어쓰기'},
  {type:'spacing',from:/화가나/g,to:'화가 나',label:'띄어쓰기'}
];

function safeCorrectionV2(text){
  let out=String(text||'').trim();
  const changes=[];
  SAFE_CORRECTION_RULES_V2.forEach(rule=>{
    const before=out;
    out=out.replace(rule.from,rule.to);
    if(out!==before)changes.push({level:'safe',type:rule.type,label:rule.label,before,after:out});
  });
  out=out.replace(/\s+/g,' ').trim();
  if(out && !/[.?!]$/.test(out))out+='.';
  return {text:out,changes};
}

function semanticSuggestionChangesV2(original,polished){
  const safe=safeCorrectionV2(original).text;
  if(!polished||safe===polished)return [];
  return [{
    level:'choice',
    type:'expression',
    label:'표현 다듬기',
    before:safe,
    after:polished,
    reason:'조사·어순·문장 구성을 더 자연스럽게 만든 표현입니다. 뜻이 같은지 확인한 뒤 선택해 주세요.'
  }];
}

function correctionPlanV2(original,polished){
  const safe=safeCorrectionV2(original);
  return {
    original:String(original||''),
    safeText:safe.text,
    safeChanges:safe.changes,
    suggestedChanges:semanticSuggestionChangesV2(original,polished),
    polished:String(polished||'')
  };
}

function originalExpressionV2(){
  return (storyV2.rawInputs||[])
    .map(x=>String((x&&x.text)||'').trim())
    .filter(Boolean)
    .join(' / ');
}

function tokenizeForCompareV2(text){
  return String(text||'')
    .replace(/[.?!]/g,'')
    .split(/\s+/)
    .map(x=>x.trim())
    .filter(Boolean);
}

function diffWordsV2(original,polished){
  const a=tokenizeForCompareV2(original);
  const b=tokenizeForCompareV2(polished);
  const rows=[];
  const max=Math.max(a.length,b.length);
  for(let i=0;i<max;i++){
    const before=a[i]||'';
    const after=b[i]||'';
    rows.push({before,after,changed:before!==after});
  }
  return rows;
}

function renderDiffLineV2(original,polished){
  const rows=diffWordsV2(original,polished);
  if(!rows.length)return '';
  return rows.map(r=>{
    const shown=r.after||r.before;
    if(!shown)return '';
    return r.changed
      ?'<span style="display:inline-block;padding:3px 6px;margin:2px;border-radius:8px;background:#fff2b8"><b>'+escapeHtml(shown)+'</b></span>'
      :'<span style="display:inline-block;padding:3px 4px;margin:2px">'+escapeHtml(shown)+'</span>';
  }).join(' ');
}

function detailedFirstSentenceV2(){

function confirmedMeaningSummaryV2(){
  const first=(storyV2.events||[]).find(e=>e&&e.confirmed);
  if(!first)return '';
  const frame=getPredicateFrameV2(first.predicate);
  const labels=[];
  if(first.subject)labels.push('누가: '+stripRoleParticleV2(first.subject));
  if(first.object)labels.push('무엇을: '+stripRoleParticleV2(first.object));
  if(first.recipient)labels.push('누구에게: '+stripRoleParticleV2(first.recipient));
  if(first.destination)labels.push('어디에: '+stripRoleParticleV2(first.destination));
  if(first.place)labels.push('어디에서: '+stripRoleParticleV2(first.place));
  if(frame)labels.push('행동: '+predicateDisplayV2(first.predicate));
  return labels.join(' · ');
}

function commitV2Story(finalText){
  const text=String(finalText||storyV2.expression.selected||'').trim();
  if(!text)return {ok:false,error:'empty'};

  if(!state||typeof state!=='object')state={};
  if(!Array.isArray(state.sentences))state.sentences=[];
  if(!Array.isArray(state.fishInventory))state.fishInventory=[];
  if(!Array.isArray(state.treasures))state.treasures=[];
  if(!Array.isArray(state.specialPenguins))state.specialPenguins=[];

  const normalized=normalizeMeaningText(text);
  const existing=state.sentences.find(x=>x&&typeof x.text==='string'&&normalizeMeaningText(x.text)===normalized);
  if(existing)return {ok:true,duplicate:true,fish:0,persisted:true,reward:null,rewardType:null};

  let grade=1;
  try{grade=drawFishGrade()}catch(_){grade=1}

  let reward=null,rewardType=null;
  const roll=Math.random();
  if(roll<.18){
    const locked=treasurePool.filter(x=>!state.treasures.includes(x));
    if(locked.length){
      reward=locked[Math.floor(Math.random()*locked.length)];
      rewardType='treasure';
      state.treasures.push(reward);
    }
  }else if(roll<.23){
    const locked=specialPool.filter(x=>!state.specialPenguins.includes(x));
    if(locked.length){
      reward=locked[Math.floor(Math.random()*locked.length)];
      rewardType='penguin';
      state.specialPenguins.push(reward);
    }
  }

  const snapshot=snapshotStoryV2();
  const kind=(storyV2.events||[]).filter(e=>e&&e.confirmed).length>1?'story':'sentence';
  state.sentences.push({
    text,
    kind,
    at:new Date().toISOString(),
    version:2,
    original:snapshot.original,
    growthSteps:snapshot.growthSteps,
    storyData:snapshot
  });

  state.fishInventory.push(grade);
  state.fish=state.fishInventory.length;

  let persisted=false;
  try{
    localStorage.setItem(STORE_KEY,JSON.stringify(state));
    persisted=true;
  }catch(err){
    console.error('v2 save failed',err);
    return {ok:false,error:'storage',persisted:false};
  }

  try{updateUI()}catch(err){console.warn(err)}
  return {ok:true,duplicate:false,fish:1,fishGrade:grade,reward,rewardType,persisted};
}

function verbFirstSubjectTextV3(value){

  const bare=v=>v.replace(/(은|는|이|가)$/,'');
  if(people.length===1){
    const raw=people[0];
    if(raw==='나')return '나는';
    if(raw==='우리 가족')return '우리 가족은';
    if(/(은|는|이|가)$/.test(raw))return raw;
    return raw+(hasBatchim(raw)?'이':'가');
  }
  const names=people.map(p=>p==='나'?'나':bare(p));
  const linked=names.map((p,i)=>i===names.length-1?p:p+(hasBatchim(p)?'과':'와')).join(' ');

}

  if(a.reason&&!(v==='주다'&&a.reason==='재미있어서')&&!VERB_FIRST_DEFINITIONS_V3[v]?.extendedV5)coreParts.push(verbFirstReasonTextV3(a.reason));
  if(time)coreParts.push(time);
  if(subject)coreParts.push(subject);
  if(companion)coreParts.push(companion);
  if(place)coreParts.push(place);
  if(destination)coreParts.push(destination);
  if(source)coreParts.push(source);
  if(recipient)coreParts.push(recipient);

  let coreReady=false;

  if(isBasicExtra){
    const predicate=verbFirstPredicatePastV3(v);
    const ready=!!(a.object||a.place||a.destination);
    if(ready){
      if(v==='내리다'&&a.object)coreParts.push(verbFirstPlaceTextV3(a.object));
      else if(object)coreParts.push(object);
      coreParts.push(predicate);coreReady=true
    }
  }else if(v==='가다'){
    if(destination){coreParts.push('갔다');coreReady=true}
  }else if(v==='놀다'){
    if(a.activity){
      coreParts.push(String(a.activity).replace(/[.]+$/,'')+'을 하며 놀았다');
      coreReady=true;
    }
  }else if(v==='좋아하다'){
    if(object){coreParts.push(object,'좋아한다');coreReady=true}
  }else if(['보다','먹다','마시다','읽다','쓰다','만나다','주다','받다','만들다'].includes(v)){
    if(object){
      if(v==='만들다'&&a.material)coreParts.push(String(a.material).replace(/[.]+$/,'')+'으로');
      coreParts.push(object,verbFirstPredicatePastV3(v));
      coreReady=true;
    }
  }

  const sentences=[];
  if(coreReady){
    let core=coreParts.filter(Boolean).join(' ').replace(/\s+/g,' ').trim();
    if(core&&!/[.!?]$/.test(core))core+='.';
    sentences.push(core);
  }

  const objectRaw=String(a.object||'').trim();

  if(a.observation)sentences.push('걷다가 '+String(a.observation).replace(/[.]+$/,'')+'을 보았다.');
  if(a.nextAction){
    const action=normalizeShortActionV3(a.nextAction);
    const actor=a.nextActionSubject?subjectPhraseForNextActionV3(a.nextActionSubject):'';
    let text=((actor?actor+' ':'')+action).replace(/\s+/g,' ').trim();
    if(text&&!/[.!?]$/.test(text))text+='.';
    if(text)sentences.push(text);
  }

  if(a.taste){
    const taste=String(a.taste).replace(/[.]+$/,'').trim();
    const target=objectRaw||'그것';
    let text=target+(hasBatchim(target)?'은':'는')+' '+taste;
    if(text&&!/[.!?]$/.test(text))text+='.';
    sentences.push(text);
  }

  if(a.method&&v==='도와주다')sentences.push(String(a.method).replace(/[.]+$/,'')+'.');
  if(a.result&&v==='정리하다')sentences.push('정리하고 나서 '+String(a.result).replace(/[.]+$/,'')+'.');
  if(a.feeling){
    let text='기분은 '+String(a.feeling).replace(/[.]+$/,'').trim();
    if(text&&!/[.!?]$/.test(text))text+='.';
    sentences.push(text);
  }

  if(a.thought){
    let text=String(a.thought).replace(/[.]+$/,'').trim();
    if(text&&!/[.!?]$/.test(text))text+='.';
    sentences.push(text);
  }

  if(a.reaction){
    const who=v==='주다'&&a.recipient?verbFirstTopicV3(a.recipient):'받은 사람은';
    const response=String(a.reaction).replace(/[.]+$/,'').trim();
    let text=who+' '+(response==='고맙다고 했다'?'고맙다고 인사했다':response);
    if(text&&!/[.!?]$/.test(text))text+='.';
    sentences.push(text);
  }

  if(a.result&&v==='만들다'){
    let text='완성한 것은 '+String(a.result).replace(/[.]+$/,'').trim();
    if(text&&!/[.!?]$/.test(text))text+='.';
    sentences.push(text);
  }

  if(a.feature&&v==='좋아하다'){
    let text='좋아하는 점은 '+String(a.feature).replace(/[.]+$/,'').trim();
    if(text&&!/[.!?]$/.test(text))text+='.';
    sentences.push(text);
  }

  if(a.favorite){
    let text=String(a.favorite).replace(/[.]+$/,'').trim()+'이 가장 재미있었다.';
    sentences.push(text);
  }

  if(a.content){
    let text='기억나는 내용은 '+String(a.content).replace(/[.]+$/,'').trim();
    if(text&&!/[.!?]$/.test(text))text+='.';
    sentences.push(text);
  }

  if(a.topic&&v==='쓰다'){
    let text=String(a.topic).replace(/[.]+$/,'').trim()+'에 대해 썼다.';
    sentences.push(text);
  }

  if(a.method&&v==='만들다'){
    let text=String(a.method).replace(/[.]+$/,'').trim();
    if(text&&!/[.!?]$/.test(text))text+='.';
    sentences.push(text);
  }

  if(a.activity&&v==='좋아하다'){
    let text=String(a.activity).replace(/[.]+$/,'').trim();
    if(text&&!/[.!?]$/.test(text))text+='.';
    sentences.push(text);
  }

  verbFirstStateV3.sentence=verbV7CombineSentence(sentences.filter(Boolean).join(' '),a);
  return verbFirstStateV3.sentence;
}

function normalizeShortActionV3(value){
  const raw=String(value||'').trim().replace(/[.?!]+$/,'');
  const map={
    '달렸어':'달렸다','달렸다':'달렸다','뛰었어':'뛰었다','뛰었다':'뛰었다',
    '사진을 찍었어':'사진을 찍었다','사진 찍었어':'사진을 찍었다','사진을 찍었다':'사진을 찍었다',
    '놀았어':'놀았다','놀았다':'놀았다','먹었어':'먹었다','먹었다':'먹었다',
    '마셨어':'마셨다','마셨다':'마셨다','집에 갔어':'집에 갔다','집에 갔다':'집에 갔다',
    '안았어':'안았다','안았다':'안았다','만졌어':'만졌다','만졌다':'만졌다',
    '도망갔어':'도망갔다','도망갔다':'도망갔다','따라갔어':'따라갔다','따라갔다':'따라갔다'
  };
  return map[raw]||raw.replace(/했어$/,'했다').replace(/었어$/,'었다').replace(/았어$/,'았다');
}

function shortActionNeedsSubjectV3(value){
  const raw=String(value||'').trim();
  if(!raw)return false;
  // 주어 표지가 이미 있으면 다시 묻지 않는다.
  if(/(^|\s)(나는|내가|엄마가|아빠가|친구가|선생님이|강아지가|고양이가|동생이|형이|누나가|할머니가|할아버지가|우리가|우리 가족이)(\s|$)/.test(raw))return false;
  if(/(은|는|이|가)\s/.test(raw))return false;
  const actionHints=['달렸','뛰었','찍었','놀았','먹었','마셨','갔','왔','안았','만졌','도망갔','따라갔','주었','받았','만들었'];
  return actionHints.some(x=>raw.includes(x));
}

function makeAdaptiveClarificationV3(question,value){
  if(!question)return null;
  if(question.kind==='next-event'&&shortActionNeedsSubjectV3(value)){
    return {
      role:'nextActionSubject',
      q:'누가 '+normalizeShortActionV3(value).replace(/다$/,'어요?'),
      fallbackQ:'누가 그 행동을 했어요?',
      sourceRole:question.role,
      value:String(value||'').trim()
    };
  }
  return null;
}

function subjectPhraseForNextActionV3(value){
  let raw=String(value||'').trim().replace(/[.?!]+$/,'');
  if(!raw)return '';
  raw=raw
    .replace(/^나랑\s*/,'나와 ')
    .replace(/^나하고\s*/,'나와 ')
    .replace(/\s*랑\s*/g,'와 ')
    .replace(/\s*하고\s*/g,'와 ');
  if(raw==='나')return '나는';
  if(raw.includes('와 ')){
    raw=raw.replace(/(이|가|은|는)$/,'');
    return raw+'가 함께';
  }
  if(/(이|가|은|는)$/.test(raw))return raw;
  return raw+(hasBatchim(raw)?'이':'가');
}

function verbFirstPreviewV11(verb,answers,completed){
 if(completed)return completed;
 const a=answers||{};
 const subject=a.subject?verbFirstSubjectTextV3(a.subject):'';
 const verbEnding=verbFirstPredicatePastV3(verb);
 const predicate=verbEnding!==verb?verbEnding:grade6PastV5(verb);
 const pieces=[];
 if(a.time)pieces.push(String(a.time));
 if(subject)pieces.push(subject);
 if(a.companion)pieces.push(verbFirstCompanionTextV3(a.companion));
 if(a.place)pieces.push(verbFirstPlaceTextV3(a.place));
 if(a.destination)pieces.push(verbFirstDestinationTextV3(a.destination));
 if(a.object)pieces.push(verbFirstObjectTextV3(a.object));
 return [...pieces,predicate].filter(Boolean).join(' ')+'.';
}

function renderVerbQuestionV3(){
  if(verbFirstStateV3.pendingClarification)return renderAdaptiveClarificationV3();
  const verb=verbFirstStateV3.verb;
  const plan=verbFirstQuestionPlanV3(verb);
  const step=verbFirstStateV3.step;
  if(!verb||!plan.length)return renderVerbSelectV3();
  if(step>=plan.length)return renderVerbResultV3();

  const q=plan[step];
  const pages=verbFirstChoicePagesV3(verb,q.role);
  const sentence=verbFirstBuildSentenceV3();
  const preview=verbFirstPreviewV11(verb,verbFirstStateV3.answers,sentence);
  const subjectMulti=q.role==='subject';
  let currentSelection='';
  const picked=subjectMulti?(Array.isArray(verbFirstStateV3.answers.subject)?verbFirstStateV3.answers.subject:[]):[];
  const choiceButtons=arr=>arr.map(v=>`<button type="button" class="choice verb-answer-v3 ${subjectMulti&&picked.includes(v)?'subject-picked-v3':''}" aria-pressed="${subjectMulti&&picked.includes(v)?'true':'false'}" data-v="${escapeHtml(v)}">${escapeHtml(v)}</button>`).join('');
  stepText.textContent=(step+1)+' / '+plan.length;
  bar.style.width=(((step+1)/plan.length)*100)+'%';

  card.innerHTML=`
    <h1>${escapeHtml(q.q)}</h1>
    <div class="story-two" style="margin:12px 0;min-height:74px"><b>📝 ${escapeHtml(preview)}</b></div>

      </div>

        ${choiceButtons(pages.more)}

    `:''}

    ${!subjectMulti?`<button type="button" class="btn next" id="verbConfirmV3" disabled style="width:100%;margin-top:14px">확인</button>`:''}
    ${subjectMulti?`<p class="help" style="margin-top:12px"></p><button type="button" class="btn next" id="verbSubjectNextV3" ${picked.length?'':'disabled'}>확인 (${picked.length})</button>`:''}

    <div class="actions" style="margin-top:18px">
      <button type="button" class="btn" id="verbBackV3">${step===0?'처음부터':'이전'}</button>
      <button type="button" class="btn" id="verbSkipV3">건너뛰기</button>
      <button type="button" class="btn next" id="verbFinishV3" ${sentence?'':'disabled'}>완료</button>
    </div>
    <div style="clear:both"></div>
  `;

  const accept=(value,source)=>{
    const clean=String(value||'').trim();
    if(!clean)return;
    if(subjectMulti){
      const old=Array.isArray(verbFirstStateV3.answers.subject)?verbFirstStateV3.answers.subject.slice():[];
      if(!old.includes(clean))old.push(clean);
      verbFirstStateV3.answers.subject=old;
    }else verbFirstStateV3.answers[q.role]=clean;
    verbFirstStateV3.history.push({step,verb,role:q.role,q:q.q,value:clean,source});
    verbFirstBuildSentenceV3();
    if(subjectMulti){renderVerbQuestionV3();return;}
    verbFirstStateV3.step+=1;
    const adaptive=makeAdaptiveClarificationV3(q,clean);
    if(adaptive)verbFirstStateV3.pendingClarification=adaptive;
    renderVerbQuestionV3();
  };

  card.querySelectorAll('.verb-answer-v3').forEach(b=>b.onclick=()=>{
    if(subjectMulti){
      const v=b.dataset.v;
      const list=Array.isArray(verbFirstStateV3.answers.subject)?verbFirstStateV3.answers.subject.slice():[];
      const at=list.indexOf(v);
      if(at>=0)list.splice(at,1);else list.push(v);
      verbFirstStateV3.answers.subject=list;
      card.querySelectorAll('.verb-answer-v3').forEach(x=>{const on=list.includes(x.dataset.v);x.classList.toggle('subject-picked-v3',on);x.setAttribute('aria-pressed',String(on))});
      const next=card.querySelector('#verbSubjectNextV3');if(next){next.disabled=!list.length;next.textContent='확인 ('+list.length+')';}
    }else{
      currentSelection=b.dataset.v;
      card.querySelectorAll('.verb-answer-v3').forEach(x=>{const on=x===b;x.classList.toggle('subject-picked-v3',on);x.setAttribute('aria-pressed',String(on))});
      const confirm=card.querySelector('#verbConfirmV3');if(confirm)confirm.disabled=false;

    }
  });
  const confirm=card.querySelector('#verbConfirmV3');if(confirm)confirm.onclick=()=>accept(currentSelection,'choice');
  const subjectNext=card.querySelector('#verbSubjectNextV3');
  if(subjectNext)subjectNext.onclick=()=>{if(!(verbFirstStateV3.answers.subject||[]).length)return;verbFirstStateV3.step+=1;renderVerbQuestionV3()};
  const more=card.querySelector('#verbMoreV3');
  if(more)more.onclick=()=>{
    card.querySelector('#verbFirstChoices2V3').hidden=false;
    more.textContent='− 접기';more.setAttribute('aria-expanded','true');
    more.onclick=()=>{card.querySelector('#verbFirstChoices2V3').hidden=true;more.textContent='＋ 더 보기';more.setAttribute('aria-expanded','false');more.onclick=()=>{card.querySelector('#verbFirstChoices2V3').hidden=false;more.textContent='− 접기';more.setAttribute('aria-expanded','true')}};
  };
  card.querySelector('#verbSkipV3').onclick=()=>{delete verbFirstStateV3.answers[q.role];verbFirstStateV3.step+=1;renderVerbQuestionV3()};
  card.querySelector('#verbFinishV3').onclick=()=>{if(verbFirstBuildSentenceV3())renderVerbResultV3()};
  card.querySelector('#verbBackV3').onclick=()=>{
    if(step===0)return renderVerbSelectV3();
    verbFirstStateV3.step=Math.max(0,step-1);
    renderVerbQuestionV3();
  };
}

    storyV2.support.usedTyping=true;
    const analysis=recordMeaningAnalysisV2(raw);
    const complete=completeMeaningCandidateV2(analysis);
    if(complete){
      const event=applyMeaningCandidateV2(complete);
      renderMeaningConfirmedV2(event);
      return;
    }
    renderMeaningClarificationV2(analysis);
  };
  card.querySelector('#meaningAnalyzeV2').onclick=go;
  input.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();go()}});
  card.querySelectorAll('.meaning-example-v2').forEach(b=>b.onclick=()=>{input.value=b.dataset.v;go()});
}

function mergeClarificationInputV2(analysis,typed){
  const base=String((analysis&&analysis.raw)||'').trim();
  const add=String(typed||'').trim();
  if(!base)return add;
  if(!add)return base;
  if(normalizeMeaningText(base).includes(normalizeMeaningText(add)))return base;
  return (base+' '+add).replace(/\s+/g,' ').trim();
}

function completeMeaningCandidateV2(analysis){
  if(!analysis||!analysis.predicate)return null;
  const frame=getPredicateFrameV2(analysis.predicate);
  if(!frame)return null;
  const roles=cloneRolesV2(analysis.roles);
  const missing=frame.required.filter(role=>!roles[role]);
  if(missing.length)return null;
  return {
    id:'complete-typed',
    predicate:analysis.predicate,
    roles,
    text:previewMeaningSentenceV2(analysis.predicate,roles),
    reason:'입력한 뜻',
    confidence:analysis.confidence||.8
  };
}

function renderMeaningClarificationV2(analysis,options={}){
  stepText.textContent='뜻 확인';
  bar.style.width='24%';

  const model=clarificationModelV2(analysis);
  let candidates=model.sentenceCandidates||[];

  if(!analysis.predicate){
    const rawHints=(analysis.hypotheses||[]).map((x,i)=>({
      id:'hint-'+i,
      text:x.text,
      reason:'이런 뜻으로 말할 수 있어요.',
      rawOnly:true
    }));
    if(rawHints.length)candidates=rawHints;
    if(!candidates.length)candidates=alternateMeaningCandidatesV2(analysis,[]);
  }

  if(!candidates.length && analysis.status==='meaning-ready'){
    candidates=[{
      id:'meaning-ready-1',
      predicate:analysis.predicate,
      roles:cloneRolesV2(analysis.roles),
      text:previewMeaningSentenceV2(analysis.predicate,analysis.roles),
      reason:'입력한 뜻',
      confidence:analysis.confidence||.8
    }];
  }

  const showChoices=!!options.showChoices;
  const question=concreteClarificationPromptV2(analysis);
  const wordChoices=(model.wordChoices||[]).slice(0,8);

  card.innerHTML=`
    <h1>${escapeHtml(question)}</h1>
    <p class="help">생각나는 말을 써서 <b>입력</b>을 누르세요. 잘 모르겠으면 <b>보기</b>를 눌러도 돼요.</p>

    <div class="custom">
      <label for="meaningMoreInputV2">✏️ 내가 말하기</label>
      <div class="custom-row">
        <input id="meaningMoreInputV2" placeholder="여기에 써 주세요" autocomplete="off">
        <button type="button" class="btn add" id="meaningMoreAddV2">입력</button>
      </div>
    </div>

    <div style="margin-top:12px">
      <button type="button" class="btn reveal-examples" id="meaningShowChoicesV2">${showChoices?'보기 닫기':'보기'}</button>
    </div>

    <div id="meaningChoicesBoxV2" ${showChoices?'':'hidden'} style="margin-top:12px">
      ${candidates.length?`
        <div class="story-two">
          ${candidates.slice(0,6).map((x,i)=>`
            <button type="button" class="choice meaning-sentence-choice-v2" data-i="${i}" style="display:block;width:100%;margin:8px 0;text-align:left">
              <b>${escapeHtml(x.text)}</b>
            </button>
          `).join('')}
        </div>`:''}

      ${wordChoices.length?`
        <div class="examples-panel" style="margin-top:10px">
          <div class="choices">
            ${wordChoices.map((x,i)=>`<button type="button" class="choice meaning-word-choice-v2" data-i="${i}">${escapeHtml(x.label)}</button>`).join('')}
          </div>
        </div>`:''}

      ${!candidates.length&&!wordChoices.length?'<p class="help">보기가 없어요. 위 칸에 직접 써 주세요.</p>':''}
    </div>

    <div class="actions" style="margin-top:18px">
      <button type="button" class="btn" id="meaningBackV2">이전</button>
    </div>
    <div style="clear:both"></div>
  `;

  const input=card.querySelector('#meaningMoreInputV2');
  const submitTyped=()=>{
    const typed=(input.value||'').trim();
    if(!typed)return;
    storyV2.support.usedTyping=true;
    const merged=mergeClarificationInputV2(analysis,typed);
    const nextAnalysis=recordMeaningAnalysisV2(merged);
    const complete=completeMeaningCandidateV2(nextAnalysis);
    if(complete){
      const event=applyMeaningCandidateV2(complete);
      renderMeaningConfirmedV2(event);
      return;
    }
    renderMeaningClarificationV2(nextAnalysis);
  };
  card.querySelector('#meaningMoreAddV2').onclick=submitTyped;
  input.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();submitTyped()}});

  card.querySelector('#meaningShowChoicesV2').onclick=()=>{
    renderMeaningClarificationV2(analysis,{showChoices:!showChoices});
  };

  card.querySelectorAll('.meaning-sentence-choice-v2').forEach(b=>b.onclick=()=>{
    const chosen=candidates[Number(b.dataset.i)];
    if(!chosen)return;
    if(chosen.rawOnly){
      const nextAnalysis=recordMeaningAnalysisV2(chosen.text);
      renderMeaningClarificationV2(nextAnalysis);
      return;
    }
    const event=applyMeaningCandidateV2(chosen);
    renderMeaningConfirmedV2(event);
  });

  card.querySelectorAll('.meaning-word-choice-v2').forEach(b=>b.onclick=()=>{
    const chosen=wordChoices[Number(b.dataset.i)];
    if(!chosen)return;
    if(chosen.type==='role'&&chosen.role&&analysis.predicate){
      analysis.roles=analysis.roles||{};
      analysis.roles[chosen.role]=chosen.label;
      const eventCandidate={
        predicate:analysis.predicate,
        roles:cloneRolesV2(analysis.roles),
        text:previewMeaningSentenceV2(analysis.predicate,analysis.roles),
        reason:'선택한 뜻'
      };
      const frame=getPredicateFrameV2(analysis.predicate);
      const missing=frame?frame.required.filter(r=>!analysis.roles[r]):[];
      if(!missing.length){
        const event=applyMeaningCandidateV2(eventCandidate);
        renderMeaningConfirmedV2(event);
      }else{
        renderMeaningClarificationV2(analysis);
      }
      return;
    }
    if(chosen.label){
      const nextAnalysis=recordMeaningAnalysisV2(mergeClarificationInputV2(analysis,chosen.label));
      renderMeaningClarificationV2(nextAnalysis);
    }
  });

  card.querySelector('#meaningBackV2').onclick=renderMeaningStartV2;
}

function renderMeaningConfirmedV2(event){
  stepText.textContent='뜻 확인 완료';
  bar.style.width='32%';
  const sentence=event?previewMeaningSentenceV2(event.predicate,event):'';
  card.innerHTML=`
    <h1>이 뜻이 맞아요.</h1>
    <p class="help">이제 이 뜻을 바탕으로 자연스러운 문장을 만들어 갈 거예요.</p>
    <div class="story-two" style="margin-top:12px">
      <div style="font-size:1.25em"><b>${escapeHtml(sentence)}</b></div>

      <button type="button" class="btn" id="meaningBackV2">뜻 다시 고르기</button>

    <div style="clear:both"></div>
  `;

    renderRequiredRoleOrCoreV2(event,latest);
  };
}

  fish:Number.isFinite(Number(x.fish))?Math.max(0,Number(x.fish)):0,

 }

function ensureFishInventory(){
 if(!Array.isArray(state.fishInventory))state.fishInventory=[];
 state.fishInventory=state.fishInventory.map(Number).filter(n=>n>=1&&n<=10);
 const missing=Math.max(0,(Number(state.fish)||0)-state.fishInventory.length);
 for(let i=0;i<missing;i++)state.fishInventory.push(1);
 state.fish=state.fishInventory.length;
}
function drawFishGrade(){
 const r=Math.random();
 if(r<.40)return 1;if(r<.62)return 2;if(r<.76)return 3;if(r<.85)return 4;if(r<.91)return 5;
 if(r<.95)return 6;if(r<.975)return 7;if(r<.99)return 8;if(r<.997)return 9;return 10;
}

 ensureFishInventory();
 const total=document.getElementById('fishInventoryTotal'),track=document.getElementById('fishInventoryTrack');
 if(total)total.textContent=state.fishInventory.length;if(!track)return;
 const counts=Array(10).fill(0);state.fishInventory.forEach(g=>counts[g-1]++);
 const owned=counts.map((qty,i)=>({grade:i+1,qty})).filter(x=>x.qty>0);
 if(!owned.length){track.innerHTML='<div class="fish-empty">아직 보관한 물고기가 없어요.<br>새 문장을 완성하면 물고기를 받을 수 있어요.</div>';return}
 track.innerHTML=owned.map(x=>`<div class="fish-card"><span class="fish-qty">×${x.qty}</span><img src="assets/fish/${fishFiles[x.grade-1]}" alt="${x.grade}등급 물고기" onerror="this.style.display='none';this.nextElementSibling.style.display='block'"><span class="fish-fallback" style="display:none">🐟</span><div class="fish-grade">${x.grade}등급</div></div>`).join('');

function bindFishInventoryDrag(){
 const el=document.getElementById('fishInventoryViewport');if(!el||el.dataset.dragBound)return;el.dataset.dragBound='1';
 let down=false,startX=0,startScroll=0,moved=false;
 el.addEventListener('pointerdown',e=>{down=true;moved=false;startX=e.clientX;startScroll=el.scrollLeft;el.classList.add('dragging');try{el.setPointerCapture(e.pointerId)}catch(_){}});
 el.addEventListener('pointermove',e=>{if(!down)return;const dx=e.clientX-startX;if(Math.abs(dx)>4)moved=true;el.scrollLeft=startScroll-dx});
 const end=e=>{down=false;el.classList.remove('dragging');try{el.releasePointerCapture(e.pointerId)}catch(_){}};
 el.addEventListener('pointerup',end);el.addEventListener('pointercancel',end);el.addEventListener('pointerleave',e=>{if(down&&e.buttons===0)end(e)});
 el.addEventListener('click',e=>{if(moved){e.preventDefault();e.stopPropagation()}},true);
}

function normalizeMeaningText(text){
 return String(text||'').toLowerCase().replace(/[\s.,!?'"“”‘’]/g,'').replace(/(은|는|이|가|을|를|에서|에)$/,'');
}
function grantCompletionReward(text,kind='sentence'){
 const normalized=normalizeMeaningText(text);
 const existing=state.sentences.find(x=>normalizeMeaningText(x.text)===normalized);
 if(existing)return {duplicate:true,fish:0,reward:null,rewardType:null};
 state.sentences.push({text,kind,at:new Date().toISOString()});state.fish+=1;
 let reward=null,rewardType=null,roll=Math.random();
 if(roll<.18){let locked=treasurePool.filter(x=>!state.treasures.includes(x));if(locked.length){reward=locked[Math.floor(Math.random()*locked.length)];rewardType='treasure';state.treasures.push(reward)}}
 else if(roll<.23){let locked=specialPool.filter(x=>!state.specialPenguins.includes(x));if(locked.length){reward=locked[Math.floor(Math.random()*locked.length)];rewardType='penguin';state.specialPenguins.push(reward)}}
 saveState();return {duplicate:false,fish:1,reward,rewardType}
}
function rewardSentence(sentence){return grantCompletionReward(sentence,'sentence')}
function rewardSummary(r){
 if(!r)return '';
 if(r.duplicate)return '이 글은 이미 저장되어 있어요. 같은 글에는 보상을 다시 주지 않아요.';
 let s='🐟 '+(r.fishGrade?r.fishGrade+'등급 ':'')+'물고기 1마리를 받았어요!';
 if(r.rewardType==='treasure')s+='<br>🎁 이야기 보물을 발견했어요: '+escapeHtml(r.reward);
 if(r.rewardType==='penguin')s+='<br>🐧 특별 펭귄을 만났어요!';
 return s
}

function contextItems(s){
 const all=[...s.items,...s.examples];
 if(s.key==='object'){
  const placeRule=ans.place&&placeObjectRules.find(r=>r.test.test(ans.place));
  const subjectRule=ans.subject&&subjectObjectRules.find(r=>r.test.test(ans.subject));
  let preferred=[];
  if(placeRule&&subjectRule){
   const overlap=placeRule.objects.filter(x=>subjectRule.objects.includes(x));
   preferred=[...overlap,...placeRule.objects.filter(x=>!overlap.includes(x)),...subjectRule.objects.filter(x=>!overlap.includes(x))];
  }else if(placeRule)preferred=placeRule.objects;
  else if(subjectRule)preferred=subjectRule.objects;
  preferred=[...new Set(preferred)].filter(x=>all.includes(x));
  if(preferred.length)return {main:preferred.slice(0,10),extra:all.filter(x=>!preferred.includes(x)),matched:true,restricted:false}
 }
 if(s.key==='predicate'&&ans.object){
  const rule=objectActionRules.find(r=>r.test.test(stripParticle(ans.object)));
  if(rule){const valid=rule.actions.filter(x=>all.includes(x));return {main:valid,extra:all.filter(x=>!valid.includes(x)),matched:true,restricted:true}}
 }
 if(s.key==='reason'&&ans.predicate){
  const rule=actionReasonRules.find(r=>r.test.test(ans.predicate));
  if(rule){const first=rule.reasons.filter(x=>all.includes(x));return {main:first,extra:all.filter(x=>!first.includes(x)),matched:true,restricted:false}}
 }
 return {main:s.items,extra:s.examples,matched:false,restricted:false}
}

function spellingSuggestion(value){
 const raw=String(value||'').trim();if(!raw)return null;
 if(commonSpellingCorrections[raw])return commonSpellingCorrections[raw];
 // 문장/구 안에서도 자주 나타나는 명확한 오류만 제안한다. 이름·새 단어는 임의 교정하지 않는다.
 for(const [wrong,right] of Object.entries(commonSpellingCorrections)){
  if(raw.includes(wrong)){const fixed=raw.replace(wrong,right);if(fixed!==raw)return fixed}
 }
 return null
}

function editDistance(a,b){
 a=String(a||'');b=String(b||'');const d=Array.from({length:a.length+1},()=>Array(b.length+1).fill(0));
 for(let i=0;i<=a.length;i++)d[i][0]=i;for(let j=0;j<=b.length;j++)d[0][j]=j;
 for(let i=1;i<=a.length;i++)for(let j=1;j<=b.length;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));
 return d[a.length][b.length]
}
function stepVocabulary(key){

function nearestKnownWord(raw,key){
 const word=stripParticle(cleanToken(raw));if(!word||word.length<2)return raw;
 const manual={'버수':'버스','뻐스':'버스','교가서':'교과서','교가서':'교과서','학꾜':'학교','칭구':'친구','선생임':'선생님','우유룰':'우유','채':'책'};
 if(manual[word])return manual[word];
 let best=null,score=99;for(const v of stepVocabulary(key)){const base=stripParticle(v),n=editDistance(word,base);if(n<score){score=n;best=base}}
 return score===1&&best?best:raw
}

function polishStory(lines){

  if(i>0&&/^나는\s+/.test(s))s=s.replace(/^나는\s+/,'');
  // 연결어가 중복된 경우 하나만 남긴다.

function commitSentence(sentence){
 const text=String(sentence||'').trim();
 if(!text)return {ok:false,error:'empty'};
 // 핵심 완료 처리: 다른 기능에 의존하지 않는다.
 if(!state||typeof state!=='object')state={};
 if(!Array.isArray(state.sentences))state.sentences=[];
 if(!Array.isArray(state.fishInventory))state.fishInventory=[];
 if(!Array.isArray(state.treasures))state.treasures=[];
 if(!Array.isArray(state.specialPenguins))state.specialPenguins=[];
 const key=text.replace(/\s+/g,'').replace(/[.?!]/g,'');
 const duplicate=state.sentences.some(x=>x&&typeof x.text==='string'&&x.text.replace(/\s+/g,'').replace(/[.?!]/g,'')===key);
 if(duplicate)return {ok:true,duplicate:true,fish:0,persisted:true};
 let grade=1;try{grade=drawFishGrade()}catch(_){}
 state.sentences.push({text,kind:'sentence',at:new Date().toISOString()});
 state.fishInventory.push(grade);
 state.fish=state.fishInventory.length;
 let persisted=false;
 try{localStorage.setItem(STORE_KEY,JSON.stringify(state));persisted=true}catch(_){}
 return {ok:true,duplicate:false,fish:1,fishGrade:grade,persisted}
}
function bindFinishedButtons(sentence){
 const back=document.getElementById('back'),complete=document.getElementById('completeSentence');
 if(back)back.onclick=()=>{idx=steps.length-1;render()};
 if(!complete)return;
 complete.onclick=()=>{
   complete.disabled=true;
   const status=document.getElementById('completeStatus');
   let result;
   try{result=commitSentence(sentence)}catch(err){console.error(err);result={ok:false}}
   if(!result||!result.ok){
     complete.disabled=false;
     if(status)status.textContent='저장하지 못했어요. 다시 눌러 주세요.';
     return;
   }
   if(result.duplicate){
     if(status)status.innerHTML='📖 이미 나의 문장 사전에 저장된 문장이에요.';
   }else{
     if(status)status.innerHTML='✅ 문장을 완료했어요.<br>🐟 '+result.fishGrade+'등급 물고기 1마리를 받았어요!<br>📖 나의 문장 사전에 저장했어요.';
   }
   complete.textContent='✓ 완료됨';
   const after=document.getElementById('afterComplete');if(after)after.style.display='block';
   try{updateUI()}catch(err){console.warn(err)}
   const extend=document.getElementById('extend'),again=document.getElementById('again');
   if(extend)extend.onclick=()=>showExtension(sentence);
   if(again)again.onclick=()=>{idx=0;ans={};expanded={};storyDraft=[];render()};
 }
}

let lastEatingVoice=-1;
const eatingVoices=['냠냠~','냠!','음~ 맛있다!','아~ 맛있어!','냠냠냠~','맛있다~','또 먹고 싶어!'];
function playEatingVoice(){
 if(!('speechSynthesis' in window))return '';
 let choices=eatingVoices.map((v,i)=>({v,i})).filter(x=>x.i!==lastEatingVoice);
 let pick=choices[Math.floor(Math.random()*choices.length)];lastEatingVoice=pick.i;
 try{
   speechSynthesis.cancel();
   const u=new SpeechSynthesisUtterance(pick.v);u.lang='ko-KR';u.rate=.92;u.pitch=1.35;u.volume=1;
   const voices=speechSynthesis.getVoices();const ko=voices.find(v=>/^ko/i.test(v.lang));if(ko)u.voice=ko;
   speechSynthesis.speak(u);
 }catch(_){}
 return pick.v;
}
