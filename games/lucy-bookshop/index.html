const KEY='lucy-bookshop-save-v1';
const TALES=['금도끼 은도끼','흥부와 놀부','해와 달이 된 오누이','도깨비 방망이','선녀와 나무꾼','팥죽 할멈과 호랑이','혹부리 영감','토끼와 자라','콩쥐 팥쥐','견우와 직녀'];
const INTRO=['낯선 골목을 걷던 루시는 아주 작은 책방을 발견했어요. 낡은 간판에는 「수상한 책방」이라고 적혀 있었지요.','문을 열자 책들이 스스로 꿈틀거렸어요. "거기 서!" 늙은 검은 고양이가 책장 위에서 소리쳤어요.','그때 반짝이는 무언가가 책에서 튀어나왔어요. 알록달록한 복주머니가 펄쩍 뛰어올라 그것을 꿀꺽 삼켰지요.','"복딱! 또 너무 크게 삼켰잖아!" 고양이가 투덜거렸어요. 루시는 깜짝 놀라 가슴의 오래된 펜던트를 붙잡았어요.','고양이는 펜던트를 보고 눈을 크게 떴어요. "그 목걸이… 어디서 났지?" 루시가 대답하기도 전에 다른 물건이 책 밖으로 도망쳤어요.','"이야기들이 사라지고 있어!" 복딱이 말했어요. "우리와 함께 찾아줄래?" 이제 루시의 모험이 시작됩니다.'];
const EPISODES=[

{icon:'🐦',scene:[['다친 제비','흥부가 다친 제비를 정성껏 돌보았어요.','흥부는 제비를 도와주었어요.'],['제비의 선물','제비가 흥부에게 작은 씨앗을 선물하려고 해요.','제비는 작은 씨앗을 가져오려고 해요.'],['빈 제비의 부리','제비가 돌아왔지만 선물이 보이지 않아요.','사라진 선물이 무엇인지 추리해요.']],target:'박씨',places:['공원','원예 상점']},
{icon:'🐯',scene:[['호랑이의 발자국','호랑이가 오누이를 쫓고 있어요.','호랑이가 오누이를 쫓아요.'],['하늘에 도움 요청','오누이가 하늘에 도움을 청했어요. 튼튼한 줄이 내려와야 해요.','하늘에서 튼튼한 줄이 내려와야 해요.'],['텅 빈 하늘','아무리 기다려도 줄이 내려오지 않아요.','사라진 것을 추리해요.']],target:'동아줄',places:['문화체험관','공원']},
{icon:'👹',scene:[['도깨비들의 잔치','도깨비들이 신비한 물건을 가지고 놀고 있어요.','도깨비는 신비한 물건을 사용해요.'],['마법의 주문','도깨비가 방망이를 두드리자 마법이 일어났어요.','방망이가 마법을 일으켜요.'],['멈춘 마법','주문을 외워도 마법이 일어나지 않아요.','사라진 물건을 추리해요.']],target:'도깨비 방망이',places:['박물관','문화체험관']},
{icon:'🪽',scene:[['숲속의 연못','선녀들이 특별한 옷을 입고 하늘에서 내려왔어요.','선녀들은 특별한 옷을 입어요.'],['돌아갈 시간','선녀가 하늘로 돌아가려면 날개옷이 필요해요.','날개옷이 있어야 돌아갈 수 있어요.'],['사라진 옷','선녀가 날개옷을 찾지 못하고 있어요.','사라진 옷을 추리해요.']],target:'날개옷',places:['한복·공예점','박물관']},
{icon:'🥣',scene:[['팥죽 끓이는 날','할머니가 팥죽을 끓이는데 호랑이가 찾아왔어요.','호랑이가 할머니를 위협해요.'],['작은 친구들의 약속','알밤을 비롯한 친구들이 할머니를 돕기로 했어요.','알밤은 할머니를 돕기로 했어요.'],['비어 있는 자리','친구들이 모였지만 알밤이 보이지 않아요.','사라진 친구를 추리해요.']],target:'알밤',places:['전통시장','공원']},
{icon:'🎵',scene:[['숲속의 노랫소리','혹이 있는 영감이 숲에서 노래를 불렀어요.','영감에게 혹이 있어요.'],['도깨비의 오해','도깨비는 혹에 노래가 들어 있다고 생각했어요.','도깨비는 혹을 가져가려 해요.'],['빈 보따리','도깨비가 혹을 가져가려는데 혹이 보이지 않아요.','사라진 것을 추리해요.']],target:'혹',places:['문화체험관','분실물 보관소']},
{icon:'🐢',scene:[['용궁의 걱정','용왕이 병들어 토끼를 찾아야 한다고 해요.','용궁에서는 토끼를 찾아야 해요.'],['육지로 갈 사신','자라가 육지에 가서 토끼를 만나기로 했어요.','자라는 육지와 용궁을 오가는 사신이에요.'],['떠나지 못한 사신','자라를 부르지만 어디에도 보이지 않아요.','사라진 사신을 추리해요.']],target:'자라',places:['생태공원','야생동물 구조센터']},
{icon:'🐸',scene:[['어려운 심부름','콩쥐가 밑 빠진 독에 물을 붓고 있어요.','독에 구멍이 있어 물이 새요.'],['작은 도움','두꺼비가 독의 구멍을 막아 주려고 해요.','두꺼비는 독의 구멍을 막아요.'],['다시 새는 물','구멍을 막아 줄 두꺼비가 보이지 않아요.','사라진 친구를 추리해요.']],target:'두꺼비',places:['공원','생태공원']},
{icon:'🌌',scene:[['은하수 양쪽','견우와 직녀가 은하수 양쪽에서 서로를 그리워해요.','두 사람 사이에는 은하수가 있어요.'],['다리를 만드는 새들','까치와 까마귀가 모여 오작교를 놓으려 해요.','특별한 까치가 다리 놓기를 이끌어요.'],['끊어진 다리','다리를 이끌던 까치가 보이지 않아 다리가 이어지지 않아요.','사라진 새를 추리해요.']],target:'특별한 까치',places:['공원','생태공원']}
];
const DEFAULT={page:'start',uiLanguage:'ko',topik:'unknown',diagnostic:'later',prologueIndex:0,restoredIds:[],selectedBook:null,episodeProgress:{},inventory:{}};
let s;try{s={...DEFAULT,...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch{s={...DEFAULT}};if(!s.episodeProgress||typeof s.episodeProgress!=='object')s.episodeProgress={};if(!s.inventory||typeof s.inventory!=='object')s.inventory={};
const view=document.getElementById('view');
const esc=x=>String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const save=()=>localStorage.setItem(KEY,JSON.stringify(s));
function set(p){Object.assign(s,p);save();render()}
function go(p){set({page:p})}
function newGame(){if(Object.keys(s.episodeProgress).length&&!confirm('새 모험을 시작하면 이전 진행 기록이 초기화됩니다. 계속할까요?'))return;s={...DEFAULT,page:'setup'};save();render()}
function progress(i){return s.episodeProgress[i]||{phase:'story',scene:0,clues:[],location:0}}
function updateProgress(i,patch){s.episodeProgress[i]={...progress(i),...patch};save();render()}
function book(i){missionSelection='';set({page:'book',selectedBook:i})}

function nextScene(){missionSelection='';const i=s.selectedBook,p=progress(i);if(p.phase!=='story')return;if(!allTasksDone(i,p.scene)){alert('네 가지 미션을 모두 완료해 주세요.');return;}const scene=Math.min(2,Math.max(0,p.scene));if(scene<2){const clue='A'.charCodeAt(0)+scene;const id=String.fromCharCode(clue);updateProgress(i,{scene:scene+1,clues:[...new Set([...(p.clues||[]),id])]})}else{updateProgress(i,{phase:'modern',scene:2,clues:['A','B'],location:0});go('modern')}}

function modernNext(){const i=s.selectedBook,p=progress(i);if(!p.placeChosen){alert('장소를 먼저 선택해 주세요.');return;}if(p.location<EPISODES[i].places.length-1)updateProgress(i,{location:p.location+1,placeChosen:false});else{updateProgress(i,{phase:'investigate'});go('deduce')}}

function clueStrip(i){const pieces=[0,1,2].map(n=>{const c=clueOf(i,n),known=completedClue(i,n);return '<div class="clue-piece"><strong>장면 '+(n+1)+'</strong><div class="clue-letter">'+(known?esc(c.initials):'？')+'</div><small>'+(known?'획득한 초성':'아직 미획득')+'</small></div>'}).join('');return '<section class="clue-strip"><h3>🔎 사라진 이름의 초성</h3><p>각 장면의 미션을 완료하고 초성을 모아 보세요.</p><div class="clue-pieces">'+pieces+'</div><p class="small-note">초성을 보고 단어를 추측하세요. 정확한 이름은 이야기의 단서를 통해 확인합니다.</p></section>'}
function lessonSentences(i,scene,level){const d=EPISODES[i].scene[scene],base=d[1],n=Number(level)||1;const noun=VOCAB[i][scene][0];if(n<=2)return [base,'이것은 '+noun+' 이야기예요.','무엇이 사라졌어요?'];if(n<=4)return [base,d[2],noun+'에 관한 단서를 비교해서 어떤 일이 일어났는지 설명해 보세요.'];return [base,d[2],'앞의 사건과 뒤의 사건을 연결하여 '+noun+'의 역할이 무엇인지 근거를 들어 추론해 보세요.']}
function lessonHTML(i,scene){const words=VOCAB[i][scene],sentences=lessonSentences(i,scene,s.topik),level=Number(s.topik)||1;return '<section class="lesson"><h3>📘 장면 학습</h3><p class="small-note">선택한 TOPIK '+(s.topik==='unknown'?'미선택(1급 기초 예시)':esc(s.topik)+'급')+' 수준을 참고한 개발용 학습 문장입니다. 공식 TOPIK 등급 인증 문항은 아닙니다.</p><strong>핵심 단어 5개</strong><div class="word-list">'+words.map(w=>'<button onclick="speak('+JSON.stringify(w).replace(/"/g,'&quot;')+')">'+esc(w)+' 🔊</button>').join('')+'</div><strong>읽기 문장</strong><ol class="sentences">'+sentences.map(t=>'<li>'+esc(t)+' <button class="inline-listen" onclick="speak('+JSON.stringify(t).replace(/"/g,'&quot;')+')">🔊</button></li>').join('')+'</ol></section>'}


function captureItem(){const i=s.selectedBook;if(i===null||progress(i).phase!=='recovered'||!progress(i).deduction?.verified){alert('먼저 펜던트로 사라진 존재를 확인해 주세요.');return;}const id='ep'+(i+1);if(!s.inventory[id])s.inventory[id]={name:EPISODES[i].target,tale:TALES[i],icon:EPISODES[i].icon,status:'carried',capturedAt:new Date().toISOString()};save();go('inventoryDetail')}
function openInventoryItem(n){const i=n-1;if(i<0||i>=EPISODES.length)return;set({page:'inventoryDetail',selectedBook:i})}


let deduceInput='';
function deduceHint(){const i=s.selectedBook;if(i===null||s.page!=='deduce')return;const p=progress(i),m=p.deduction||{attempts:0,hints:0,verified:false};if(m.verified||m.hints>=2)return;updateProgress(i,{deduction:{...m,hints:m.hints+1}})}
function verifyPendant(){const i=s.selectedBook;if(i===null||s.page!=='deduce')return;const p=progress(i);if(p.phase!=='investigate')return;if(![0,1,2].every(n=>allTasksDone(i,n))){alert('세 장면의 단서를 먼저 모두 획득해 주세요.');return}const val=document.getElementById('deduce-answer')?.value||deduceInput;if(!val.trim()){alert('추측한 이름을 입력해 주세요.');return}const m=p.deduction||{attempts:0,hints:0,verified:false};const verified=answerNormalize(val)===answerNormalize(EPISODES[i].target);updateProgress(i,{deduction:{...m,attempts:m.attempts+1,verified,guess:val}})}
function finishDeduction(){const i=s.selectedBook;if(i===null||s.page!=='deduce'||!progress(i).deduction?.verified)return;deduceInput='';updateProgress(i,{phase:'recovered'});go('capture')}


const STORYBOOK=[
['옛날 옛날에 마음씨 착한 나무꾼이 살았어요. 어느 날 나무꾼은 깊은 산에서 나무를 하고 있었지요. 그런데 그만 손에 쥐고 있던 <em>쇠도끼를 연못에 빠뜨렸어요.</em> 나무꾼은 소중한 도끼를 잃어버려 울음을 터뜨렸답니다.','그때 연못에서 산신령이 나타났어요. 산신령은 나무꾼에게 잃어버린 도끼를 찾아주겠다고 말했지요. 산신령은 먼저 <em>반짝이는 금도끼를 보여주려고 했어요.</em> 나무꾼은 숨을 죽이고 기다렸답니다.','그런데 산신령의 손에는 아무것도 없었어요. 산신령은 깜짝 놀라 연못을 다시 살펴보았지요. <em>금도끼가 감쪽같이 사라진 거예요.</em> 루시는 앞에서 찾은 단서를 떠올렸어요. 과연 금도끼는 어디로 갔을까요?'],
['옛날 옛날에 흥부라는 착한 사람이 살았어요. 어느 날 흥부는 다리가 다친 제비를 발견했지요. 흥부는 <em>제비를 정성껏 돌봐 주었어요.</em> 제비는 다시 하늘로 날아갈 수 있게 되었답니다.','봄이 되자 제비가 흥부의 집으로 돌아왔어요. 제비는 고마운 마음을 전하려고 작은 선물을 가져왔지요. 그 선물은 <em>마당에 심을 수 있는 씨앗</em>이었어요. 흥부는 기쁜 마음으로 제비를 기다렸답니다.','그런데 제비의 부리에는 아무것도 없었어요. 제비도 무척 당황한 듯 보였지요. <em>흥부에게 줄 씨앗이 사라졌어요.</em> 루시는 제비가 지나온 길을 생각해 보았답니다.'],
['옛날 옛날에 사이좋은 오누이가 살았어요. 어느 날 무서운 호랑이가 두 아이를 쫓아왔지요. 오누이는 있는 힘껏 달려 높은 나무 위로 올라갔어요. <em>호랑이는 나무 아래에서 기다리고 있었어요.</em>','오누이는 두 손을 모아 하늘에 도움을 청했어요. 하늘에서 튼튼한 줄이 내려오면 안전하게 올라갈 수 있었지요. <em>오누이는 하늘을 바라보며 줄을 기다렸어요.</em> 바람이 나뭇잎을 흔들었답니다.','하지만 아무리 기다려도 하늘은 조용했어요. 오누이는 다시 한번 간절히 기도했지요. <em>내려와야 할 동아줄이 보이지 않았어요.</em> 루시는 사라진 줄을 찾아야겠다고 마음먹었답니다.'],
['깊은 숲속에는 장난꾸러기 도깨비들이 살았어요. 밤이 되자 도깨비들은 한자리에 모여 잔치를 벌였지요. 노래와 웃음소리가 숲을 가득 채웠어요. <em>도깨비들은 신기한 마법을 보여주려고 했어요.</em>','도깨비는 평소처럼 주문을 외우고 물건을 두드리려고 했어요. 그러면 원하는 것이 뚝딱 나타났지요. <em>마법을 일으키는 물건은 방망이였어요.</em> 도깨비들은 모두 기대하며 기다렸답니다.','그런데 아무리 찾아도 방망이가 보이지 않았어요. 주문을 외워도 아무 일도 일어나지 않았지요. <em>도깨비 방망이가 사라진 거예요.</em> 루시는 숲에 남은 흔적을 살펴보았어요.'],
['옛날 옛날에 하늘에서 선녀들이 내려왔어요. 선녀들은 아름다운 연못에서 잠시 쉬고 있었지요. 나무꾼은 멀리서 그 모습을 보았어요. <em>선녀들은 하늘에서 내려온 손님들이었어요.</em>','날이 저물자 선녀들은 하늘로 돌아갈 준비를 했어요. 하늘로 날아가려면 특별한 옷이 필요했지요. <em>그 옷은 날개옷이라고 불렸어요.</em> 선녀들은 각자의 옷을 찾기 시작했답니다.','그런데 한 선녀의 날개옷이 보이지 않았어요. 선녀는 돌아갈 방법을 몰라 걱정했지요. <em>날개옷이 사라져 버린 거예요.</em> 루시는 선녀가 스스로 돌아갈 수 있도록 돕기로 했어요.'],
['옛날 옛날에 팥죽을 잘 끓이는 할머니가 살았어요. 어느 날 무서운 호랑이가 할머니를 찾아왔지요. 할머니는 무척 걱정했어요. <em>할머니는 따뜻한 팥죽을 끓이며 도움을 기다렸어요.</em>','할머니의 걱정을 들은 작은 친구들이 모였어요. 친구들은 각자 할 수 있는 일을 맡았지요. <em>작은 알밤도 할머니를 돕기로 약속했어요.</em> 모두 힘을 합치기로 했답니다.','드디어 친구들이 한자리에 모였어요. 그런데 있어야 할 친구 하나가 보이지 않았지요. <em>알밤이 감쪽같이 사라졌어요.</em> 루시는 알밤이 어디로 갔는지 살펴보았어요.'],
['옛날 옛날에 노래를 좋아하는 영감이 살았어요. 영감은 숲길을 걸으며 즐겁게 노래를 불렀지요. 그 노래를 들은 도깨비들이 다가왔어요. <em>도깨비들은 아름다운 노랫소리에 깜짝 놀랐어요.</em>','도깨비들은 영감의 노래가 어디에서 나오는지 궁금했어요. 영감의 얼굴을 바라보다가 혹을 발견했지요. <em>도깨비들은 혹 속에 노래가 들어 있다고 믿었어요.</em> 그래서 혹을 가져가려고 했답니다.','하지만 영감의 얼굴에서 혹을 찾을 수 없었어요. 도깨비들은 서로를 바라보며 당황했지요. <em>혹이 사라져 버린 거예요.</em> 루시는 이 수상한 일을 조사하기로 했어요.'],
['깊은 바닷속 용궁에는 용왕이 살고 있었어요. 어느 날 용왕이 병이 나서 신하들이 걱정했지요. 신하들은 육지의 토끼를 찾아야 한다고 말했어요. <em>용궁에서는 토끼를 데려올 방법을 생각했어요.</em>','육지와 바다를 오갈 수 있는 자라가 나섰어요. 자라는 토끼를 만나 용궁으로 안내하겠다고 했지요. <em>자라는 중요한 심부름을 맡은 사신이었어요.</em> 모두 자라가 돌아오기를 기다렸답니다.','그런데 자라가 어디에도 보이지 않았어요. 신하들은 자라를 불렀지만 대답이 없었지요. <em>토끼를 만나러 갈 자라가 사라진 거예요.</em> 루시는 자라를 찾아보기로 했어요.'],
['옛날 옛날에 부지런한 콩쥐가 살았어요. 어느 날 콩쥐는 큰 독에 물을 채워야 했지요. 하지만 아무리 물을 부어도 독이 차지 않았어요. <em>독의 바닥에 구멍이 나 있었기 때문이에요.</em>','콩쥐가 울고 있을 때 작은 두꺼비가 다가왔어요. 두꺼비는 콩쥐를 도와주고 싶었지요. <em>두꺼비는 독의 구멍을 몸으로 막아 주려고 했어요.</em> 콩쥐는 고마운 마음이 들었답니다.','그런데 두꺼비가 보이지 않았어요. 독에서는 물이 계속 새어 나왔지요. <em>구멍을 막아 줄 두꺼비가 사라진 거예요.</em> 루시는 두꺼비의 행방을 찾아 나섰어요.'],
['아주 먼 옛날, 견우와 직녀가 살았어요. 두 사람은 넓은 은하수를 사이에 두고 떨어져 있었지요. 서로를 그리워했지만 쉽게 만날 수 없었어요. <em>은하수가 두 사람 사이를 가로막고 있었어요.</em>','까치와 까마귀들이 두 사람을 돕기로 했어요. 새들은 몸을 이어 은하수 위에 다리를 만들려고 했지요. <em>특별한 길잡이 까치가 새들을 이끌었어요.</em> 모두 힘을 모아 날아올랐답니다.','그런데 다리가 중간에서 끊어지고 말았어요. 새들은 길을 찾지 못하고 헤매었지요. <em>새들을 이끌던 특별한 까치가 사라졌어요.</em> 루시는 까치의 흔적을 찾기 시작했어요.']
];
const MISSION_NAMES=['단어 찾기','문장 이해','순서 맞추기','단서 추리'];
let activeMission=0,missionChoice='';
function taskKey(i,scene,type){return 't'+type}
function taskRecord(i,scene,type){return (progress(i).tasks||{})[scene+'-'+type]||{done:false,attempts:0}}
function allTasksDone(i,scene){return [0,1,2,3].every(t=>taskRecord(i,scene,t).done)}
function taskQuestion(i,scene,type){const words=VOCAB[i][scene],story=STORYBOOK[i][scene],q=missionFor(i,scene);if(type===0)return {question:'이 장면의 핵심 단어를 고르세요.',answer:words[0],choices:[words[1],words[0],words[3]]};if(type===1)return {question:q.question,answer:q.answer,choices:q.choices};if(type===2){const parts=story.split('.').map(x=>x.replace(/<[^>]*>/g,'').trim()).filter(Boolean);return {question:'이 장면에서 먼저 일어난 일을 고르세요.',answer:parts[0],choices:[parts[2]||parts[0],parts[0],parts[1]||parts[0]]}}return {question:'이 장면의 중요한 단서를 고르세요.',answer:EPISODES[i].scene[scene][2],choices:[EPISODES[i].scene[scene][2],'이야기와 관련 없는 일이 일어났어요.','아무 단서도 찾지 못했어요.']}}
function taskOpen(type){activeMission=type;missionChoice='';go('missionFull')}
function taskChoose(value){missionChoice=value;render()}
function soundResult(correct){try{const C=window.AudioContext||window.webkitAudioContext;if(!C)return;const c=new C(),o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.type='sine';o.frequency.setValueAtTime(correct?660:260,c.currentTime);if(correct)o.frequency.setValueAtTime(880,c.currentTime+.13);g.gain.setValueAtTime(.07,c.currentTime);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+.3);o.start();o.stop(c.currentTime+.32);o.onended=()=>c.close()}catch{}}
function taskCheck(){const i=s.selectedBook,scene=progress(i).scene,q=taskQuestion(i,scene,activeMission),rec=taskRecord(i,scene,activeMission);if(!missionChoice){alert('답을 선택해 주세요.');return}const correct=answerNormalize(missionChoice)===answerNormalize(q.answer);soundResult(correct);const p=progress(i),tasks={...(p.tasks||{})};tasks[scene+'-'+activeMission]={done:correct||rec.done,attempts:rec.attempts+1,correct};updateProgress(i,{tasks});if(correct){missionChoice='';go('scene')}}
function missionMenu(i,scene){return '<section class="mission-menu"><h3>미션을 선택하세요</h3><p>네 가지 미션을 모두 완료하면 다음 장면으로 갈 수 있어요.</p><div class="mission-menu-grid">'+MISSION_NAMES.map((name,t)=>'<button onclick="taskOpen('+t+')">'+(taskRecord(i,scene,t).done?'✓ ':'')+(t===0?'📚 ':t===1?'💬 ':t===2?'🔢 ':'🔎 ')+name+'</button>').join('')+'</div></section>'}
function sceneStory(i,scene){return STORYBOOK[i][scene].replace(/<em>/g,'<strong class="story-emphasis">').replace(/<\/em>/g,'</strong>')}
function resultsHTML(i){return '<section class="lesson-results"><h3>📚 이번 이야기에서 배운 내용</h3>'+[0,1,2].map(scene=>'<h4>장면 '+(scene+1)+'</h4><p><strong>단어:</strong> '+VOCAB[i][scene].map(esc).join(' · ')+'</p><p><strong>문장 표현:</strong> '+lessonSentences(i,scene,s.topik).map(esc).join(' / ')+'</p>').join('')+'</section>'}
function selectPlace(n){const i=s.selectedBook,p=progress(i),correct=n===p.location;if(!correct){soundResult(false);alert('다른 장소를 생각해 보세요.');return}soundResult(true);updateProgress(i,{placeChosen:true})}
function placeOptions(i,location){const target=EPISODES[i].places[location],all=['전통시장','박물관','공원','분실물 보관소','도서관','지하철역','음식점','우체국','원예 상점','생태공원','문화체험관','야생동물 구조센터','한복·공예점'];const decoys=all.filter(x=>x!==target&&!EPISODES[i].places.includes(x)).slice((i*3+location)%8,(i*3+location)%8+3);return [target,...decoys].sort((a,b)=>((a.length+i+location)%5)-((b.length+i+location)%5))}

render();
</script></body></html>
