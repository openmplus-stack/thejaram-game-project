picFlow"><div class="flowBox"><div class="flowHead"><button class="back" id="topicBack">←</button><div><div class="flowTitle">무엇을 공부할까요?</div><div class="flowSub" id="selectedContinent"></div></div></div><div class="choiceGrid"><button class="choice" data-topic="flag-country">🏳️ 나라 ↔ 국기<small>나라 이름과 국기를 연결해요.</small></button><button class="choice" data-topic="country-capital">🏙️ 나라 ↔ 수도<small>나라 이름과 수도를 연결해요.</small></button></div></div></section><section class="flow" id="activityFlow"><div class="flowBox"><div class="flowHead"><button class="back" id="activityBack">←</button><div><div class="flowTitle">어떻게 할까요?</div><div class="flowSub" id="selectedTopic"></div></div></div><div class="choiceGrid"><button class="choice" data-activity="learn">📖 학습하기<small>10개씩 천천히 배워요.</small></button><button class="choice" data-activity="quiz">🎯 문제 풀기<small>20문제로 확인해요.</small></button></div></div></section><div class="soon" id="soon">다음 단계에서 연결할 메뉴예요.</div><div class="overlay" id="overlay"><div class="startbox"><h1>🌏 세계 짝꿍 찾기</h1><p>박자에 맞춰 두 카드를 봐요.<br>서로 맞는 짝이면 <b>O</b>, 아니면 <b>X</b>를 눌러요.</p><div class="modegrid"><button class="mode sel" data-mode="flag-country">국기 ↔ 국가</button><button class="mode" data-mode="country-capital">국가 ↔ 수도</button><button class="mode" data-mode="flag-capital">국기 ↔ 수도</button><button class="mode" data-mode="mixed">종합 연습</button></div><button class="start" id="startBtn">시작하기</button></div></div><div class="resultOverlay" id="resultOverlay"><div class="resultBox"><h2>🎉 학습 완료</h2><div class="resultScore" id="resultScore"></div><div class="resultRate" id="resultRate"></div><button class="again" id="againBtn">다시 하기</button></div></div><main class="app"><div class="top"><div class="title">🌏 세계 짝꿍 찾기</div><div class="tools"><button class="pill" id="modeBtn">국기 ↔ 국가</button><label class="pill">박자 <select id="bpm" style="border:0;background:transparent;font:inherit"><option>40</option><option>50</option><option selected>60</option><option>70</option><option>80</option><option>90</option><option>100</option><option>120</option></select> BPM</label><button class="pill" id="pauseBtn">⏸ 잠깐 멈춤</button></div></div><section class="board" id="board"><div class="rhythm"><div class="track"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="ball" id="ball"></div><div class="beatnums"><span>1</span><span>2</span><span>3</span><span>4</span></div></div><div class="cards"><div class="card left" id="leftCard"><span class="label" id="leftLabel">국기</span><div class="content flag" id="leftContent">🇰🇷</div></div><div class="card right" id="rightCard"><span class="label" id="rightLabel">국가</span><div class="content" id="rightContent">대한민국</div></div></div><div class="actions"><button class="answer yes" data-answer="true">O</button><button class="answer no" data-answer="false">X</button></div><div class="status" id="status">박자를 보고 천천히 비교해요.</div><div class="bottom"><span id="count">문제 1</span><span>·</span><span id="score">맞음 0 / 0</span></div></section></main><script>
const items=[{country:'대한민국',capital:'서울',flag:'🇰🇷'},{country:'중국',capital:'베이징',flag:'🇨🇳'},{country:'일본',capital:'도쿄',flag:'🇯🇵'},{country:'러시아',capital:'모스크바',flag:'🇷🇺'},{country:'몽골',capital:'울란바토르',flag:'🇲🇳'},{country:'필리핀',capital:'마닐라',flag:'🇵🇭'},{country:'베트남',capital:'하노이',flag:'🇻🇳'},{country:'인도',capital:'뉴델리',flag:'🇮🇳'}];
const configs={ 'flag-country':['flag','country','국기','국가'], 'country-capital':['country','capital','국가','수도'], 'flag-capital':['flag','capital','국기','수도']}; const names={'flag-country':'국기 ↔ 국가','country-capital':'국가 ↔ 수도','flag-capital':'국기 ↔ 수도','mixed':'종합 연습'};
let mode='flag-country',bpm=60,beat=0,timer=null,running=false,current=null,q=0,correct=0,answered=false,audio=null; const $=s=>document.querySelector(s),dots=[...document.querySelectorAll('.dot')]; const pick=a=>a[Math.floor(Math.random()*a.length)];
function tone(freq,d=.09,type='sine',gain=.055){try{audio ||= new(window.AudioContext||window.webkitAudioContext)();const o=audio.createOscillator(),g=audio.createGain();o.frequency.value=freq;o.type=type;g.gain.setValueAtTime(gain,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+d);o.connect(g);g.connect(audio.destination);o.start();o.stop(audio.currentTime+d)}catch(e){}}
function feedback(ok){if(ok){tone(660,.11);setTimeout(()=>tone(880,.16),90)}else{tone(210,.18,'square',.035);setTimeout(()=>tone(160,.2,'square',.025),100)}}
function render(el,key,val){el.textContent=val;el.classList.toggle('flag',key==='flag')}
function newPair(){let active=mode==='mixed'?pick(Object.keys(configs)):mode;let [lk,rk,ll,rl]=configs[active],left=pick(items),mismatch=Math.random()<.36,right=left;if(mismatch){do{right=pick(items)}while(right.country===left.country)}current={match:!mismatch,left,right};$('#leftLabel').textContent=ll;$('#rightLabel').textContent=rl;render($('#leftContent'),lk,left[lk]);render($('#rightContent'),rk,right[rk]);q++;answered=false;$('#count').textContent='문제 '+q;$('#status').textContent='두 카드가 맞는 짝인지 비교해요.';$('#status').className='status'}
function tick(){if(!running)return;beat=beat%4+1;dots.forEach((d,i)=>d.classList.toggle('on',i===beat-1));$('#ball').style.left=[7,35.7,64.3,93][beat-1]+'%';['#leftCard','#rightCard'].forEach(s=>$(s).classList.add('beat'));setTimeout(()=>['#leftCard','#rightCard'].forEach(s=>$(s).classList.remove('beat')),150);tone(beat===1?880:beat===3?660:520,.075);if(beat===1&&(current===null||answered)&&q<30)newPair()}
function restart(){clearInterval(timer);if(running)timer=setInterval(tick,60000/bpm)}function start(){running=true;$('#overlay').classList.add('hide');beat=0;current=null;tick();restart()}
function answer(v){if(!running||!current||answered)return;answered=true;let ok=v===current.match;if(ok){correct++;$('#status').textContent='맞았어요!';$('#status').className='status good';$('#board').classList.add('flashGood')}else{$('#status').textContent=current.match?'서로 맞는 짝이에요.':'서로 다른 짝이에요.';$('#status').className='status bad';$('#board').classList.add('flashBad')}feedback(ok);$('#score').textContent=`맞음 ${correct} / ${q}`;setTimeout(()=>$('#board').classList.remove('flashGood','flashBad'),400);if(q>=30){setTimeout(finish,650)}}
function finish(){running=false;clearInterval(timer);dots.forEach(d=>d.classList.remove('on'));const wrong=30-correct,rate=Math.round(correct/30*100);$('#resultScore').innerHTML=`30문제 중 <b>${correct}문제</b>를 맞혔어요.<br>정답 ${correct}개 · 오답 ${wrong}개`;$('#resultRate').textContent=`정답률 ${rate}%`;$('#resultOverlay').style.display='flex'}function resetGame(){q=0;correct=0;answered=false;current=null;beat=0;$('#score').textContent='맞음 0 / 0';$('#count').textContent='문제 1';$('#status').textContent='박자를 보고 천천히 비교해요.';$('#status').className='status';$('#resultOverlay').style.display='none';start()}$('#againBtn').onclick=resetGame;
let selectedContinentName='전체',selectedTopicName='flag-country';function showFlow(id){['#home','#continentFlow','#topicFlow','#activityFlow','#overlay','#learnScreen'].forEach(x=>$(x).style.display='none');$(id).style.display='flex'}$('#homeStart').onclick=()=>showFlow('#continentFlow');$('#continentBack').onclick=()=>showFlow('#home');$('#topicBack').onclick=()=>showFlow('#continentFlow');$('#activityBack').onclick=()=>showFlow('#topicFlow');document.querySelectorAll('[data-continent]').forEach(b=>b.onclick=()=>{selectedContinentName=b.dataset.continent;$('#selectedContinent').textContent=selectedContinentName;showFlow('#topicFlow')});document.querySelectorAll('[data-topic]').forEach(b=>b.onclick=()=>{selectedTopicName=b.dataset.topic;mode=selectedTopicName;$('#selectedTopic').textContent=(selectedContinentName==='전체'?'세계 전체':selectedContinentName)+' · '+names[selectedTopicName];showFlow('#activityFlow')});document.querySelectorAll('[data-activity]').forEach(b=>b.onclick=()=>{if(selectedContinentName!=='전체'&&selectedContinentName!=='아시아'){const s=$('#soon');s.textContent='이 대륙의 국가 데이터는 다음 단계에서 추가해요.';s.classList.add('show');setTimeout(()=>s.classList.remove('show'),1800);return}if(b.dataset.activity==='quiz'){q=0;correct=0;answered=false;current=null;$('#overlay').style.display='none';$('.app').style.display='block';start()}else{openLearn()}});let learnIndex=0;function renderLearn(){const it=items[learnIndex];$('#learnFlag').textContent=it.flag;$('#learnCountry').textContent=it.country;$('#learnCapital').textContent=it.capital;$('#learnProgress').textContent=(learnIndex+1)+' / '+items.length;if(selectedTopicName==='flag-country'){$('#learnTitle').textContent='나라 · 국기 학습';$('#learnFlag').style.display='block';$('#learnLeftCountry').style.display='none';$('#learnCountry').style.display='block';$('#learnCapital').style.display='none';$('#learnLeftPane').classList.add('flagPane')}else{$('#learnTitle').textContent='나라 · 수도 학습';$('#learnFlag').style.display='none';$('#learnLeftCountry').style.display='block';$('#learnLeftCountry').textContent=it.country;$('#learnCountry').style.display='none';$('#learnCapital').style.display='block';$('#learnLeftPane').classList.remove('flagPane')}$('#prevLearn').disabled=learnIndex===0;$('#nextLearn').textContent=learnIndex===items.length-1?'학습 완료':'다음 →'}function openLearn(){running=false;clearInterval(timer);learnIndex=0;showFlow('#learnScreen');renderLearn()}$('#learnBack').onclick=()=>showFlow('#activityFlow');$('#prevLearn').onclick=()=>{if(learnIndex>0){learnIndex--;renderLearn()}};$('#nextLearn').onclick=()=>{if(learnIndex<items.length-1){learnIndex++;renderLearn()}else{showFlow('#activityFlow')}};document.querySelectorAll('[data-soon]').forEach(b=>b.onclick=()=>{const s=$('#soon');s.classList.add('show');setTimeout(()=>s.classList.remove('show'),1500)});
document.querySelectorAll('.mode').forEach(b=>b.onclick=()=>{document.querySelectorAll('.mode').forEach(x=>x.classList.remove('sel'));b.classList.add('sel');mode=b.dataset.mode;$('#modeBtn').textContent=names[mode]});$('#startBtn').onclick=start;document.querySelectorAll('.answer').forEach(b=>b.onclick=()=>answer(b.dataset.answer==='true'));$('#bpm').onchange=e=>{bpm=+e.target.value;restart()};$('#pauseBtn').onclick=()=>{running=!running;$('#pauseBtn').textContent=running?'⏸ 잠깐 멈춤':'▶ 계속하기';if(running){tick();restart()}else clearInterval(timer)};$('#modeBtn').onclick=()=>{running=false;clearInterval(timer);$('#overlay').classList.remove('hide')};
</script></body></html>
