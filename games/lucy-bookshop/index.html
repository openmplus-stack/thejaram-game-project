function dialogContext(){return s.page==='scene'?'scene-'+s.selectedBook+'-'+progress(s.selectedBook).scene:s.page==='modern'?'modern-'+s.selectedBook+'-'+progress(s.selectedBook).location:''}

function resetTalk(){talk={context:dialogContext(),index:0,translated:false,rate:1,voiceOn:true,npc:'',npcStep:0}}
function ensureTalk(){const ctx=dialogContext();if(talk.context!==ctx)resetTalk()}
function currentTalk(){ensureTalk();const lines=dialogLines();return lines[Math.min(talk.index,Math.max(0,lines.length-1))]||['루시','이야기를 살펴보자.']}
function talkNext(){ensureTalk();const n=dialogLines().length;talk.index=Math.min(talk.index+1,n-1);talk.translated=false;render()}
function talkPrev(){ensureTalk();talk.index=Math.max(0,talk.index-1);talk.translated=false;render()}
function talkRate(){talk.rate=talk.rate===1?0.75:talk.rate===0.75?1.25:1;render()}
function talkTranslate(){talk.translated=!talk.translated;render()}

function missionId(i,scene){return 'ep'+String(i+1).padStart(2,'0')+'-s'+String(scene+1).padStart(2,'0')+'-m01'}

function record(i,scene){const p=progress(i);return (p.missions||{})[missionId(i,scene)]||{attempts:0,hints:0,completed:false,score:null,selected:null}}
function answerNormalize(x){return String(x||'').normalize('NFKC').replace(/\s+/g,'').replace(/[.!?。！？]/g,'').trim().toLowerCase()}
function chooseAnswer(value){missionSelection=value;render()}
function useHint(){const i=s.selectedBook,p=progress(i),sc=p.scene,m=record(i,sc);if(m.completed)return;const updated={...m,hints:Math.min(2,m.hints+1)};writeMission(i,sc,updated)}

function initialOf(ch){const n=ch.charCodeAt(0)-44032;return n>=0&&n<11172?KO_INITIALS[Math.floor(n/588)]:ch}
function clueChunks(target){const chars=Array.from(target.replace(/\s+/g,''));const sizes=[Math.ceil(chars.length/3),Math.ceil((chars.length-Math.ceil(chars.length/3))/2)];sizes.push(chars.length-sizes[0]-sizes[1]);let pos=0;return sizes.map(n=>{const chunk=chars.slice(pos,pos+n).join('');pos+=n;return chunk})}
function clueOf(i,scene){const parts=clueChunks(EPISODES[i].target),part=parts[scene];return {letters:part,initials:Array.from(part).map(initialOf).join('')}}

function clueStrip(i){const pieces=[0,1,2].map(n=>{const c=clueOf(i,n),known=completedClue(i,n);return '<div class="clue-piece"><strong>장면 '+(n+1)+'</strong><div class="clue-letter">'+(known?esc(c.initials):'？')+'</div><small>'+(known?'획득한 초성':'아직 미획득')+'</small></div>'}).join('');return '<section class="clue-strip"><h3>🔎 사라진 이름의 초성</h3><p>각 장면의 미션을 완료하고 초성을 모아 보세요.</p><div class="clue-pieces">'+pieces+'</div><p class="small-note">초성을 보고 단어를 추측하세요. 정확한 이름은 이야기의 단서를 통해 확인합니다.</p></section>'}

  {question:'3장면: 본문에 맞는 내용을 고르세요.',answer:'동아줄이 사라져 오누이는 아직 위로 올라가지 못했어요.',choices:['동아줄이 사라져 오누이는 아직 위로 올라가지 못했어요.','오누이는 동아줄을 타고 이미 집에 돌아왔어요.','호랑이가 오누이에게 금도끼를 주었어요.','오누이는 자라를 타고 용궁에 갔어요.']}
 ]
];
function sunMoonMission(scene,type,level){
 const q=SUN_MOON_MISSIONS[scene][type];
 return {...q,question:level>=5?q.question.replace('본문에 맞는 내용을 고르세요.','본문에서 확인할 수 있는 진술을 고르세요.'):q.question};
}

function otherMission(i,scene,type){
 const [actor,event,context]=GRADED_SCENE_FACTS[i][scene],level=ep1MissionLevel()||1;
 const wrongFacts=GRADED_SCENE_FACTS.filter((_,j)=>j!==i).flatMap(row=>row.map(x=>x[1]));
 const otherActors=[...new Set(GRADED_SCENE_FACTS.flatMap(row=>row.map(x=>x[0])))].filter(x=>x!==actor);
 const otherContexts=[...new Set(GRADED_SCENE_FACTS.flatMap(row=>row.map(x=>x[2])))].filter(x=>x!==context);
 const wrongEvents=[...new Set(wrongFacts)].filter(x=>x!==event);
 const rotate=(arr,n)=>[...arr.slice(n%arr.length),...arr.slice(0,n%arr.length)];
 const make=(question,answer,wrong,offset)=>{
  const distractors=rotate(wrong,offset).filter(x=>x!==answer).slice(0,3);
  const choices=[...distractors];choices.splice((i+scene+type+level)%4,0,answer);
  return {question,answer,choices};
 };
 const actorQ=['이 장면에 나오는 인물은 누구인가요?','이 장면에서 행동한 인물은 누구인가요?','사건의 중심 인물은 누구인가요?','이 장면의 행동 주체는 누구인가요?','사건을 일으킨 주체를 고르세요.','사건의 행동을 수행한 주체를 고르세요.'][level-1];
 const eventQ=['무슨 일이 일어났나요?','이 인물은 무엇을 했나요?','이 장면에서 일어난 사건은 무엇인가요?','본문에 나타난 행동을 고르세요.','본문에서 직접 확인되는 사건은 무엇인가요?','추측이 아니라 본문에 명시된 사건은 무엇인가요?'][level-1];
 const contextQ=['함께 알 수 있는 내용은 무엇인가요?','이 장면의 상황은 어떤가요?','사건과 함께 제시된 정보는 무엇인가요?','본문의 상황 설명으로 알맞은 것은 무엇인가요?','본문의 배경 정보로 확인할 수 있는 것은 무엇인가요?','해석을 덧붙이지 않고 확인 가능한 정보는 무엇인가요?'][level-1];
 const evidenceQ=['이야기에 맞는 문장을 고르세요.','앞의 글과 맞는 내용을 고르세요.','인물과 행동을 바르게 연결한 것은 무엇인가요?','사건의 주체와 행동이 일치하는 것은 무엇인가요?','본문에 근거한 진술을 고르세요.','인물의 행동을 사실에 근거해 설명한 진술은 무엇인가요?'][level-1];
 if(type===0)return make(actorQ,actor,otherActors,i+scene+level);
 if(type===1)return make(eventQ,event,wrongEvents,i*3+scene+level);
 if(type===2)return make(contextQ,context,otherContexts,i+scene*2+level);
 const answer=actor+' — '+event;
 const wrong=wrongEvents.slice(0,12).map((x,j)=>j%2===0?actor+' — '+x:otherActors[j%otherActors.length]+' — '+event);
 return make(evidenceQ,answer,wrong,i+scene+level);
}


function restoredCount(){return EPISODES.reduce((n,e,i)=>n+((s.restoredIds||[]).includes('ep'+(i+1))&&s.inventory?.['ep'+(i+1)]?.status==='restored'&&progress(i).phase==='completed'?1:0),0)}
function allBooksRestored(){return restoredCount()===EPISODES.length}


/* Stage 30: release readiness is explicit; this is a pilot, not a certified TOPIK exam.
   These checks validate structure only and do not replace device or pedagogical QA. */
const RELEASE_INFO=Object.freeze({stage:40,status:'pilot',episodes:10,verifiedOnDevice:false,gradedContentReviewed:false});
function releaseSelfCheck(){
 const issues=[];
 if(EPISODES.length!==10||STORYBOOK.length!==10||VOCAB.length!==10)issues.push('동화 기본 데이터 개수 불일치');issues.push(...storyContinuityAudit().issues,...gradedTextAudit().issues,...sunMoonMissionAudit().issues,...variedMissionAudit().issues);
 for(let i=0;i<EPISODES.length;i++){
   if(!Array.isArray(EPISODES[i].places)||!EPISODES[i].places.length)issues.push('장소 누락 '+(i+1));
   for(let sc=0;sc<3;sc++){
     if(!storyText(i,sc)||!episodeWords(i,sc)?.length)issues.push('본문·어휘 누락 '+(i+1)+'-'+(sc+1));
     for(let t=0;t<4;t++){
       const q=taskQuestion(i,sc,t);
       if(!q||!q.answer||!Array.isArray(q.choices)||!q.choices.includes(q.answer)||new Set(q.choices).size!==q.choices.length)issues.push('미션 선택지 오류 '+(i+1)+'-'+(sc+1)+'-'+(t+1));
     }
   }
   for(let loc=0;loc<EPISODES[i].places.length;loc++){
     const options=placeOptions(i,loc);
     if(options.length!==4||options.filter(o=>o.correct).length!==1||new Set(options.map(o=>o.name)).size!==4)issues.push('장소 선택지 오류 '+(i+1)+'-'+(loc+1));
   }
 }
 return {ok:issues.length===0,issues,checkedAt:new Date().toISOString()};
}
