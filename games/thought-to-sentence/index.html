<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="description" content="한 단어에서 시작해 생각을 발견하고 확장해 나만의 글을 만드는 자기표현 학습 앱"><title>생각을 문장으로</title>
<style>:root{--sky:#dff4ff;--grass:#eaf5cf;--cream:#fffdf4;--ink:#27404a;--muted:#6d7c78;--green:#54b89c;--green2:#dff5e8;--yellow:#ffca58;--pink:#ffdce3;--line:#e6dfc8}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif;color:var(--ink);background:linear-gradient(#dff4ff 0 42%,#f5f1c9 72%,#e6f4c9)}button,input{font:inherit}.app{max-width:1000px;margin:auto;min-height:100vh;padding:22px}.brand{font-weight:950;font-size:24px}.top{display:flex;align-items:center;gap:15px}.progress{height:12px;flex:1;background:#fff9;border-radius:20px;overflow:hidden}.bar{height:100%;background:var(--green);width:0}.card{margin-top:18px;background:#fffdf4f2;border:2px solid #fff;border-radius:30px;padding:28px;box-shadow:0 12px 36px #577d6b22}.hero{min-height:78vh;display:grid;place-items:center;text-align:center}.logo{font-size:46px;font-weight:1000;line-height:1.05;color:#32715e;text-shadow:0 3px #fff}.hedgehog{width:170px;height:170px;margin:16px auto;position:relative}.spines{position:absolute;inset:5px;border-radius:50%;background:#8b654d;box-shadow:0 0 0 13px #9d7659;z-index:1}.face{position:absolute;left:28px;top:35px;width:118px;height:112px;border-radius:50% 50% 45% 45%;background:#f7d7aa;z-index:2;box-shadow:inset 0 -7px 0 #efc894}.eye{position:absolute;top:43px;width:13px;height:17px;background:#2d2825;border-radius:50%}.eye.l{left:32px}.eye.r{right:32px}.nose{position:absolute;top:65px;left:52px;width:14px;height:12px;background:#372b29;border-radius:50%}.cheek{position:absolute;top:66px;width:18px;height:10px;background:#f3a8a1aa;border-radius:50%}.cheek.l{left:18px}.cheek.r{right:18px}.face:after{content:"⌣";position:absolute;left:49px;top:69px;font-size:24px;font-weight:900;color:#6c4938}.speech{max-width:560px;margin:12px auto;background:white;border-radius:24px;padding:17px 22px;font-size:20px;font-weight:800}.menu{display:grid;gap:12px;max-width:520px;margin:18px auto}.btn{border:0;border-radius:18px;padding:16px 22px;font-weight:900;cursor:pointer}.primary{background:var(--yellow);color:#604719;box-shadow:0 4px #e3aa38}.secondary{background:#72d2c2;color:#174e48}.ghost{background:#fff;border:2px solid var(--line)}.question{font-size:30px;font-weight:950;margin:8px 0}.help{font-size:17px;color:var(--muted);margin-bottom:20px}.mascot-row{display:flex;gap:18px;align-items:center}.mini{transform:scale(.45);transform-origin:center;width:82px;height:82px;margin:-15px}.choices{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.choice{background:#fff;border:2px solid var(--line);border-radius:20px;padding:18px;text-align:left;font-weight:850;font-size:18px}.choice:hover,.choice.sel{border-color:var(--green);background:var(--green2)}.icon{font-size:26px;margin-right:8px}.inputrow{display:flex;gap:10px;margin-top:16px}.inputrow input{flex:1;border:2px solid var(--line);border-radius:18px;padding:16px;font-size:19px}.nav{display:flex;justify-content:space-between;margin-top:22px;gap:12px}.thoughts{margin-top:18px;padding:16px;background:#fff;border-radius:20px}.thought{display:inline-block;margin:5px;padding:9px 13px;background:#edf7df;border-radius:20px;font-weight:750}.map{display:flex;flex-wrap:wrap;gap:10px;align-items:center}.arrow{font-weight:1000;color:#8a9b80}.result{font-size:21px;line-height:1.8;background:#fff;padding:22px;border-radius:22px}@media(max-width:650px){.app{padding:12px}.card{padding:20px}.choices{grid-template-columns:1fr}.logo{font-size:38px}.question{font-size:25px}}</style></head>
<body><div class="app"><div id="top" class="top" style="display:none"><div class="brand">🌱 생각을 문장으로</div><div class="progress"><div id="bar" class="bar"></div></div></div><main id="main"><section class="hero"><div class="hedgehog" role="img" aria-label="생각을 도와주는 고슴도치"><div class="spines"></div><div class="face"><i class="eye l"></i><i class="eye r"></i><i class="nose"></i><i class="cheek l"></i><i class="cheek r"></i></div></div><div class="logo">생각을<br>문장으로</div><div class="speech">안녕! 오늘은 어떤 생각을 찾아볼까?<br>한 단어에서 시작해도 괜찮아.</div><div class="menu"><button class="btn primary" id="startBtn">📖 이야기 만들기</button><button class="btn secondary" id="storyBtn">📚 나의 이야기장</button></div></section></main></div>
<script>
const main=document.querySelector("#main"),topBar=document.querySelector("#top"),bar=document.querySelector("#bar");
const H='<div class="hedgehog" role="img" aria-label="생각을 도와주는 고슴도치"><div class="spines"></div><div class="face"><i class="eye l"></i><i class="eye r"></i><i class="nose"></i><i class="cheek l"></i><i class="cheek r"></i></div></div>';
const START=[["☀️","오늘 있었던 일","오늘 있었던 일을 떠올려 본다."],["💡","기억나는 일","최근 기억에 남은 일을 이야기한다."],["❤️","기분에 관한 일","기쁘거나 속상했던 일을 이야기한다."],["🔎","궁금한 것","더 알고 싶은 것을 생각해 본다."],["⭐","좋아하는 것","좋아하는 것에 대해 이야기한다."],["✏️","내가 정하기","떠오른 단어나 이야기를 직접 쓴다."]];
let state={mode:"",seed:"",answers:[],stage:0};
const flows={
 event:[
  {q:"가장 먼저 떠오르는 말은 뭐야?",h:"사람, 물건, 장소, 행동 무엇이든 괜찮아.",c:["학교","친구","선생님","시험","준비물","게임","운동","급식"]},
  {q:"그것과 관련해 무슨 일이 있었어?",h:"한 가지 일만 골라도 괜찮아.",c:["잘했다","실수했다","잊어버렸다","도움을 받았다","친구와 함께했다","기다렸다","계획이 바뀌었다","직접 말하기"]},
  {q:"그래서 어떻게 되었어?",h:"그 다음에 일어난 일을 생각해 보자.",c:["문제가 해결됐다","잘 되지 않았다","다시 해봤다","도움을 요청했다","기다렸다","기분이 좋아졌다","더 어려워졌다","직접 말하기"]},
  {q:"그때 어떤 기분이 들었어?",h:"기분은 하나가 아니어도 괜찮아.",c:["기뻤다","뿌듯했다","편안했다","놀랐다","당황했다","속상했다","걱정됐다","화가 났다"]},
  {q:"왜 그런 기분이 들었을까?",h:"내 마음의 이유를 생각해 보자.",c:["원하는 대로 돼서","생각과 달라서","잘할 수 있어서","잘하지 못해서","도움을 받아서","혼자 해결해서","갑자기 일어나서","직접 말하기"]},
  {q:"이 일에서 어떤 생각이 들었어?",h:"맞고 틀린 답은 없어. 내가 든 생각을 고른다.",c:["다행이라고 생각했다","아쉽다고 생각했다","다시 해보고 싶었다","도움이 필요하다고 생각했다","내가 잘했다고 생각했다","다르게 해봐야겠다고 생각했다","더 알고 싶었다","직접 말하기"]},
  {q:"다음에는 어떻게 하고 싶어?",h:"비슷한 일이 생기면 내가 할 수 있는 일을 생각해 보자.",c:["미리 준비하겠다","한 번 더 확인하겠다","도움을 요청하겠다","내 생각을 말하겠다","천천히 해보겠다","다시 도전하겠다","다른 방법을 찾아보겠다","직접 말하기"]}
 ],
 curiosity:[
  {q:"무엇이 궁금해?",h:"알고 싶은 것을 한 단어나 짧은 말로 적어도 괜찮아.",c:["동물","공룡","우주","자동차","사람","나라","과학","직접 말하기"]},
  {q:"그것에서 무엇을 더 알고 싶어?",h:"궁금한 부분을 조금 더 자세히 생각해 보자.",c:["왜 그런지","어떻게 하는지","어디에 있는지","무엇을 먹는지","어떻게 생겼는지","언제 생겼는지","다른 것과 무엇이 다른지","직접 말하기"]},
  {q:"왜 그것이 궁금해졌어?",h:"궁금해진 계기를 떠올려 보자.",c:["책에서 봐서","영상에서 봐서","직접 봐서","수업에서 배워서","친구가 말해서","신기해서","좋아해서","잘 몰라서"]},
  {q:"지금 알고 있는 것은 뭐야?",h:"조금만 알고 있어도 괜찮아.",c:["생김새를 안다","이름을 안다","사는 곳을 안다","하는 일을 안다","특징을 안다","들은 적이 있다","거의 모른다","직접 말하기"]},
  {q:"어떻게 알아보고 싶어?",h:"내가 직접 알아볼 방법을 고른다.",c:["책을 찾아보겠다","검색해 보겠다","선생님께 묻겠다","가족에게 묻겠다","영상으로 보겠다","직접 관찰하겠다","친구와 이야기하겠다","다른 방법을 생각하겠다"]}
 ]};
function esc(s){return String(s||"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function home(){state={mode:"",seed:"",answers:[],stage:0};topBar.style.display="none";main.innerHTML='<section class="hero">'+H+'<div class="logo">생각을<br>문장으로</div><div class="speech">안녕! 오늘은 어떤 생각을 찾아볼까?<br>한 단어에서 시작해도 괜찮아.</div><div class="menu"><button class="btn primary" onclick="startMenu()">📖 이야기 만들기</button><button class="btn secondary" onclick="alert(\'나의 이야기장은 다음 개발 단계에서 연결됩니다.\')">📚 나의 이야기장</button></div></section>'}
function startMenu(){topBar.style.display="flex";bar.style.width="8%";main.innerHTML='<section class="card"><div class="mascot-row"><div class="mini">'+H+'</div><div><div class="question">어떤 생각에서 시작할까?</div><div class="help">정해진 순서대로 답할 필요는 없어. 지금 떠오르는 곳에서 시작하자.</div></div></div><div class="choices">'+START.map((x,i)=>'<button class="choice" onclick="pickStart('+i+')"><span class="icon">'+x[0]+'</span>'+x[1]+'<br><small>'+x[2]+'</small></button>').join("")+'</div><div class="nav"><button class="btn ghost" onclick="home()">← 홈</button></div></section>'}
function pickStart(i){let x=START[i];state.mode=(i===3||i===4)?"curiosity":"event";state.seed=x[1];state.stage=0;renderQuestion()}
function currentFlow(){return flows[state.mode]}
function renderQuestion(){let f=currentFlow(),s=f[state.stage];bar.style.width=(18+state.stage/(f.length)*70)+"%";main.innerHTML='<section class="card"><div class="mascot-row"><div class="mini">'+H+'</div><div><div class="question">'+esc(s.q)+'</div><div class="help">'+esc(s.h)+'</div></div></div><div class="choices">'+s.c.map(x=>'<button class="choice" onclick=\'answer('+JSON.stringify(JSON.stringify(x))+')\'>'+esc(x)+'</button>').join("")+'</div><div class="inputrow"><input id="custom" placeholder="내 말로 직접 써도 돼요"><button class="btn secondary" onclick="customAnswer()">말 더하기</button></div>'+thoughtMap()+'<div class="nav"><button class="btn ghost" onclick="back()">← 이전</button><button class="btn ghost" onclick="skip()">잘 모르겠어</button></div></section>'}
function thoughtMap(){if(!state.answers.length)return "";return '<div class="thoughts"><b>🌱 지금까지 찾은 생각</b><div class="map">'+state.answers.map((a,i)=>'<span class="thought">'+esc(a)+'</span>'+(i<state.answers.length-1?'<span class="arrow">→</span>':"")).join("")+'</div></div>'}
function answer(v){if(v==="직접 말하기"){document.querySelector("#custom").focus();return}state.answers[state.stage]=v;advance()}
function customAnswer(){let v=document.querySelector("#custom").value.trim();if(!v)return;state.answers[state.stage]=v;advance()}
function skip(){state.answers[state.stage]="";advance()}function advance(){let f=currentFlow();state.stage++;state.stage<f.length?renderQuestion():finish()}
function back(){if(state.stage>0){state.stage--;renderQuestion()}else startMenu()}
function finish(){bar.style.width="100%";let a=state.answers.filter(Boolean);main.innerHTML='<section class="card"><div class="mascot-row"><div class="mini">'+H+'</div><div><div class="question">내 생각이 이렇게 자랐어!</div><div class="help">아직 문장을 대신 만들어 주지 않았어. 내가 찾은 생각을 먼저 확인해 보자.</div></div></div><div class="thoughts"><div class="map">'+a.map((x,i)=>'<span class="thought">'+esc(x)+'</span>'+(i<a.length-1?'<span class="arrow">→</span>':"")).join("")+'</div></div><div class="result"><b>다음 개발 단계</b><br>이 생각들 사이에서 빠진 관계를 찾아 질문하고, 충분히 표현한 뒤에만 자연스러운 -다체 문장으로 묶는다.</div><div class="nav"><button class="btn ghost" onclick="back()">← 생각 고치기</button><button class="btn primary" onclick="home()">새 이야기 시작</button></div></section>'}
document.querySelector("#startBtn")?.addEventListener("click",startMenu);document.querySelector("#storyBtn")?.addEventListener("click",()=>alert("나의 이야기장은 다음 개발 단계에서 연결됩니다."));</script></body></html>
