<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#e8ffd7" />
  <title>개구리는 무엇을 할까요?</title>
  <meta name="description" content="개구리의 동작과 소리를 보고 듣는 학습 앱" />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='18' cy='19' r='12' fill='%2398dc42'/%3E%3Ccircle cx='46' cy='19' r='12' fill='%2398dc42'/%3E%3Ccircle cx='32' cy='35' r='24' fill='%2398dc42'/%3E%3Ccircle cx='18' cy='18' r='4' fill='%231b4228'/%3E%3Ccircle cx='46' cy='18' r='4' fill='%231b4228'/%3E%3Cpath d='M20 39q12 12 24 0' fill='none' stroke='%231b4228' stroke-width='4' stroke-linecap='round'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main>
    <nav class="page-nav" aria-label="학습 페이지 선택">
      <button type="button" data-page="0" aria-current="page">전체 학습</button>
      <button type="button" data-page="1">이미지 · 소리 ①</button>
      <button type="button" data-page="2">이미지 · 소리 ②</button>
      <button type="button" data-page="3">이미지 · 글자 ①</button>
      <button type="button" data-page="4">이미지 · 글자 ②</button>
    </nav>
    <section id="learningPage">
    <header>
      <h1>개구리는 무엇을 할까요?</h1>
      <p class="guide">개구리를 눌러 보세요. 동작을 보고 소리를 들어요!</p>
    </header>

    <section class="stage" aria-live="polite" aria-atomic="true">
      <span class="stage-icon" aria-hidden="true">🔊</span>
      <div id="spokenText">개구리를 하나 골라 보세요!</div>
    </section>

    <div class="grid-wrap" aria-label="개구리 동작 10가지">
      <section class="frog-grid" id="frogGrid"></section>
    </div>
    <p class="hint">같은 개구리를 다시 누르면 동작과 소리를 반복할 수 있어요.</p>
    </section>
    <section id="matchingPage" hidden aria-labelledby="exerciseTitle">
      <div class="exercise-head"><h2 id="exerciseTitle"></h2><div class="exercise-tools"><span id="progress"></span><button id="resetExercise" type="button">다시 하기</button><button id="nextPage" type="button">다음 페이지 →</button></div></div>
      <div class="match-feedback" id="matchFeedback" role="status" aria-live="polite" aria-atomic="true"></div>
      <div class="matching-board" id="matchingBoard"></div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
