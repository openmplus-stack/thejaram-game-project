<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675">
<rect width="1200" height="675" fill="#f4f6fb"/>
<rect x="55" y="48" width="1090" height="580" rx="28" fill="#fff" stroke="#d9e0eb"/>
<rect x="90" y="82" width="1020" height="120" rx="18" fill="#fff8db"/>
<text x="115" y="125" font-family="system-ui,sans-serif" font-size="27" font-weight="900" fill="#202a3a">제비가 다리를 심하게 다쳤기에</text>
<text x="115" y="166" font-family="system-ui,sans-serif" font-size="27" font-weight="900" fill="#202a3a">흥부는 제비의 다리를 정성껏 치료해 주었습니다.</text>
<text x="90" y="245" font-family="system-ui,sans-serif" font-size="22" font-weight="800" fill="#4f5b6c">긴 문장을 두 개의 짧은 문장으로 나누어 보세요.</text>
<rect x="90" y="285" width="420" height="240" rx="20" fill="#f8faff" stroke="#b7c6f6" stroke-width="3" stroke-dasharray="10 8"/>
<text x="120" y="330" font-family="system-ui,sans-serif" font-size="26" font-weight="900" fill="#6075cc">먼저 있었던 일</text>
<rect x="120" y="365" width="330" height="56" rx="13" fill="#fff" stroke="#b7bfcc"/><text x="285" y="401" text-anchor="middle" font-family="system-ui,sans-serif" font-size="20" font-weight="800" fill="#202a3a">제비가 다리를 심하게 다쳤습니다.</text>
<text x="600" y="420" text-anchor="middle" font-size="52" fill="#3658d8">→</text>
<rect x="690" y="285" width="420" height="240" rx="20" fill="#f8faff" stroke="#b7c6f6" stroke-width="3" stroke-dasharray="10 8"/>
<text x="720" y="330" font-family="system-ui,sans-serif" font-size="26" font-weight="900" fill="#6075cc">그래서 생긴 일</text>
<rect x="720" y="365" width="340" height="78" rx="13" fill="#fff" stroke="#b7bfcc"/><text x="890" y="397" text-anchor="middle" font-family="system-ui,sans-serif" font-size="19" font-weight="800" fill="#202a3a">흥부는 제비의 다리를</text><text x="890" y="425" text-anchor="middle" font-family="system-ui,sans-serif" font-size="19" font-weight="800" fill="#202a3a">정성껏 치료해 주었습니다.</text>
</svg>