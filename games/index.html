<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>THE JARAM Game Server</title>
  <meta name="description" content="THE JARAM 수업용 웹앱과 학습 게임 모음">
  <style>
    :root{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#183526;background:#f4f8f2}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;padding:40px 20px}
    main{width:min(94vw,760px);margin:0 auto;background:#fff;border-radius:24px;padding:36px 28px;box-shadow:0 12px 36px rgba(34,74,47,.10)}
    h1{margin:0 0 8px;font-size:clamp(28px,5vw,42px)}
    .intro{margin:0 0 28px;color:#3f5147;line-height:1.7}
    .games{display:grid;gap:14px}
    a{display:block;padding:20px;border:1px solid #dce8d8;border-radius:18px;text-decoration:none;color:inherit;background:#fbfef9;transition:.15s ease}
    a:hover,a:focus-visible{transform:translateY(-2px);box-shadow:0 7px 18px rgba(34,74,47,.10);outline:2px solid #315f43;outline-offset:2px}
    strong{display:block;font-size:20px;margin-bottom:5px}
    span{color:#3f5147;line-height:1.5}
    .status{margin-top:16px;color:#3f5147;font-size:14px}
    footer{margin-top:28px;color:#3f5147;font-size:14px}
  </style>
</head>
<body>
  <main>
    <h1>THE JARAM Game Server</h1>
    <p class="intro">THE JARAM 수업에서 사용하는 웹앱과 학습 게임입니다. GitHub의 <code>main</code> 변경 사항은 Cloudflare Pages를 통해 자동 배포됩니다.</p>
    <section id="games" class="games" aria-label="게임 목록">
      <a href="/kfc/"><strong>KFC 게임</strong><span>기존 배포 게임</span></a>
      <a href="/frog-actions/"><strong>개구리는 무엇을 할까요?</strong><span>개구리의 이미지·소리·글자를 연결하며 10가지 행동을 익히는 학습 앱</span></a>
    </section>
    <p id="status" class="status">게임 목록을 확인하는 중입니다.</p>
    <footer>THE JARAM · games.thejaram.quest</footer>
  </main>
  <script>
    (async()=>{
      const box=document.getElementById('games');
      const status=document.getElementById('status');
      try{
        const res=await fetch('/registry.json',{cache:'no-store'});
        if(!res.ok) throw new Error('registry load failed');
        const data=await res.json();
        const games=(data.games||[]).filter(g=>g.status==='published');
        if(!games.length) throw new Error('empty registry');
        box.replaceChildren(...games.map(g=>{
          const a=document.createElement('a');
          a.href=`/${g.slug}/`;
          const strong=document.createElement('strong');
          strong.textContent=g.title;
          const span=document.createElement('span');
          span.textContent=g.description||'';
          a.append(strong,span);
          return a;
        }));
        status.textContent=`현재 ${games.length}개의 게임이 등록되어 있습니다.`;
      }catch(e){
        status.textContent='게임 목록 자동 불러오기에 실패해 기본 목록을 표시하고 있습니다.';
      }
    })();
  </script>
</body>
</html>
